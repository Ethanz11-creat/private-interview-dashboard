<svg xmlns="http://www.w3.org/2000/svg" width="930" height="625" viewBox="0 0 930 625" role="img" aria-labelledby="title"><title id="title">MHA GQA MLA 的缓存组织与显存算例</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#347080"/></marker></defs><style>text{font-family:'Avenir Next','PingFang SC','Microsoft YaHei',sans-serif;font-size:20px;fill:#244451}.heading{font-size:26px;font-weight:650}.small{font-size:17px;fill:#59737e}.node{fill:white;stroke:#8aacb4;stroke-width:1.5}.accent{fill:#eaf5f5;stroke:#347080;stroke-width:2}.lane{fill:#f5f9f8;stroke:#d0e0e2;stroke-width:1.5}.edge{fill:none;stroke:#347080;stroke-width:2}.skip{fill:none;stroke:#a97530;stroke-width:2;stroke-dasharray:6 4}.cell{fill:#d8ecee;stroke:white;stroke-width:2}.masked{fill:#eceeee;stroke:white;stroke-width:2}</style><rect width="930" height="625" fill="white"/><text x="465" y="44" class="heading" text-anchor="middle">缓存组织变了：共享 heads 与压缩 latent 是两种机制</text><rect x="25" y="86" width="278" height="337" rx="9" class="lane"/><text x="164" y="125" class="heading" text-anchor="middle">MHA</text><text x="164" y="164" class="small" text-anchor="middle">每 head 独立 K / V</text><rect x="47" y="191" width="234" height="38" rx="9" class="node"/><text x="164" y="217" class="" text-anchor="middle">head 1：K、V</text><rect x="47" y="240" width="234" height="38" rx="9" class="node"/><text x="164" y="266" class="" text-anchor="middle">head 2：K、V</text><rect x="47" y="289" width="234" height="38" rx="9" class="node"/><text x="164" y="315" class="" text-anchor="middle">head 3：K、V</text><rect x="47" y="338" width="234" height="38" rx="9" class="node"/><text x="164" y="364" class="" text-anchor="middle">head 4：K、V</text><text x="164" y="401" class="small" text-anchor="middle">每一层、每个历史 token</text><rect x="328" y="86" width="278" height="337" rx="9" class="lane"/><text x="467" y="125" class="heading" text-anchor="middle">GQA</text><text x="467" y="164" class="small" text-anchor="middle">每组共享 K / V</text><rect x="350" y="191" width="234" height="65" rx="9" class="node"/><text x="467" y="230.5" class="" text-anchor="middle">group 1：K、V</text><rect x="350" y="280" width="234" height="65" rx="9" class="node"/><text x="467" y="319.5" class="" text-anchor="middle">group 2：K、V</text><text x="467" y="401" class="small" text-anchor="middle">每一层、每个历史 token</text><rect x="631" y="86" width="278" height="337" rx="9" class="lane"/><text x="770" y="125" class="heading" text-anchor="middle">MLA</text><text x="770" y="164" class="small" text-anchor="middle">保存潜表示与位置分量</text><rect x="653" y="191" width="234" height="75" rx="9" class="accent"/><text x="770" y="223" class="" text-anchor="middle">latent c</text><text x="770" y="248" class="" text-anchor="middle">例如 512 维</text><rect x="653" y="289" width="234" height="66" rx="9" class="node"/><text x="770" y="316.5" class="" text-anchor="middle">RoPE 分量</text><text x="770" y="341.5" class="" text-anchor="middle">例如 64 维</text><text x="770" y="401" class="small" text-anchor="middle">每一层、每个历史 token</text><rect x="65" y="459" width="800" height="135" rx="9" class="accent"/><text x="465" y="508.5" class="" text-anchor="middle">标准 KV 示例：8K tokens · 32 层 · head_dim 128 · FP16</text><text x="465" y="533.5" class="" text-anchor="middle">32 KV heads → 4 GiB　 /　 8 KV heads → 1 GiB</text><text x="465" y="558.5" class="" text-anchor="middle">MLA 使用自己的缓存维度计算，不能套用 head 数量比例</text></svg>