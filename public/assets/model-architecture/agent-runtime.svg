<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640" role="img" aria-labelledby="title"><title id="title">模型与知识管理 Agent 运行时闭环</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#347080"/></marker></defs><style>text{font-family:'Avenir Next','PingFang SC','Microsoft YaHei',sans-serif;font-size:20px;fill:#244451}.heading{font-size:26px;font-weight:650}.small{font-size:17px;fill:#59737e}.node{fill:white;stroke:#8aacb4;stroke-width:1.5}.accent{fill:#eaf5f5;stroke:#347080;stroke-width:2}.lane{fill:#f5f9f8;stroke:#d0e0e2;stroke-width:1.5}.edge{fill:none;stroke:#347080;stroke-width:2}.skip{fill:none;stroke:#a97530;stroke-width:2;stroke-dasharray:6 4}.cell{fill:#d8ecee;stroke:white;stroke-width:2}.masked{fill:#eceeee;stroke:white;stroke-width:2}</style><rect width="920" height="640" fill="white"/><text x="460" y="44" class="heading" text-anchor="middle">知识管理 Agent：模型生成请求，运行时执行与记录</text><rect x="30" y="90" width="860" height="208" rx="9" class="lane"/><text x="460" y="127" class="heading" text-anchor="middle">模型侧 · 一次或多次生成</text><rect x="55" y="162" width="245" height="97" rx="9" class="node"/><text x="177.5" y="205" class="" text-anchor="middle">用户问题 + 当前状态</text><text x="177.5" y="230" class="" text-anchor="middle">工具描述 + 已有证据</text><rect x="348" y="162" width="237" height="97" rx="9" class="accent"/><text x="466.5" y="205" class="" text-anchor="middle">模型前向 / 生成</text><text x="466.5" y="230" class="" text-anchor="middle">结构化动作请求</text><rect x="631" y="162" width="234" height="97" rx="9" class="node"/><text x="748" y="205" class="" text-anchor="middle">类型化候选</text><text x="748" y="230" class="" text-anchor="middle">补查 / 回答 / 升级</text><path d="M300 210H346" class="edge" marker-end="url(#a)"/><path d="M585 210H629" class="edge" marker-end="url(#a)"/><path d="M748 259V351" class="edge" marker-end="url(#a)"/><rect x="30" y="329" width="860" height="244" rx="9" class="lane"/><text x="460" y="365" class="heading" text-anchor="middle">运行时 · 校验、执行、状态与停止条件</text><rect x="629" y="397" width="237" height="108" rx="9" class="accent"/><text x="747.5" y="433" class="" text-anchor="middle">schema / 权限校验</text><text x="747.5" y="458" class="" text-anchor="middle">预算 / 超时</text><text x="747.5" y="483" class="" text-anchor="middle">允许后执行工具</text><rect x="349" y="397" width="237" height="108" rx="9" class="node"/><text x="467.5" y="433" class="" text-anchor="middle">检索结果 / 错误</text><text x="467.5" y="458" class="" text-anchor="middle">来源与时间</text><text x="467.5" y="483" class="" text-anchor="middle">写入正式状态</text><rect x="55" y="397" width="245" height="108" rx="9" class="node"/><text x="177.5" y="433" class="" text-anchor="middle">校验证据 / 引用</text><text x="177.5" y="458" class="" text-anchor="middle">够了就输出</text><text x="177.5" y="483" class="" text-anchor="middle">不足则补查</text><path d="M629 450H588" class="edge" marker-end="url(#a)"/><path d="M349 450H302" class="edge" marker-end="url(#a)"/><path d="M177 397V309H17V210H54" class="skip" marker-end="url(#a)"/><text x="460" y="610" class="small" text-anchor="middle">工具结果回填上下文，触发下一轮；外部执行不会自动改写模型权重。</text></svg>