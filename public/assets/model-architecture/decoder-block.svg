<svg xmlns="http://www.w3.org/2000/svg" width="920" height="880" viewBox="0 0 920 880" role="img" aria-labelledby="title"><title id="title">Decoder-only 主干与准确的双残差 block</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#347080"/></marker></defs><style>text{font-family:'Avenir Next','PingFang SC','Microsoft YaHei',sans-serif;font-size:20px;fill:#244451}.heading{font-size:26px;font-weight:650}.small{font-size:17px;fill:#59737e}.node{fill:white;stroke:#8aacb4;stroke-width:1.5}.accent{fill:#eaf5f5;stroke:#347080;stroke-width:2}.lane{fill:#f5f9f8;stroke:#d0e0e2;stroke-width:1.5}.edge{fill:none;stroke:#347080;stroke-width:2}.skip{fill:none;stroke:#a97530;stroke-width:2;stroke-dasharray:6 4}.cell{fill:#d8ecee;stroke:white;stroke-width:2}.masked{fill:#eceeee;stroke:white;stroke-width:2}</style><rect width="920" height="880" fill="white"/><text x="460" y="44" class="heading" text-anchor="middle">从完整生成主干，放大到一个 Decoder block</text><rect x="25" y="80" width="350" height="730" rx="9" class="lane"/><rect x="425" y="80" width="470" height="730" rx="9" class="lane"/><rect x="60" y="115" width="280" height="76" rx="9" class="node"/><text x="200" y="160" class="" text-anchor="middle">文本 → Token IDs</text><path d="M200 191V226" class="edge" marker-end="url(#a)"/><rect x="60" y="226" width="280" height="76" rx="9" class="node"/><text x="200" y="258.5" class="" text-anchor="middle">Embedding</text><text x="200" y="283.5" class="" text-anchor="middle">X: [B,T,d]</text><path d="M200 302V337" class="edge" marker-end="url(#a)"/><rect x="60" y="337" width="280" height="76" rx="9" class="accent"/><text x="200" y="382" class="" text-anchor="middle">Decoder block × L</text><path d="M200 413V448" class="edge" marker-end="url(#a)"/><rect x="60" y="448" width="280" height="76" rx="9" class="node"/><text x="200" y="493" class="" text-anchor="middle">Final Norm</text><path d="M200 524V559" class="edge" marker-end="url(#a)"/><rect x="60" y="559" width="280" height="76" rx="9" class="node"/><text x="200" y="591.5" class="" text-anchor="middle">词表投影</text><text x="200" y="616.5" class="" text-anchor="middle">logits: [B,T,V]</text><path d="M200 635V670" class="edge" marker-end="url(#a)"/><rect x="60" y="670" width="280" height="76" rx="9" class="node"/><text x="200" y="702.5" class="" text-anchor="middle">末尾位置采样</text><text x="200" y="727.5" class="" text-anchor="middle">追加一个新 token</text><text x="660" y="111" class="heading" text-anchor="middle">单层 Pre-Norm 的两次更新</text><rect x="463" y="135" width="327" height="73" rx="9" class="node"/><text x="626.5" y="178.5" class="" text-anchor="middle">输入 x: [B,T,d]</text><path d="M626 208V244" class="edge" marker-end="url(#a)"/><rect x="463" y="244" width="327" height="73" rx="9" class="node"/><text x="626.5" y="275" class="" text-anchor="middle">RMSNorm → Q / K / V</text><text x="626.5" y="300" class="" text-anchor="middle">Q、K 上施加 RoPE</text><path d="M626 317V353" class="edge" marker-end="url(#a)"/><rect x="463" y="353" width="327" height="73" rx="9" class="accent"/><text x="626.5" y="396.5" class="" text-anchor="middle">因果 Self-Attention → W_O</text><path d="M626 426V462" class="edge" marker-end="url(#a)"/><rect x="463" y="462" width="327" height="73" rx="9" class="node"/><text x="626.5" y="505.5" class="" text-anchor="middle">+ x → u</text><path d="M626 535V571" class="edge" marker-end="url(#a)"/><rect x="463" y="571" width="327" height="73" rx="9" class="accent"/><text x="626.5" y="614.5" class="" text-anchor="middle">RMSNorm → FFN / MoE</text><path d="M626 644V680" class="edge" marker-end="url(#a)"/><rect x="463" y="680" width="327" height="73" rx="9" class="node"/><text x="626.5" y="723.5" class="" text-anchor="middle">+ u → y，进入下一层</text><path d="M340 375H413V134H461" class="skip" marker-end="url(#a)"/><path d="M790 172H851V498H791M790 498H834V716H791" class="skip" marker-end="url(#a)"/><text x="460" y="850" class="small" text-anchor="middle">每次子层更新后，主干都回到 [B,T,d]，才能做残差相加。</text></svg>