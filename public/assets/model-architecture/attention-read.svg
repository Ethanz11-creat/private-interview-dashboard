<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title"><title id="title">因果 mask 与加权读取示例</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#347080"/></marker></defs><style>text{font-family:'Avenir Next','PingFang SC','Microsoft YaHei',sans-serif;font-size:20px;fill:#244451}.heading{font-size:26px;font-weight:650}.small{font-size:17px;fill:#59737e}.node{fill:white;stroke:#8aacb4;stroke-width:1.5}.accent{fill:#eaf5f5;stroke:#347080;stroke-width:2}.lane{fill:#f5f9f8;stroke:#d0e0e2;stroke-width:1.5}.edge{fill:none;stroke:#347080;stroke-width:2}.skip{fill:none;stroke:#a97530;stroke-width:2;stroke-dasharray:6 4}.cell{fill:#d8ecee;stroke:white;stroke-width:2}.masked{fill:#eceeee;stroke:white;stroke-width:2}</style><rect width="900" height="540" fill="white"/><text x="450" y="42" class="heading" text-anchor="middle">因果注意力：先算匹配权重，再汇总 V</text><text x="218" y="99" class="" text-anchor="middle">可见位置矩阵（行 i 读取列 j）</text><rect x="105" y="140" width="75" height="75" class="cell"/><text x="142" y="186" class="small" text-anchor="middle">可读</text><rect x="180" y="140" width="75" height="75" class="masked"/><text x="217" y="186" class="small" text-anchor="middle">屏蔽</text><rect x="255" y="140" width="75" height="75" class="masked"/><text x="292" y="186" class="small" text-anchor="middle">屏蔽</text><rect x="105" y="215" width="75" height="75" class="cell"/><text x="142" y="261" class="small" text-anchor="middle">可读</text><rect x="180" y="215" width="75" height="75" class="cell"/><text x="217" y="261" class="small" text-anchor="middle">可读</text><rect x="255" y="215" width="75" height="75" class="masked"/><text x="292" y="261" class="small" text-anchor="middle">屏蔽</text><rect x="105" y="290" width="75" height="75" class="cell"/><text x="142" y="336" class="small" text-anchor="middle">可读</text><rect x="180" y="290" width="75" height="75" class="cell"/><text x="217" y="336" class="small" text-anchor="middle">可读</text><rect x="255" y="290" width="75" height="75" class="cell"/><text x="292" y="336" class="small" text-anchor="middle">可读</text><text x="142" y="126" class="small" text-anchor="middle">联想</text><text x="55" y="185" class="small" text-anchor="middle">联想</text><text x="217" y="126" class="small" text-anchor="middle">总部</text><text x="55" y="260" class="small" text-anchor="middle">总部</text><text x="292" y="126" class="small" text-anchor="middle">位于</text><text x="55" y="335" class="small" text-anchor="middle">位于</text><text x="664" y="101" class="" text-anchor="middle">末尾 query 读取所有合法位置</text><rect x="472" y="140" width="386" height="76" rx="9" class="accent"/><text x="665" y="172.5" class="" text-anchor="middle">q₃ · k₁ / k₂ / k₃</text><text x="665" y="197.5" class="" text-anchor="middle">缩放 → softmax</text><path d="M665 216V258" class="edge" marker-end="url(#a)"/><rect x="472" y="260" width="386" height="66" rx="9" class="node"/><text x="665" y="300" class="" text-anchor="middle">示例权重：0.1 / 0.7 / 0.2</text><path d="M665 326V373" class="edge" marker-end="url(#a)"/><rect x="430" y="375" width="450" height="77" rx="9" class="accent"/><text x="655" y="420.5" class="" text-anchor="middle">输出 = 0.1 v₁ + 0.7 v₂ + 0.2 v₃</text><text x="224" y="421" class="small" text-anchor="middle">未来位置在 softmax 前设为 −∞</text><text x="450" y="509" class="small" text-anchor="middle">所有行在训练时并行计算；未来 token 不能进入当前行。</text></svg>