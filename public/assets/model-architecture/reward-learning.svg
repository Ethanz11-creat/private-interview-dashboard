<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title"><title id="title">GRPO 采样评分与更新策略闭环</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#347080"/></marker></defs><style>text{font-family:'Avenir Next','PingFang SC','Microsoft YaHei',sans-serif;font-size:20px;fill:#244451}.heading{font-size:26px;font-weight:650}.small{font-size:17px;fill:#59737e}.node{fill:white;stroke:#8aacb4;stroke-width:1.5}.accent{fill:#eaf5f5;stroke:#347080;stroke-width:2}.lane{fill:#f5f9f8;stroke:#d0e0e2;stroke-width:1.5}.edge{fill:none;stroke:#347080;stroke-width:2}.skip{fill:none;stroke:#a97530;stroke-width:2;stroke-dasharray:6 4}.cell{fill:#d8ecee;stroke:white;stroke-width:2}.masked{fill:#eceeee;stroke:white;stroke-width:2}</style><rect width="900" height="620" fill="white"/><text x="450" y="44" class="heading" text-anchor="middle">GRPO：对同一问题的一组回答作相对比较</text><rect x="55" y="86" width="790" height="64" rx="9" class="node"/><text x="450" y="125" class="" text-anchor="middle">问题 x → 当前策略采样 4 条回答</text><path d="M450 150V192" class="edge" marker-end="url(#a)"/><rect x="45" y="194" width="165" height="95" rx="9" class="node"/><text x="127.5" y="236" class="" text-anchor="middle">回答 1</text><text x="127.5" y="261" class="" text-anchor="middle">奖励 r = 0</text><rect x="260" y="194" width="165" height="95" rx="9" class="node"/><text x="342.5" y="236" class="" text-anchor="middle">回答 2</text><text x="342.5" y="261" class="" text-anchor="middle">奖励 r = 0</text><rect x="475" y="194" width="165" height="95" rx="9" class="accent"/><text x="557.5" y="236" class="" text-anchor="middle">回答 3</text><text x="557.5" y="261" class="" text-anchor="middle">奖励 r = 1</text><rect x="690" y="194" width="165" height="95" rx="9" class="accent"/><text x="772.5" y="236" class="" text-anchor="middle">回答 4</text><text x="772.5" y="261" class="" text-anchor="middle">奖励 r = 1</text><path d="M450 289V333" class="edge" marker-end="url(#a)"/><rect x="55" y="335" width="790" height="90" rx="9" class="accent"/><text x="450" y="374.5" class="" text-anchor="middle">组均值 0.5 → 用奖励差估计相对优势</text><text x="450" y="399.5" class="" text-anchor="middle">高于均值的样本被鼓励，低于均值的样本被抑制</text><path d="M450 425V464" class="edge" marker-end="url(#a)"/><rect x="160" y="466" width="580" height="74" rx="9" class="node"/><text x="450" y="510" class="" text-anchor="middle">计算策略优化目标 → 更新权重</text><path d="M740 503H872V118H846" class="skip" marker-end="url(#a)"/><text x="450" y="590" class="small" text-anchor="middle">更新后的策略进入下一轮采样；同组全同分时相对信号不足。</text></svg>