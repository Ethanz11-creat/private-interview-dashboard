    <section id="first"><div class="rendered"><h2>1. 第一项目：Voyager 业务信息查询 Agent</h2>
<div class="project-mode-label quick"><b>现场速答区</b><span>先根据问题使用 30 秒、90 秒或白板版本；面试官继续追问时，再进入下方完整深挖知识库。</span></div>
<h3>1.1 30 秒版本</h3>
<blockquote>
<p>这是一个面向自动驾驶业务管理者的信息查询 Agent。管理者在 D-Chat 中用自然语言询问版本进展、需求风险或指标变化，背后需要跨 Cooper、任务系统和数据系统查询。难点不在单次调用工具，而在复杂问题会跨多轮、多源：模型容易选错工具、查完忘记目标，或证据不全就回答。我的核心工作是设计信息查询的有状态控制链路，把问题拆成可验收的事实任务，在每次工具调用后更新进度和证据，最后按任务覆盖与来源校验决定继续补查、正常回答还是降级说明。</p>
</blockquote>
<h3>1.2 推荐的 90 秒版本</h3>
<blockquote>
<p>我在滴滴做的第一个项目是面向业务管理者的信息查询 Agent。业务背景是文档、版本需求、任务进展和指标报表分散在多个内部系统里，管理者问“这个版本有没有上线风险”时，真正需要的不是一段泛化总结，而是要先确认版本范围，再看未完成任务、阻塞项和相关指标，最后给出有来源的结论。  </p>
<p>我负责的重点是查询链路的有状态管理。原始 Agent Runtime 已经具备 ReAct 式的模型调用和工具执行能力，但仅靠模型在对话里记住进度，会出现工具选择不稳定、查漏、以及证据不足就提前结束的问题。为此我把一次查询抽象为一个 <code>Goal</code> 和 1 到 5 个可独立验收的事实任务；状态里保存原始问题、明确约束、任务状态、工具尝试、标准化结果、证据和当前决策。  </p>
<p>在运行上，首先用规则处理精确链接、明确数据源等确定场景；复杂或有指代的问题再让模型做结构化补全和任务拆解。之后每轮模型调用前，Controller 根据状态生成当前进度、待补事实和本轮可见的只读工具。工具执行前检查白名单、参数、重复调用、预算和依赖；执行后把不同数据源的返回归一为证据，并更新对应任务。最后不是由模型自己宣称“查完了”，而是重新检查任务覆盖和来源引用，决定继续补查、生成正常回答，还是明确告知哪些事实没有确认。  </p>
<p>技术上我是在阶段式 Agent Runtime 上做这层控制：上下文构建、模型决策、工具执行、观察回填、检查点和收尾是分开的，所以查询控制可以插入关键生命周期，而不改写底座。这个项目让我最关注的是：如何把 LLM 的开放式推理收敛成可观测、可核验的业务查询流程。</p>
</blockquote>
<h3>1.3 白板图：从一句问题到可核验答案</h3>
<div class="project-board">

</div>
<p class="note"><b>白板讲法：</b>先画主链路，再补一句“模型提出建议，Runtime 通过 Controller 应用状态；模型不能自己宣布任务完成”。最后说明这层控制是建立在 GoClaw 原有 Agent Pipeline、Session、Context 和 Memory 底座之上的业务查询专项设计。</p>
<h3>1.4 如果被问“你的状态具体是什么”</h3>
<blockquote>
<p>我会把状态分成查询级和任务级。查询级保留用户原问题与明确约束作为运行依据，正式查询状态保存消歧后的目标、任务、当前决策和续跑次数；预算由 Runtime 管理。任务级保存每个待确认事实、状态、Observation 和 Evidence ID，已尝试来源可以由 Observation 追溯。任务状态统一为 pending、in_progress、satisfied、blocked；工具的 transient_failure 等失败类型另行记录，不与任务状态混用。这样一次工具失败不会让整个查询丢失，也不会因为某个任务完成就误以为整题完成。</p>
</blockquote>
<p>不要把这些状态说成“模型思维链”。它们是 Runtime 自己维护的业务状态；模型只读取本轮必要的进度摘要，不能直接随意改正式状态。</p>
<h3>1.5 如果被问“状态存在哪里，断了怎么恢复”</h3>
<blockquote>
<p>这里要先区分运行状态和会话状态。<code>goclaw</code> 的 <code>RunState</code> 是一次 Run 内的共享内存状态，贯穿 Context、Think、Tool、Observe 等阶段；现有 Runtime 会在固定迭代间隔把待持久化的消息写入 Session，用于保留会话和故障排查。  </p>
<p>对信息查询专项，我设计的 <code>InfoQueryState</code> 是运行控制的数据模型。跨进程重启后的业务查询续跑不能只依靠内存，因此在持久化设计中，把 QueryRun、QueryTask、Observation、Evidence 以 Run ID / Task ID / ToolCall ID 关联保存。恢复时重建已提交的任务进度、复用仍有效的证据，再决定哪些未完成调用需要重试；不是把已完成任务全部重新执行。Runtime 原有的 Session 检查点负责消息保存，查询业务状态及证据的一致提交则由专项设计补齐，具体故障点与恢复动作见第 07 节。</p>
</blockquote>
<h3>1.6 高概率深挖与答题骨架</h3>
<table>
<thead>
<tr>
<th>面试官可能追问</th>
<th>应答核心</th>
</tr>
</thead>
<tbody><tr>
<td>为什么需要有状态管理？</td>
<td>复杂查询跨轮跨源，纯 ReAct 的上下文易丢目标、重复调用、证据不足即结束。状态将“目标、进度、缺口、证据、决策”从模型记忆转为可控数据。</td>
</tr>
<tr>
<td>为什么不是 Plan-and-Execute？</td>
<td>不是二选一。初始化阶段用结构化模型形成轻量 Plan，即 1 到 5 个事实任务；执行过程仍是 ReAct，允许根据真实工具结果补查或换源。固定长计划对动态业务数据脆弱，纯 ReAct 又缺收敛，因此采用“轻计划 + 有状态反馈循环”。</td>
</tr>
<tr>
<td>如何判断是否需要查询？</td>
<td>优先确定性规则：精确链接/资源 ID、明确系统或明确事实槽位；其他歧义管理问题再由结构化模型判断、补全指代或追问。规则负责稳定可编码的判断，模型负责语义理解。</td>
</tr>
<tr>
<td>任务怎么拆，如何防止拆偏？</td>
<td>任务必须是能独立验证的事实，保留原问题中的版本、时间、指标、人员等显式约束；校验任务数、重复性、未消解指代和约束丢失。模型输出不合格可修复一次，仍失败则降级为原问题的单任务或澄清。</td>
</tr>
<tr>
<td>如何避免模型乱调工具？</td>
<td>模型只看到本轮允许的工具；执行前再校验工具白名单、只读性质、参数、重复、预算与依赖。可见不等于可执行，失败必须作为 observation 回填，不能伪装成事实。</td>
</tr>
<tr>
<td>哪些工具并行，哪些串行？</td>
<td>没有数据依赖的只读查询可并行，例如分别读取需求状态和报表；下游依赖上游 ID/结果的查询必须串行，例如先确定版本范围再查该版本任务。<code>goclaw</code> 也将并行 I/O 和顺序状态更新拆开，避免并发改写共享状态。</td>
</tr>
<tr>
<td>如何定义“查完了”？</td>
<td>不是模型说“完成”。Controller 检查每个任务的必要事实是否被可信证据覆盖、关键来源是否存在、是否仍有 pending/blocked 任务；全满足才回答，部分缺失则补查或给带边界的降级回答。</td>
</tr>
<tr>
<td>工具返回格式不同怎么办？</td>
<td>在工具返回后做 Normalizer，把来源、实体/时间范围、字段、原始链接、可信度/错误原因统一为 QueryObservation 和 Evidence。答案只引用标准化后、可追溯的证据。</td>
</tr>
<tr>
<td>工具失败、超时或查不到怎么办？</td>
<td>记录失败来源、参数和错误，不将失败当空结果；若有合法替代源则继续补查，否则标记任务 blocked，最终说明已确认部分与未确认原因。对写操作还需幂等键和人工确认；信息查询一期优先收敛为只读工具。</td>
</tr>
<tr>
<td>如何评测这条链路？</td>
<td>分“结果”和“过程”：结果看事实正确、来源覆盖、回答质量；过程看工具选择、参数、任务覆盖、重复调用、异常降级和稳定性。74 题集合可作为场景资产，但只有在能说明真值、判分规则、实际运行范围和结果时才主动报数。</td>
</tr>
</tbody></table>

<section class="deep-dive first-project-library" id="topic-origin" aria-label="第一项目统一知识库">
  <header><h3>1.7 Voyager 完整设计：业务查询、群聊记忆与评测闭环</h3><p>完整设计与底座适配说明。设计章节解释为什么这样做、怎样运行和如何处理异常；结果章节单独记录已有评测数据。</p></header>
  <div class="deep-body">
    <h4>01 · 业务目标、总体架构与我的设计范围</h4>
    <div class="design-prose">
      <p>这个项目要把分散在文档、任务系统和报表中的业务信息组织成可核验的回答。管理者问“0701 版本有没有上线风险”，实际需要同时确认对象范围、未完成事项、上线条件和相关指标。单个数据源的一次检索不足以回答；模型会调用工具，也不等于系统知道整道问题已经查完。因此我的设计围绕三件事展开：用有状态控制让查询收敛，用分作用域记忆保证连续对话与隔离，用端到端评测检查完整链路。</p>
      <p><b>我的设计范围：</b>在通用 Agent Runtime 之上设计查询中间件，维护 Goal、Task、Observation、Evidence 与 Decision；把改写、路由、Skill 和工具治理串入查询生命周期；面向多人群聊设计群共享会话、按真实发送者加载的个人记忆和群公共记忆；用固定问题集、规则判分与 LLM Judge 检查结果和稳定性。通用模型适配、原有 Pipeline、Session Store 等属于复用基础，不能与自己的业务设计混为一谈。</p>
      <p><b>整体依赖：</b>渠道适配器把 D-Chat、Web 等入口统一成带 Tenant、Bot、Sender、会话位置和原始消息的请求；Runtime 负责队列、取消、预算、模型和工具执行；Controller 在关键位置读取业务状态并返回更新与下一步；工具适配层查询外部系统；证据存储、Session 和长期记忆承担不同的数据生命周期。这里的分层是职责划分，不要求拆成多个独立服务。</p>
      <p><b>多渠道如何保持一致：</b>渠道只负责身份验证、消息去重、输入规范化和结果投递，不各写一套查询逻辑。同一用户跨渠道只有经过账号绑定才能认定为同一身份，不能根据显示名称合并。渠道消息 ID 用于入口防重，SessionKey 用于续接历史，QueryRunID 用于跟踪本次业务任务，三种标识各司其职。消息重投不应创建重复查询；用户主动再次问同一问题则可创建新 Run，重新核对时效。</p>
    </div>
    <p class="deep-intro"><b>最容易被问混的问题：</b>“你们到底是自己写的 Agent，还是基于别人的项目改的？”准确口径是：前期 VSA PoC 是 Go + Eino ADK + MCP 的业务验证；GoClaw 是后续作为通用 Agent Runtime / 多租户底座进行源码研究和架构参考的项目；本次信息查询专项是在阶段式底座上增加查询状态、Controller、来源路由、工具治理和证据验收。不能把三者压成一句“我从零做了 GoClaw”。</p>
    <div class="layer-diagram">
      <div class="layer-box"><h5>前期 VSA PoC</h5><p>Go + Eino ADK + MCP；D-Chat 私聊/群聊；接入 Cooper、Spaceway、数易；约 36 个工具、10 个 Skill；单 Go 二进制。重点是验证真实数据源能不能接入，以及私聊、群聊和工具链能不能跑通。</p></div>
      <div class="layer-arrow">→</div>
      <div class="layer-box center"><h5>当前信息查询专项</h5><p>面向自动驾驶业务管理者，把“模型自己决定何时结束”的开放式查询改造成“Controller 根据 Goal、Task、Evidence 决定是否结束”的可核验流程。新增逻辑包括查询入口判断、状态初始化、每轮进度投影、工具前校验、工具后归一化、完成验收和最终回答校验。</p></div>
      <div class="layer-arrow">→</div>
      <div class="layer-box"><h5>GoClaw 通用底座</h5><p>Go 多租户 Agent Gateway，提供阶段式 Pipeline、RunState、Session、Context、Workspace、Skill、Tool、MCP、Checkpoint、PostgreSQL/pgvector、RBAC 和记忆整理能力。它受 OpenClaw 架构启发，但不是官方 Go 版，也不是简单翻译。</p></div>
    </div>
    <div class="project-grid">
      <article class="deep-card self"><h5>我负责的业务设计</h5><p>主要包括信息查询的 Query Gate、InfoQueryState、Controller 生命周期、Query Rewrite 与来源路由、Skill/Tool 治理、Evidence 和完成验收，以及面向 D-Chat 多群聊的 Session/Memory/Workspace 作用域设计。这些章节按已经确定的目标方案展开；持久化恢复和评测接入也纳入完整设计，实际验证记录集中放在评测章节。</p></article>
      <article class="deep-card base"><h5>复用的原有底座能力</h5><p>GoClaw 的 Agent Pipeline、RunState、ContextStage、Prune、Think、Tool、Observe、Checkpoint、Finalize、Session Store、Workspace Resolver、基础记忆整理、Skill/Tool/MCP Registry、权限和可观测性。面试时要说明“我把专项控制插入这些生命周期”，而不是声称从零重写底座。</p></article>
    </div>

    <h4 id="topic-product" class="chapter-subheading">业务场景与总体架构的依赖关系</h4>
    <p class="deep-intro"><b>产品定位：</b>它是部署在后端、通过 D-Chat 服务自动驾驶业务管理者的智能工作助手。用户用自然语言问版本进展、需求风险、任务状态、指标变化；Agent 按需连接 Cooper、Spaceway、数易等内部系统，拆解复杂问题、融合多源信息、核对证据，最后给出可追溯的结论。</p>
    <div class="project-grid">
      <article class="deep-card self"><h5>核心需求 ①：管理问题理解</h5><p>“0701 版本现在怎么样”“无人化相关需求有没有风险”“最近指标变化影响大不大”都不是简单的关键词检索。系统要判断用户真正关心的是版本进展、交付风险、需求背景、指标变化，还是需要综合决策信息。</p></article>
      <article class="deep-card self"><h5>核心需求 ②：多源检索与融合</h5><p>Cooper 更接近产品文档和方案知识，Spaceway 更接近需求、任务和状态，数易更接近指标、数据和报表。不同系统返回的字段、对象 ID、时间口径都不同，不能把多个原始返回直接拼接给模型。</p></article>
      <article class="deep-card self"><h5>核心需求 ③：结论和证据链</h5><p>回答以结论为主，但每个关键判断都要能够回到具体的文档、任务或报表。来源至少要保留平台、一级/二级信息源、资源 ID、标题、URL 和更新时间；没有 URL 时也要展示平台、路径和资源标识。</p></article>
      <article class="deep-card self"><h5>核心需求 ④：复杂问题拆解</h5><p>“这个版本有没有上线风险”至少要拆成版本范围确认、需求状态、未完成事项、关键指标、风险归因和下一步建议。拆出来的任务必须能独立查询和验收，不能只生成一段看似完整的计划文本。</p></article>
      <article class="deep-card base"><h5>查询主线与扩展边界</h5><p>当前目标设计包含多用户/多群聊的身份和记忆治理，查询能力优先收敛为只读、可审计、可降级的链路。跨团队 A2A、数据安全分级、定时汇总和文档写入保留为扩展方向；它们需要额外的授权、任务调度和副作用控制，不能只增加几个工具名就视为完成。</p></article>
      <article class="deep-card base"><h5>交付与迭代怎么衔接</h5><p>先打通真实来源和查询闭环，再将问题集、Trace 与回放纳入持续迭代，检查准确性、稳定性、延迟和 Token 成本。评测是贯穿迭代的验证能力；各阶段的设计、已提供结果和仍需核对的实验口径集中在评测章节，避免与架构说明交叉打断。</p></article>
    </div>

    <h4 id="topic-product-capabilities" class="chapter-subheading">底座适配：六类可复用能力</h4>
    <div class="layer-diagram">
      <div class="layer-box"><h5>① 入口与会话</h5><p>D-Chat / Web 接入、身份识别、DM/群聊定位、消息标准化、Session 创建/续接/重置。</p></div>
      <div class="layer-arrow">→</div>
      <div class="layer-box center"><h5>② Agent 执行</h5><p>Agent 配置、Context 构建与压缩、模型/Provider 路由、Function-calling ReAct、队列、取消、超时和 Run 状态。</p></div>
      <div class="layer-arrow">→</div>
      <div class="layer-box"><h5>③ 工具与外部系统</h5><p>Tool Registry、MCP Manager/Bridge、Skill 搜索、文件与 Workspace、浏览器、多模态、工具结果回填。</p></div>
    </div>
    <div class="layer-diagram">
      <div class="layer-box"><h5>④ 记忆与知识</h5><p>Working/Session、Episodic、Semantic/KG、检索、渐进式加载、作用域与生命周期治理。</p></div>
      <div class="layer-arrow">↔</div>
      <div class="layer-box center"><h5>⑤ 协作与自动化</h5><p>Cron、Heartbeat、Webhook、多 Agent 委派、Team Tasks、结果回收、取消和通知。</p></div>
      <div class="layer-arrow">↔</div>
      <div class="layer-box"><h5>⑥ 安全与治理</h5><p>RBAC、ToolAllow/AllowedTools、参数校验、命令审批、输入防护、沙箱、Trace、审计、用量和备份。</p></div>
    </div>
    <table class="deep-table"><thead><tr><th>业务场景</th><th>核心依赖</th><th>在本项目中的实际产出</th></tr></thead><tbody>
      <tr><td>信息查询</td><td>入口与会话、Agent 执行、工具系统、记忆与知识、安全治理</td><td>识别管理问题意图；拆解事实任务；查询 Cooper/Spaceway/数易；融合证据并输出风险、结论和建议。</td></tr>
      <tr><td>多用户/多群聊</td><td>入口与会话、Context、Memory、Workspace、安全治理</td><td>群内近期对话共享；个人 Memory 按真实 Sender 隔离；群公共 Memory 和文件不跨群；工具和审计归真实操作者。</td></tr>
      <tr><td>A2A</td><td>Agent 执行、工具、记忆、协作、安全</td><td>将复杂问题委派给专业 Agent，校验返回证据、对齐口径并记录委派链路；属于预留扩展方向。</td></tr>
      <tr><td>自动化</td><td>Agent 执行、工具、记忆、协作、安全</td><td>定时查询、汇总、提醒、跟踪和写入文档；高风险写操作必须人工确认，属于后续阶段。</td></tr>
    </tbody></table>
    <div class="answer-script"><b>面试讲法：</b>“我先把它当成一个业务产品，而不是几个 MCP 的集合。入口与会话解决谁在什么场景提问，Agent 执行负责把一次 Run 跑起来，工具层负责访问内部系统，记忆层负责跨轮连续性，治理层负责权限、审计和风险边界。信息查询场景必须同时依赖这几层，所以我做的是在通用底座上补一条业务控制链路。”</div>

    <div class="knowledge-topic topic-controller" id="topic-controller">
      <h4>02 · 有状态查询控制：Controller 如何协同 Runtime</h4>
      <div class="design-prose">
        <h5>为什么把控制放在生命周期上，而不只写进 Prompt</h5>
        <p>Prompt 可以要求模型“多查一次”“不要编造”，却无法替代执行前授权、可靠状态提交和停止条件。模型可能在不同轮次给出不一致的判断，历史压缩也可能省略失败记录。我的做法是在每次真正执行或输出之前设置控制点：模型提出意图和调用建议，Controller 按业务规则检查，Runtime 才执行。这样模型仍有根据新证据调整路线的灵活性，但不能绕过预算、权限或证据要求。</p>
        <p>Controller 是逻辑控制层，可以用中间件、Pipeline Hook 或普通函数实现。它不需要单独开一个服务，也不替换 GoClaw 的整个循环。三个主要依赖是结构化模型、结果 Normalizer 和 Evidence Store：复杂语义由模型提出结构化候选，格式和明确约束由代码校验，跨来源返回由 Normalizer 统一，原始依据由 Evidence Store 保存。</p>
        <table class="deep-table"><thead><tr><th>角色</th><th>拥有的职责</th><th>不能越过的边界</th></tr></thead><tbody>
          <tr><td>模型</td><td>理解问题、建议任务拆分、选择工具、解释证据、生成候选回答。</td><td>输出都是待检查的建议；不能直接写正式状态、放宽权限或批准自己的最终回答。</td></tr>
          <tr><td>Controller</td><td>读取正式状态与证据，计算覆盖和可恢复路径，返回 StatePatch 与 NextAction。</td><td>不能把自然语言理解全部伪装成确定性算法；语义判断仍需模型辅助和验证。</td></tr>
          <tr><td>Runtime</td><td>先应用允许的状态增量，再执行动作；维护预算、取消、工具调度、结果回填和持久化。</td><td>程序正常退出不等于业务查询成功；收到回答候选还必须走完成验收。</td></tr>
        </tbody></table>
        <p><b>一次状态提交的顺序：</b>工具结果到达后，先核对 TaskID、ToolCallID、RequestKey 是否属于本 Run 的已调度请求，再归一化和保存证据。Controller 返回“追加 Observation、更新任务状态”的补丁，Runtime 应用补丁后才进入下一轮。并行查询可以同时等待网络，但正式状态提交按顺序处理；同一结果重复到达按调用标识去重，不能把一份证据算成多份独立依据。</p>
        <p><b>为什么先写状态、后执行动作：</b>如果先让模型进入下一轮，模型可能读到旧进度，重复查已完成任务。补丁先提交，PrepareQueryRound 才能基于一致状态重算缺口。如果持久化失败，则停止推进或明确降级，不能在未保存状态上继续宣称支持可靠恢复。持久化需要的版本号、原子提交与故障点在第 07 节展开。</p>
      </div>
      <div class="deep-grid">
        <article class="deep-card"><h5>原有 Agent 能做什么</h5><p>原有 Eino / GoClaw Runtime 已经能完成 ReAct 基本闭环：模型生成 Tool Call，Runtime 执行工具，把 Tool Result 回填上下文，再让模型继续思考，直到模型生成回答或循环结束。它解决“能不能调用工具”的问题，但不天然知道业务问题应该拆成哪些事实、每个事实是否已被证据覆盖，也不会自动区分无结果、无权限、参数错误和数据源不可用。</p></article>
        <article class="deep-card"><h5>只靠模型会出现什么问题</h5><ul><li>上一轮查到了什么只存在长上下文里，模型可能忘记目标或重复调用。</li><li>模型看到一个结果就提前回答，无法证明所有子问题都覆盖。</li><li>工具描述和 Skill 说明不一致时，模型可能填错参数或选错来源。</li><li>搜索结果不是正文证据，权限或资源类型错误会被误当成“没有数据”。</li><li>同一个事实在 Cooper、Spaceway、数易有不同表达，缺少统一 Evidence 就无法追溯。</li></ul></article>
        <article class="deep-card wide"><h5>控制层的本质</h5><p>控制层不是另写一个大 Agent，而是在 Runtime 关键生命周期旁边维护一份业务状态。模型仍然负责语义理解、任务拆分和提出下一步建议；Controller 负责确定性判断、状态写入、权限边界、证据验收和退出条件。这样把“概率性的模型建议”与“必须稳定的业务状态”分开。</p><div class="answer-script"><b>面试回答：</b>“原有 Agent 已经能完成 think → tool → observe 的通用循环，但信息查询还缺少业务完成条件。我增加 Controller，不是为了替换模型，而是把 Goal、Tasks、Observation、Evidence 和 Decision 独立保存，让每轮都能知道查什么、已经确认什么、还缺什么，最后由 Runtime 判断能不能回答。”</div></article>
      </div>
      <h4 class="chapter-subheading">六个挂载位置、七个逻辑函数</h4>
      <p class="deep-intro"><b>数量要说准确：</b>方案里有六个生命周期位置，但最终输出位置包含 PrepareFinalAnswer 和 ValidateFinalAnswer 两个函数，所以一共是七个逻辑函数。不要把它说成七个完全独立的 Runtime Stage。</p>
      <div class="deep-flow controller-flow">
        <div class="flow-step"><b>① Query Gate / InitializeQuery</b><span>判断是否进入查询专项；必要时结构化改写、拆任务，校验通过后才写正式状态。</span></div>
        <div class="flow-step"><b>② PrepareQueryRound</b><span>计算活跃任务、未覆盖事实、候选来源、进度提醒和本轮可见只读工具。</span></div>
        <div class="flow-step"><b>③ ValidateToolCalls</b><span>检查 Task 归属、只读权限、Schema、约束、重复请求、预算和依赖。</span></div>
        <div class="flow-step"><b>④ ApplyToolResult</b><span>归一化结果、保存 Evidence、追加 Observation、更新任务状态。</span></div>
        <div class="flow-step"><b>⑤ DecideQueryCompletion</b><span>检查任务覆盖、冲突和可恢复路径，决定补查、回答或降级。</span></div>
        <div class="flow-step"><b>⑥ PrepareFinalAnswer</b><span>构造事实白名单、来源映射、回答策略和必须披露的限制。</span></div>
        <div class="flow-step"><b>⑦ ValidateFinalAnswer</b><span>检查回答是否使用了未经验收的 Claim/Evidence，最后才允许输出。</span></div>
      </div>
      <p class="answer-script"><b>这条主线要记住：</b>模型提出建议，Runtime 通过 Controller 应用状态；模型不能直接修改正式状态，也不能口头宣布“已完成”。只有每个必要事实都有可信 Evidence、没有未解决冲突，才进入正常回答；否则继续补查或明确降级。</p>

    <h4 id="topic-controller-state" class="chapter-subheading">正式状态、临时投影与原始证据</h4>
    <div class="design-prose">
      <p>我没有把所有东西都塞进一个巨大状态结构。正式状态负责保存可追踪的业务进度；每轮的候选工具、未覆盖事实和上下文是从正式状态计算出的临时投影；长文档和原始结果由 Evidence Store 保存。三者分开，既避免模型上下文无限膨胀，也避免保存一份容易与最新证据不一致的派生数据。</p>
      <table class="deep-table"><thead><tr><th>数据类别</th><th>具体内容</th><th>变化与恢复方式</th></tr></thead><tbody>
        <tr><td>正式业务状态</td><td>Goal、稳定 TaskID、任务问题、Status、Observations、Decision、ContinuationCount。</td><td>通过补丁更新；恢复时读取最近有效版本，保留已经发生的调用及证据引用。</td></tr>
        <tr><td>Runtime 运行依据</td><td>原始问题、可信身份、预算、已排队调用、当前时间与取消状态。</td><td>身份来自可信入口；恢复必须重新授权和检查总预算，不能重启就无限获得新额度。</td></tr>
        <tr><td>本轮临时投影</td><td>ActiveTasks、CoveredFacts、UncoveredFacts、Conflicts、SourceCandidates、AllowedTools、进度提示。</td><td>PrepareQueryRound 重新计算；本身不提交 StatePatch，避免上轮缓存覆盖新证据。</td></tr>
        <tr><td>外置原始证据</td><td>正文或结构化记录、来源定位、抓取时间、适用时间、版本、访问作用域。</td><td>状态只存 EvidenceID；回答时按授权读取必要片段，恢复时核对证据是否仍有效。</td></tr>
      </tbody></table>
      <p><b>状态迁移规则：</b>刚建立的任务是 pending；通过执行校验并开始查询后进入 in_progress。相关事实都被证据覆盖且无关键冲突时变成 satisfied；缺事实但还有合法路径时保持 in_progress；缺事实且无路径或预算时进入 blocked。blocked 描述本次查询条件下暂时无法继续，并非数据永远不存在。补充权限、对象或来源后允许重新评估；已经 satisfied 的任务出现新冲突时也必须重新验收，不能永远缓存为完成。</p>
      <p><b>三个状态不要混：</b>工具超时是调用结果，Task blocked 是任务判断，Query degraded 是整题回答策略。例如查指标的任务遇到权限拒绝，不应取消仍能完成的需求与文档任务；先获得其余证据，最终说明指标无法确认。ContinuationCount 只记录候选回答被拒后要求继续的次数，不能取代 Runtime 的总轮数、工具次数、时限和 Token 预算。</p>
    </div>
    <div class="deep-grid">
      <article class="deep-card self"><h5>查询级状态</h5><p><code>Goal</code> 是本轮总体查询目标；<code>ContinuationCount</code> 记录候选回答验收不通过后续跑了多少轮；<code>Decision</code> 是 pending、continue、answer 或 degraded。查询级状态回答“这道题整体要完成什么、现在应该继续还是结束”。</p></article>
      <article class="deep-card self"><h5>任务级状态</h5><p>每个 <code>InfoQueryTask</code> 有稳定 <code>ID</code>、可验证的 <code>Question</code>、<code>Status</code> 和 <code>Observations</code>。状态是 pending、in_progress、satisfied、blocked；一个任务 satisfied 不代表整道题完成。</p></article>
      <article class="deep-card self"><h5>Observation 不是 Evidence</h5><p><code>QueryObservation</code> 记录 ToolCallID、ToolName、System、规范化 RequestKey、Outcome、轻量 Summary、Sources 和 EvidenceIDs。Observation 是“调用过程记录”；Evidence 是从有效结果中保存、可以被回答引用的事实证据。</p></article>
      <article class="deep-card self"><h5>SourceRef 的最小可追溯信息</h5><p>平台用 <code>System</code> 表示，一级/二级信息源用 <code>SourceL1/SourceL2</code> 表示，具体对象用 ResourceID、ResourcePath、Title、URL 和 UpdatedAt 表示。这样出错时才能判断是平台、团队空间，还是某篇资源的问题。</p></article>
    </div>
    <div class="deep-code">InfoQueryState
  ├─ Goal：这轮整体要回答什么
  ├─ Tasks[]
  │   ├─ ID / Question / Status
  │   └─ Observations[]
  │       ├─ ToolCallID / ToolName / System / RequestKey
  │       ├─ Outcome：result / no_result / denied / invalid_argument
  │       │           transient_failure / fatal_failure / irrelevant / conflicting
  │       ├─ Summary：给下一轮看的轻量进度，不替代原始结果
  │       ├─ Sources：平台、L1/L2、资源 ID、标题、URL、更新时间
  │       └─ EvidenceIDs：允许最终回答引用的证据
  ├─ ContinuationCount：回答验收失败后的续跑次数
  └─ Decision：pending → continue / answer / degraded</div>
    <p class="note"><b>状态边界：</b>RunState 是 Runtime 原有的一次运行状态；InfoQueryState 是本次信息查询新增的业务状态；Session 是跨 Run 的会话持久化边界。三者分别回答“这次程序怎么跑”“这道业务题查到哪”“历史对话保存在哪”。</p>

    <h4 id="topic-runtime" class="chapter-subheading">底座适配：GoClaw Agent Loop 与控制层的挂载关系</h4>
    <p class="deep-intro"><b>口径必须拆成两层：</b>README 把能力宣传成 8-stage：context → history → prompt → think → act → observe → memory → summarize；当前 Go 代码的 <code>NewDefaultPipeline</code> 是 setup 一次、iteration 五个阶段、finalize 一次，即 7 个显式 Stage 类型，MemoryFlush 是 PruneStage 内部调用的子阶段。面试时可以说“对外是 8-stage 能力模型，代码落地是 7 个显式 Stage + Prune 内联 MemoryFlush”，这比生硬说成 8 个文件准确。</p>
    <div class="deep-flow">
      <div class="flow-step"><b>Setup</b><span>ContextStage：身份、租户、Workspace、Context Files、Session history、工具 Schema、L0 Memory</span></div>
      <div class="flow-step"><b>Prune</b><span>按窗口和 Tool Schema 预算软裁剪；超限时进入 compaction</span></div>
      <div class="flow-step"><b>MemoryFlush</b><span>Prune 超限时内联触发，尝试保存重要内容，再压缩；保存失败并非必然阻断</span></div>
      <div class="flow-step"><b>Think</b><span>模型输出文本或结构化 Tool Calls；截断/溢出可有限重试</span></div>
      <div class="flow-step"><b>Tool + Observe</b><span>授权、PreToolUse、参数、执行、结果回填和继续/退出判断</span></div>
      <div class="flow-step"><b>Checkpoint</b><span>按间隔把可持久化消息刷入 Session Store，失败不丢弃，Finalize 再 flush</span></div>
      <div class="flow-step"><b>Finalize</b><span>清洗最终内容、保存消息、更新 usage、触发 summary 和 session.completed</span></div>
    </div>
    <div class="deep-grid">
      <article class="deep-card base"><h5>ContextStage 不是简单拼 Prompt</h5><p>它先把 TenantID、AgentID、UserID、SenderID 和 Workspace 放进 Context，再一次性解析不可变 WorkspaceContext；加载 Agent/用户 Context Files、Session history/summary，构造 System Prompt，计算 system + Tool Schema 的 token overhead，并 AutoInject 相关 L0 Memory。该核算为后续 Prune 提供基础；当前源码的 L0 后追加内容与注入限额仍有核算缺口，目标设计需在动态装配后复核总预算，具体见记忆章节。</p></article>
      <article class="deep-card base"><h5>ToolStage 的闭环</h5><p>Think 产生 Tool Calls 后，ToolStage 先做授权和 PreToolUse hook，再决定并行或串行；并行路径把 I/O 并发执行，但状态变更按顺序处理；遇到 loop kill、最大调用数、等待上限或取消信号时停止。Observe 把 Tool Result 回填 MessageBuffer，下一轮重新 Prune/Think。</p></article>
      <article class="deep-card base"><h5>Finalize 为什么使用脱离取消的 Context</h5><p>进入 Finalize 的路径会尽量保存消息、usage、summary 和 session.completed，因此源码使用 <code>context.WithoutCancel</code>。这允许循环因取消或 AbortRun 退出后尝试收尾，不代表外部存储一定成功。另一个边界是 setup/iteration 的 Stage 直接返回 error 时，当前 Pipeline 会提前 return，未必执行到末尾 Finalize；目标适配需要统一异常收尾与持久化路径，不能声称任何错误都已自动保存。</p></article>
      <article class="deep-card self"><h5>查询 Controller 插入点</h5><p>InitializeQuery 贴近首次 Context/Think 前；PrepareQueryRound 贴近每轮 Think 前；ValidateToolCalls 贴近 ToolStage 的 preflight；ApplyToolResult 贴近 Tool/Observe 回填；DecideQueryCompletion 贴近 Observe 的候选回答验收；Prepare/ValidateFinalAnswer 贴近 Finalize 前。这样复用 Pipeline，不需要另起一个孤立 Agent Loop。</p></article>
    </div>

    <h4 id="topic-controller-gate">03 · 查询理解、改写、任务拆解与来源路由</h4>
    <div class="design-prose">
      <p><b>四个步骤各自解决一个问题：</b>Gate 判断是否需要访问业务系统；Rewrite 把当前表达补成可独立理解的查询；Decompose 把目标拆成可验收事实；Route 为每个事实选择相关且有权限的数据源。它们可以在一次结构化初始化中协作，但不能混成“让模型改写一下”。尤其不能把来源名当成意图，也不能让改写凭空增加用户未问的指标或扩大时间范围。</p>
      <p>规则先处理精确资源、显式版本和时间范围。只有“单个资源、单一事实、没有历史指代、没有综合分析”同时成立时才直接建立一个任务。对于“0701 版本有没有上线风险”，风险是综合意图，需要结构化模型提出事实任务；如果版本指代多个项目，先问清楚项目，而不是猜一个最相近的结果。</p>
      <p><b>设计示例：</b>已唯一确定项目的前提下，保留“0701”“上线风险”的原意，形成版本范围与上线条件、未关闭阻塞事项、相关验收指标等事实任务。风险结论由这些事实和上线规则推导；“给出风险”本身不能代替底层事实检索任务。只有业务规则确实把某个指标列为上线条件时才查询它，不能为了展示多源能力而机械调用所有系统。</p>
      <p><b>来源如何选择：</b>Source Registry 记录来源能提供的事实类型、资源定位方式、对应工具和授权条件。先按事实能力筛选，再检查精确资源和用户指定范围，然后结合历史 Observation 排除已经无效的路径。Cooper 的文档、Spaceway 的状态、数易的指标是常见分工，最终以真实能力注册为准，而不是把平台和事实永久一对一绑定。</p>
      <p><b>改写如何守住边界：</b>原问题一直保留；链接、ID、版本、指标与明确时间使用确定性校验，模型输出通过 Schema 与字段组合校验后才进入正式状态。“是否多加了用户未表达的意思”不能单靠字符串检查证明，需要结构化 Prompt、代表性用例和语义复核。一次修复仍失败时，只有问题原本足够明确才退成最小单任务；否则请求澄清，不把含混目标强行推进。</p>
      <p><b>失败后的路由：</b>Normalizer 只报告发生了什么，不顺手生成新查询词。下一轮由来源解析重新选择同一事实的合法路径；默认不对同一个空结果请求反复改写和重查。若允许搜索词扩展，应作为有次数上限、保留约束的显式策略，与网络瞬时重试区分。用户说“只在 Spaceway 查”是硬限制；“优先从 Spaceway 看”才允许在授权和业务范围内换源。</p>
    </div>
    <div class="project-sequence">
      <div><b>① 精确资源 + 单一事实</b><span>一个有效链接/文档 ID/任务 ID，且只问一个明确字段：规则直接建单任务。</span></div>
      <div><b>② 精确资源 + 综合意图</b><span>问进展、风险、变化、原因、影响、对比或建议：启用结构化模型拆任务。</span></div>
      <div><b>③ 明确指定数据源</b><span>启用查询并保留来源约束；区分“优先查”和“只允许查”，不能默认放宽范围。</span></div>
      <div><b>④ 普通/非查询问题</b><span>翻译、润色、基于用户已提供全文的总结等：保持原 Agent 流程，不强行建立 InfoQueryState。</span></div>
    </div>
    <div class="deep-grid">
      <article class="deep-card self"><h5>规则先做确定性判断</h5><p>先解析精确 Locator、显式平台和原问题约束；检查是否有版本、时间、指标、负责人等条件。规则能确定时不浪费一次模型调用；规则不确定时才把结构化初始化交给模型。</p></article>
      <article class="deep-card self"><h5>结构化初始化只输出可校验结果</h5><p>模型输出 <code>enabled</code>、<code>needs_clarification</code>、<code>clarifying_question</code>、<code>goal</code> 和 1—5 个任务。Controller 检查任务数量、重复、代词是否消解、版本/时间/指标约束是否丢失；不合格只允许修复一次，仍失败就追问、退回普通流程或建立最小单任务。</p></article>
      <article class="deep-card warn"><h5>多个候选对象时宁可追问</h5><p>“曼哈顿项目”“0701 版本”如果对应多个合理对象，不能让模型凭相似度猜一个。链接解析失败也不能用相似资源替代；应保留原始输入，明确问用户需要哪个对象。</p></article>
      <article class="deep-card base"><h5>历史对话的正确作用</h5><p>最近 5 个用户轮次及回复可以帮助消解“它/上个版本/刚才那个任务”，但当前问题和历史都是待分析数据，不是系统指令。历史只能帮助补全当前目标，不能覆盖当前新问题。</p></article>
    </div>

    <h4 id="topic-governance-tools">04 · Skill、Tool、MCP 与工具执行治理</h4>
    <div class="design-prose">
      <p>Skill 保存完成某类业务任务的方法，例如先定位资源、再取正文、最后核对字段；Tool Schema 定义模型能发起的具体函数及参数；MCP 负责外部工具的发现、协议调用和结果传输。它们不是互相替代的三种工具。一个 Skill 可以编排多个工具，一个 MCP Server 也可以提供多个工具，而 Runtime 负责将这些外部接口纳入本地授权、预算和错误处理。</p>
      <p><b>从注册到执行：</b>先发现外部工具并记录真实 Schema、来源、只读性质与授权要求；再将 Skill 中的步骤绑定到这些能力。每轮按活跃任务和候选来源选择相关 Skill，加载必要正文，并给模型本轮允许的工具定义。模型发起调用后，先从编排参数中取出 TaskID、DependsOn 等信息，再把符合原生 Schema 的参数传给工具；不能把内部任务标识随意塞进第三方 API。</p>
      <p>动态加载减少无关工具占据上下文，但可见性不是权限。即使工具已经展示给模型，执行时仍要核对真实用户、当前群、资源权限和预算。Skill 描述与实际 Schema 不一致时，以注册的接口契约为准，返回明确错误并修正能力绑定，不能让模型无限猜参数。发现新工具也不等于自动批准该工具执行。</p>
      <h5>去重与重试：同一业务请求可以有多次受控尝试</h5>
      <p>RequestKey 表示规范化工具名和参数对应的逻辑查询，存储与查重时必须处于同一租户、授权主体和 QueryRun 范围。ToolCallID 标识一次调度，Attempt 标识该调度的底层重试。成功且证据仍有效的请求可以复用；执行中的请求合并等待；临时失败按策略增加 Attempt；权限拒绝不重试相同凭证；参数纠正则生成新的规范化请求。这样既不会把所有失败请求永久封死，也不会允许模型用新的 ToolCallID 绕过去重。</p>
      <table class="deep-table"><thead><tr><th>已有请求状态</th><th>再次遇到相同 RequestKey</th><th>反馈给下一轮的信息</th></tr></thead><tbody>
        <tr><td>scheduled / running</td><td>不重复调度，等待原请求或检查超时。</td><td>该事实仍在查询中，不能误判为无结果。</td></tr>
        <tr><td>成功且证据可用</td><td>复用当前 Run 内结果；新一轮业务查询需检查时效。</td><td>EvidenceID、来源及已覆盖事实。</td></tr>
        <tr><td>瞬时失败</td><td>按限额、退避与服务端 Retry-After 重试；耗尽后切换合法路径。</td><td>失败类型、次数与剩余可恢复路径。</td></tr>
        <tr><td>拒绝 / 参数无效 / 无匹配</td><td>不原样循环；权限变化、一次参数修复或明确新路径才允许重新评估。</td><td>限制、修复依据、已尝试路径。</td></tr>
      </tbody></table>
      <p><b>依赖与并行：</b>先定位版本 ID 再查对应任务是串行依赖；拿到共同 ID 后，互不依赖的任务查询和指标读取可以并行。调度前检查不存在的依赖和循环依赖，按并发上限分批；同批 I/O 并行返回，状态补丁按顺序应用。工具在运行中仍需响应取消与超时，已经返回的有效证据保留，不因另一个工具失败而丢弃。</p>
    </div>
    <table class="deep-table"><thead><tr><th>Outcome</th><th>含义</th><th>下一步</th></tr></thead><tbody>
      <tr><td><code>result</code></td><td>工具成功返回可以处理的内容</td><td>保存 Evidence，生成 Observation，重新验收 Task。</td></tr>
      <tr><td><code>no_result</code> / <code>irrelevant_result</code></td><td>调用成功但无匹配，或结果和当前任务无关</td><td>记录无效路径，下一轮选其他合法来源；显式启用扩展检索时才有限改写。不能把无结果当成“业务不存在”。</td></tr>
      <tr><td><code>denied</code></td><td>没有权限、认证失败或访问被拒绝</td><td>不重复相同 RequestKey；尝试其他合法来源，否则 Task 进入 blocked。</td></tr>
      <tr><td><code>invalid_argument</code></td><td>参数缺失、格式错误或资源 ID 无效</td><td>把错误回填模型，最多修正一次；仍失败就停止该路径。</td></tr>
      <tr><td><code>transient_failure</code></td><td>超时、限流或临时服务异常</td><td>使用 Runtime 原有有限重试；超过额度再切换相关来源。</td></tr>
      <tr><td><code>fatal_failure</code></td><td>当前工具或查询路径不可恢复</td><td>停止当前工具路径，保留已确认证据和失败原因。</td></tr>
      <tr><td><code>conflicting_result</code></td><td>关键对象、状态、版本或时间出现冲突</td><td>补查更直接/更权威/更新的来源；不能静默选一条当真值。</td></tr>
    </tbody></table>
    <div class="deep-grid">
      <article class="deep-card self"><h5>执行前的 7 个检查</h5><p>① TaskID 存在且处于允许继续查询的状态（pending / in_progress）；② Tool 在 ToolAllow/本轮 AllowedTools 中；③ 工具是只读、真实主体有权访问且能覆盖未解决事实；④ 参数符合 Schema；⑤ 保留原问题中的对象、版本、指标、时间约束；⑥ RequestKey 不与排队/运行中或可复用成功结果重复，失败重试符合策略；⑦ 预算和依赖满足。</p></article>
      <article class="deep-card self"><h5>并行和串行怎么分</h5><p>同一批中无数据依赖、并且都是可信只读调用的可以并行；依赖前一个搜索结果拿 ID 的必须进入下一批。并发执行只并行 I/O，状态变更和结果归一化仍按顺序写入，避免竞态。</p></article>
      <article class="deep-card base"><h5>为什么要保留 RequestKey</h5><p><code>hash(规范化工具名 + 规范化参数)</code> 让“同一请求”可识别。它同时防止模型反复调用、网络重试重复执行和不同工具调用 ID 掩盖了同样参数；查询一期优先只读，因此重放风险更可控。</p></article>
      <article class="deep-card warn"><h5>搜索命中不等于证据成立</h5><p>搜索返回标题或候选资源，只能作为下一步定位线索；正文读取失败、对象类型不匹配或权限不足时，不能把标题/摘要直接当成事实证据。</p></article>
    </div>

    <h4 id="topic-controller-completion">05 · 结果归一化、证据组织与完成验收</h4>
    <div class="design-prose">
      <p>工具成功返回，只证明接口调用完成，不证明问题已经回答。我的验收链路依次区分调用记录、有效证据与可输出结论：Observation 记录这次调用的参数、结果类型和来源；Evidence 保存真正可核对的内容；Claim 是依据有效 Evidence 得出的、带适用条件的事实表述。模型提出的总结先是候选 Claim，不能一生成就成为真值。</p>
      <table class="deep-table"><thead><tr><th>设计示例中的对象</th><th>具体内容</th><th>能证明与不能证明什么</th></tr></thead><tbody>
        <tr><td>Observation O1</td><td>读取 0701 版本任务明细，调用成功，记录资源 ID、抓取时间与 Evidence E1。</td><td>证明发生了这次读取；“成功”本身不能证明所有任务都已读取。</td></tr>
        <tr><td>Evidence E1</td><td>某项阻塞任务的原始记录：版本、状态、严重性、更新时间、原始链接。</td><td>支持该事项在指定时间未关闭；若分页未完成，不能证明整个版本只有这一项。</td></tr>
        <tr><td>Evidence E2</td><td>该版本有效上线规则中“此类阻塞必须关闭”的条款及文档版本。</td><td>支持规则要求；需要核对是否适用 0701，不能引用过期发布规则。</td></tr>
        <tr><td>Claim C1</td><td>“截至本次查询，存在一项尚未满足的上线条件”，引用 E1 与 E2。</td><td>可提出明确风险；不能据此编造延期天数、负责人承诺或所有指标均正常。</td></tr>
      </tbody></table>
      <p><b>归一化不是删除原文：</b>不同来源可能用字符串状态、布尔值或枚举表示同一概念。Normalizer 建立统一的对象、字段、值、时间与来源结构，同时保留原始值和正文定位。抓取时间与业务更新时间分别保存；分页完整性、过滤条件、单位和统计口径也要保留。否则“当前取到的十条记录”很容易被错误总结成“全部十条”。</p>
      <p><b>完成契约如何形成：</b>依据原问题与 Task.Question 确定对象约束、必需事实槽位、时间范围及来源要求；用这些条件过滤证据，再计算 CoveredFacts、UncoveredFacts、Conflicts 和 HasRecoverablePath。ID、枚举、单位、日期、来源存在性可确定性校验；自然语言是否支持结论需要结构化语义判断并保留引用片段，不能宣称代码已经形式化证明所有回答为真。</p>
      <p><b>怎么收敛：</b>所有必要任务覆盖且无关键冲突，才进入正常回答。还有缺口、合法路径和预算就继续；无合法路径或预算耗尽则生成带限制的降级回答。若某个必要任务 blocked，不能把它静默移出分母来宣布完成；可继续完成其他任务，最后明确无法核实的部分。用户主动缩小问题范围时才重新形成目标与契约，并记录范围变化。</p>
      <p><b>最终校验为何单独做：</b>通过覆盖验收的证据仍可能被模型在表述时夸大。合法 ClaimID/EvidenceID 只能证明引用来自允许集合，不能证明句子没有曲解证据。因此回答还要核对实际陈述与引用片段、时间和限定条件，区分事实、风险推断与建议。格式问题允许修复一次；事实缺口返回查询；无路径则降级或输出保守事实模板，不能靠反复润色制造“已确认”。</p>
    </div>
    <div class="layer-diagram">
      <div class="layer-box"><h5>Task Assessment</h5><p>按任务的 Object、Requested Fields、Time Scope 过滤 Evidence；得到 CoveredFacts、UncoveredFacts、Conflicts 和 HasRecoverablePath。</p></div>
      <div class="layer-arrow">→</div>
      <div class="layer-box center"><h5>Query Decision</h5><p>全部 satisfied → answer；仍有可恢复缺口且有预算 → continue；没有路径 → degraded。部分 blocked 不会立刻结束，要先完成其他仍可查任务。</p></div>
      <div class="layer-arrow">→</div>
      <div class="layer-box"><h5>Answer Policy</h5><p>simple_fact、progress_summary、degraded 三类；明确允许使用的 ClaimID/EvidenceID、必需段落、风险、建议和限制。</p></div>
    </div>
    <table class="deep-table"><thead><tr><th>回答类型</th><th>适用情况</th><th>必须呈现</th></tr></thead><tbody>
      <tr><td>simple_fact</td><td>单一来源的状态、时间、版本或数值</td><td>直接结论 + 核心依据 + 来源。</td></tr>
      <tr><td>progress_summary</td><td>进展、变化、风险、影响、原因、趋势、对比或建议；或至少两个任务共同形成结论</td><td>综合结论 + 关键事实 + 相关风险/建议/限制 + 来源。</td></tr>
      <tr><td>degraded</td><td>关键证据不足、权限受限、来源冲突且无法继续、预算耗尽</td><td>已确认内容 + 未确认内容 + 原因 + 下一步 + 已取得来源。</td></tr>
    </tbody></table>
    <div class="deep-grid">
      <article class="deep-card self"><h5>PrepareFinalAnswer</h5><p>从已验收任务生成 ConfirmedClaims、RiskItems、Limitations 和 SourceMap，建立事实与证据白名单，再决定回答类型；它不直接修改 InfoQueryState。</p></article>
      <article class="deep-card self"><h5>ValidateFinalAnswer</h5><p>检查必需段落、UsedClaimIDs、UsedEvidenceIDs、来源是否存在、是否披露权限/时效/缺失/冲突。只有格式缺失才允许修复一次；虚构事实、非法 EvidenceID 或不存在的来源必须拒绝输出。</p></article>
    </div>

    <h4 id="topic-memory">06 · 上下文、记忆分层与多用户／多群隔离</h4>
    <div class="memory-chapter">
      <h5 id="memory-target" class="memory-subhead">6.1 我的目标设计：先分信息层次，再分归属</h5>
      <p>我的目标方案按 Working、Episodic、Semantic 三层组织记忆：Working 支撑当前 Run，Episodic 保存有来源的历史事件，Semantic 保存跨会话有价值的事实和关系。在这三层之上，再独立设置个人与群作用域。个人记忆、群记忆不是第四层和第五层，而是规定每条长期信息属于谁、能被谁读取。前期 VSA 的 L1/L2/L3 是另一版实现的分类，后面单独保留演进说明，不能把两套名称交替当成同一结构。</p>
      <table class="deep-table"><thead><tr><th>目标层次</th><th>在本业务里保存什么</th><th>怎样形成与使用</th></tr></thead><tbody>
        <tr><td>Working 工作记忆</td><td>当前问题、群近期历史、当前发送者允许使用的个人偏好、相关长期记忆、任务进度投影和本轮工具结果。</td><td>每个 Run 动态装配；工具结果回填后继续推理；裁剪与摘要不能删除正式查询状态和证据。</td></tr>
        <tr><td>Episodic 情景记忆</td><td>某次讨论确认了哪些条件、遇到什么问题、作出什么决定，附参与者、时间、来源消息与作用域。</td><td>从尚未处理的对话范围异步整理，经归属与来源检查后保存；下一轮按相关性召回，需要细节再回查原文。</td></tr>
        <tr><td>Semantic 语义记忆</td><td>用户稳定偏好、业务术语、实体关系、在明确条件下有效的公共事实。</td><td>从交互或事件候选中提取，经去重、冲突与替代治理后写入；保留来源与适用时间，不把临时进度永久固化为真值。</td></tr>
      </tbody></table>
      <p><b>群共享什么、个人延续什么：</b>群 Session、群公共记忆与群 Workspace 按 Tenant + Bot + Group 归属；个人长期记忆按 Tenant + Bot + 真实 Sender 归属，因此 A 在 G1 和 G2 可以延续自己的偏好，但 G1 的公共业务信息不会因此被复制到 G2。个人 DM、群、Thread 使用带类型的命名空间，避免相同字符串 ID 碰撞。跨 Bot 或租户共享必须显式授权，不能因为用户名字相同就自动打通。</p>
      <p><b>每次 Run 的装配：</b>验证真实 Sender 后，加载当前群的近期对话和公共记忆，再选择本次场景允许使用的个人记忆。A 问完换成 B 提问时，群历史可以接续，但个人注入块和相关缓存必须按 B 重建。缓存键除了身份与群，还应包含权限与记忆版本；同一 Run 内可以复用未变化的静态部分，跨 Sender 不能复用完整 Prompt。</p>
      <p><b>个人可访问不等于群内可披露：</b>用户可能允许助手知道一条个人信息，但未允许向整个群展示。群聊默认只使用适合该场景的低敏偏好，敏感个人事实不应进入群模型上下文；必要时转私聊或取得明确授权。已注入的个人信息、相关工具结果和生成的中间摘要也不能原样落入群共享 Session。持久化按消息来源与敏感标签筛选，输出时再次按接收范围检查，避免“读取时隔离、写回时串群”。</p>
      <p><b>写回分两路：</b>群增量交互生成公共候选，个人候选只能由真实发送者本人的发言或明确确认支持。每条候选携带 Scope、来源消息、主体、时间与适用条件；在同 Scope 中决定新增、无变化、合并、替代或保留冲突。正文写入与处理游标一起提交，失败不推进游标；索引失败独立重试。具体的分路反馈和异常表保留在本章后半部分。</p>
      <p><b>上下文预算是运行约束：</b>预算同时覆盖系统提示、工具 Schema、近期历史、召回记忆、任务投影、工具结果与预留输出。优先保留当前问题、约束和未完成任务；先移出冗长原始结果，再裁剪低相关历史或做摘要。长期记忆只提供线索，实时业务事实仍向真实来源核验；即使模型窗口压缩，任务和证据也能从正式状态恢复。</p>
      <p class="memory-note"><b>底座适配路线：</b>复用 GoClaw 的 ContextStage、Session Store、Workspace Resolver、记忆检索与后台整理接口；在入口身份、每轮注入、按 ID 展开、写回提取和共享历史持久化五条路径落实双作用域策略。已有三层能力帮助承载设计，但不会自动替我们实现群共享与个人隔离的组合规则。</p>
      <p class="deep-intro"><b>先把问题拆开：</b>“记忆分几层”是在问信息如何保存和复用；“用户、群、租户怎样隔离”是在问谁能读写；“L0/L1/L2 怎么加载”是在问一次给模型看多少。这三个维度不能混成一张三层列表。下面分别说明前期 VSA PoC、GoClaw 底座和多群聊专项设计，设计中的能力不冒充底座已经全部实现。</p>
      <nav class="memory-nav" aria-label="上下文与记忆章节导航"><a href="#memory-target">目标三层与双作用域</a><a href="#memory-objects">对象之间的关系</a><a href="#memory-scope">多用户与群隔离</a><a href="#memory-feedback">群聊反馈闭环图</a><a href="#memory-goclaw">GoClaw 三层</a><a href="#memory-loading">渐进加载与预算</a><a href="#memory-lifecycle">底座生命周期图</a><a href="#memory-vsa">前期 VSA 三层</a><a href="#memory-questions">追问完整回答</a></nav>

      <h5 class="memory-subhead">6.2 先分清三个维度：层次、作用域、加载深度</h5>
      <table class="deep-table"><thead><tr><th>面试官在问什么</th><th>应该使用的分类</th><th>不能混淆的地方</th></tr></thead><tbody>
        <tr><td>前期 VSA 怎么记住信息？</td><td>L1 工作记忆、L2 核心记忆、L3 档案记忆。</td><td>这是前期 Eino PoC 的实现；L3 是可检索的会话原文，不是知识图谱。</td></tr>
        <tr><td>GoClaw 的三层记忆是什么？</td><td>Working 工作记忆、Episodic 情景记忆、Semantic 语义记忆。</td><td>按当前上下文、历史事件、可复用实体关系划分。不是把数据库分成三个目录。</td></tr>
        <tr><td>长期记忆怎样进入当前上下文？</td><td>L0 摘要、L1 概览、L2 详细内容的渐进加载。</td><td>这是读取粒度，与 Working/Episodic/Semantic 不一一对应；GoClaw 的 L2 完整摘要也不是 VSA 的 L2 核心记忆。</td></tr>
        <tr><td>谁可以看到或修改这条记忆？</td><td>Tenant → Bot/Agent → Personal / Group / 明确授权的 Shared Scope。</td><td>Personal 和 Group 是归属边界，不是长期/短期的上下两层。一个作用域内也可以有近期上下文和长期记忆。</td></tr>
      </tbody></table>

      <h5 id="memory-objects" class="memory-subhead">6.3 Workspace、Session、Context、Memory、查询状态到底是什么关系</h5>
      <table class="deep-table"><thead><tr><th>对象</th><th>保存什么／负责什么</th><th>生命周期及关联</th><th>不能据此推断</th></tr></thead><tbody>
        <tr><td>Session</td><td>一段会话的消息、摘要、用量和元数据。</td><td>可以跨多个 Run；开始 Run 时加载历史，Checkpoint/Finalize 再保存。</td><td>换 SessionKey 不会自动换掉所有个人长期记忆，也不会自动删除文件。</td></tr>
        <tr><td>Context / Working</td><td>本轮给模型看的系统提示、历史、记忆片段、当前问题、工具和结果。</td><td>按 Run 装配、按迭代更新；它从多个存储读取，而不是一个长期数据库。</td><td>“曾写入数据库”不代表本轮模型已经看到；检索后也可能被预算裁剪。</td></tr>
        <tr><td>Workspace</td><td>文件访问的作用域与活动路径，如附件、下载结果、生成产物、允许的只读导出路径。</td><td>由身份和场景解析；多个 Run 可以复用同一工作区。</td><td>目录名不是数据库权限；共享文件不自动意味着共享 Session、个人记忆或 KG。</td></tr>
        <tr><td>长期 Memory</td><td>精炼事实、事件摘要、文档记忆、实体关系等可跨轮复用的信息。</td><td>通过显式写入或后台整理进入存储；后续按相关性与作用域检索回 Context。</td><td>有记忆不等于有最新业务证据；reset 会话也不等于删除所有长期记忆。</td></tr>
        <tr><td>InfoQueryState</td><td>当前查询的 Goal、Task、Observation、Evidence、Decision。</td><td>跟随一次业务查询；跨重启续跑需要专项持久化设计。</td><td>不能靠长期记忆或会话摘要猜测本次哪些 Task 已完成。</td></tr>
      </tbody></table>
      <p><b>文件接口不等于磁盘存储：</b>GoClaw 的 MemoryInterceptor 可以把看起来像 <code>MEMORY.md</code>、<code>memory/*.md</code> 的读写转到 MemoryStore；在 PostgreSQL 部署中，这些是数据库里的文档和检索块。Agent/用户 Context Files 也有专门存储。普通附件和 Agent 产物可能在本地 Workspace。只有追到实际 interceptor / store / 文件系统分支，才能回答“这份内容究竟存在哪”。</p>

      <h5 id="memory-scope" class="memory-subhead">6.4 多用户隔离：底座证据与我们的群聊方案分别讲</h5>
      <p><b>GoClaw 的现有证据链：</b>入口将 TenantID、AgentID、UserID 和 SenderID 带入 Context；Session 用渠道、direct/group、chat/peer 和可选 thread/topic 区分会话。数据库查询附加 tenant_id，Session 热缓存键也加租户前缀。Workspace Resolver 另行选路径；MemoryUserID / KGUserID 决定记忆和图谱的用户过滤。这几条边界共同生效，不能只展示目录树就说“完成了多用户隔离”。</p>
      <table class="deep-table"><thead><tr><th>边界</th><th>源码机制</th><th>必须保留的例外／限制</th></tr></thead><tbody>
        <tr><td>不同租户，同名 Session</td><td><code>sessionCacheKey = tenant UUID + ':' + session key</code>；sessions 以 <code>(tenant_id, session_key)</code> 区分，loadFromDB 同时过滤两个字段。</td><td>SessionKey 本身不拼 tenant；身份必须由可信入口建立，不能让模型提供一个 tenant_id 就当成授权。</td></tr>
        <tr><td>同租户，不同用户／群</td><td>BuildSessionKey 包含 agent key、channel、PeerKind、peer/chat ID。direct 和 group 分开；群共享 Session 时，成员仍需保留真实 Sender。</td><td>Session 的 UserID 可能代表群作用域而非真实个人；SenderID 与资源归属不能混用。</td></tr>
        <tr><td>文件 Workspace</td><td>open Agent 通常追加 DM 用户或群 chat 路径；predefined 分支可共用 Agent 目录；Team 按 shared/isolated 决定是否追加 chat/user；delegate 使用受限共享路径与只读导出。</td><td>路径片段会清洗，另有路径与工具权限检查；不是所有模式默认每用户一个文件目录，更不是 OS 级沙箱保证。</td></tr>
        <tr><td>文档记忆</td><td>MemoryUserID 默认取 Context.UserID；shared 模式返回空值。普通用户查询可以读 Agent 公共条目（user_id IS NULL）和自己的条目；shared 模式可以扩大为该 Agent 的用户条目。</td><td>共享是显式策略，不能对任意多人群聊无条件开启。工作区 MemoryScope 字段本身也不能替代实际 Store 过滤。</td></tr>
        <tr><td>Episodic 与 KG</td><td>Episodic 搜索按 tenant、agent 和非空 userID 过滤；KG 有独立 KGUserID / shared KG 规则。</td><td>Episodic 空 userID 的搜索会省略用户过滤，含义与普通文档的空 userID 不完全相同。必须按具体 Store 检查，不能一概理解成“只读公共数据”。</td></tr>
        <tr><td>按 ID 深度读取</td><td>memory_expand 调用 EpisodicStore.Get；当前 PG Get 按 id + tenant_id 查询。</td><td>这条函数链未附加 agent/user 所有权判断，不能拿已隔离的 search 来证明 expand 也完整隔离。业务接入应补齐或核验上游逐条授权；记忆 ID 本身不是权限凭证。</td></tr>
      </tbody></table>
      <div class="memory-note"><b>这是源码核对后的边界说明：</b>Session 的租户缓存与 SQL 过滤有明确证据；但“群共享历史 + 当前个人记忆跨群 + 群公共记忆不出群”仍是专项组合设计。现有 <code>MemoryUserID</code> 默认读取 UserID，不会自动改用 SenderID。不能把保留了 Sender 字段说成所有 Memory 路径已经按真实发言人隔离。</div>
      <p><b>我们的 D-Chat 方案怎样映射：</b>先验证平台来源并保留 <code>bot_id、channel_id、vchannel_id、user_id、message_key</code>。bot_id 对应机器人边界，channel_id 对应群，user_id 是本次真实操作人。群 Session、群公共记忆和群文件使用“Bot + 群”；个人 Memory 使用“Bot + 真实用户”，允许合规的个人稳定信息随本人跨群。以下是设计映射；若部署还含多个租户，外层继续带 tenant scope。</p>
      <table class="deep-table"><thead><tr><th>资源</th><th>私聊归属</th><th>群聊归属</th><th>换人／换群之后</th></tr></thead><tbody>
        <tr><td>近期对话与 Session 摘要</td><td>bot_id + vchannel_id</td><td>bot_id + channel_id</td><td>同群 A/B 接续共同历史；不同群不共享近期消息。</td></tr>
        <tr><td>Workspace 附件和产物</td><td>bot_id + user_id</td><td>bot_id + channel_id</td><td>同群可按权限复用；A 去另一群不会把原群文件一起带过去。</td></tr>
        <tr><td>Group Memory</td><td>无独立群公共记忆</td><td>bot_id + channel_id</td><td>只服务当前群；不同 Bot 即使处于同群也默认隔离。</td></tr>
        <tr><td>Personal Memory</td><td>bot_id + user_id</td><td>bot_id + 当前 SenderID</td><td>A 在不同群可复用经过允许的自身偏好；B 发言时必须换成 B 的个人记忆。</td></tr>
        <tr><td>工具权限与审计</td><td>当前真实 user_id</td><td>当前真实 SenderID</td><td>共享的是群资源，操作责任仍归个人；MCP 高权限机器人凭证不等于用户自身权限。</td></tr>
      </tbody></table>
      <p><b>用 A、B 两个人举例：</b>A 在 G1 问问题，本轮装配 G1 历史 + G1 公共记忆 + A 个人记忆 + G1 文件访问范围；B 随后在 G1 提问，共享历史可以沿用，但个人记忆必须切换为 B。A 到 G2 后，可以读取允许跨群的 A 个人记忆，只能读取 G2 的群记忆和文件。这里需要同时维护“当前群”和“当前人”两条身份线。</p>
      <p><b>共享 Session 的防串用要求：</b>Personal Memory 注入块只在当前 Run 有效，不能持久化进群共享 Session 或 Checkpoint，也不能把包含 A 个人信息的完整 Prompt 缓存给 B。静态系统提示、同一次 Run 内的工具循环缓存可以复用，但跨 Sender 必须重建动态部分。持久化时还需检查 Tool Result 是否包含个人信息；只剥离系统提示而原样回存敏感工具结果，仍会污染共享历史。群内最终输出也必须遵守信息可披露范围。</p>

        <tr><td>明确纠正旧结论</td><td>SUPERSEDE，记录旧条目及新证据；同 Scope 内更新适用关系。</td><td>后续默认召回有效新结论，保留旧来源用于解释变更。</td></tr>
        <tr><td>看似冲突，但时间／对象不同</td><td>KEEP_BOTH_CONFLICT，保留两条及各自条件；不静默覆盖。</td><td>查询时结合当前时间、对象和业务证据选择；仍不明确则补查或追问。</td></tr>

      </tbody></table>

      <h5 id="memory-goclaw" class="memory-subhead">6.6 GoClaw 底座：Working、Episodic、Semantic 分别做什么</h5>
      <p>GoClaw 采用事件驱动 consolidation；ContextStage 只按相关性注入少量 L0，Prune 负责预算，不能说所有长期记忆都已进入当前模型。以下依据本地 GoClaw 源码 <code>0d9db376</code>，描述的是底座能力，不等同于业务专项的线上完成情况。</p>
      <article class="memory-tier"><div class="memory-tier-label">Working<span>工作记忆</span></div><div><h6>当前 Run 的推理现场，有预算、会增长、需要裁剪</h6><p><b>内容与载体：</b>Working：当前 Run 的 MessageBuffer、系统提示、近期历史、工具调用/结果。ContextStage 读取 Session 历史和摘要，加载上下文文件，构造系统提示与工具定义，再把相关长期记忆装配进来。Session 是这些历史内容的持久化来源，MessageBuffer 是本轮加工和推理使用的内存对象，两者不是同一个容器。</p><p><b>生命周期：</b>每轮 Think 产生模型文本或工具请求，工具结果回到消息缓冲区，再经过 Prune 和下一轮 Think。Checkpoint 按运行策略保存待持久化消息；Finalize 收尾时再次保存。历史软裁剪首先修改本轮消息视图；长期可恢复性仍取决于 Session 保存和压缩策略，不能把完整原文永久保留当成所有底座模式的保证。</p><p><b>保存什么、不保存什么：</b>它需要当前目标、近期上下文和工具执行证据，但不能把模型隐式推理当成业务状态。InfoQueryState 的任务进度、Evidence 和完成决策仍由查询 Controller 单独维护，即使上下文被摘要，也不应靠摘要猜测任务完成状态。</p></div></article>
      <article class="memory-tier"><div class="memory-tier-label">Episodic<span>情景记忆</span></div><div><h6>记录某次交互发生了什么，保留回忆的来源</h6><p><b>内容与载体：</b>Episodic：Session completed 后由 worker 生成的“这次会话发生了什么”摘要。PostgreSQL 的 <code>episodic_summaries</code> 保存摘要、L0Abstract、SessionKey、来源 ID、主题、时间和租户/Agent/用户归属；配置了 embedding provider 时可生成向量，随后通过全文与向量混合搜索召回。</p><p><b>触发不是“用户关掉窗口”：</b>源码在一次 Run 的 Finalize 中发出 <code>session.completed</code> 事件。worker 优先复用事件已有摘要；没有摘要时读取会话消息并调用模型总结。事件名描述的是整理入口，不能据此说 Session 已删除或用户一定开启了新聊天。</p><p><b>去重与失败：</b>worker 用 <code>SessionKey:CompactionCount</code> 构造 SourceID，并按 Agent/用户/来源查重；相同来源重复事件会跳过，所以不是每轮都必然多一条摘要。没有可用摘要时不创建，写入失败也不能算成功沉淀。当前 worker 给条目设置 90 天过期时间；后续由清理逻辑处理，设置 ExpiresAt 不等同于每次搜索已做实时过期过滤。</p><p><b>适合什么：</b>适合找回“某次讨论做了什么决定、遇到过什么问题”。它是事件摘要而非权威业务数据库，摘要省略的细节需要回查来源；旧项目进度不能不加核验地作为今天的最新结论。</p></div></article>
      <article class="memory-tier"><div class="memory-tier-label">Semantic<span>语义记忆</span></div><div><h6>从事件中提炼可复用的实体、关系与事实</h6><p><b>内容与载体：</b>Semantic：从 Episodic 抽取实体、关系和跨会话稳定事实，进入 KG/长期知识。例如“某团队负责某模块”“一个业务术语表示什么”，而不是原样保存整段聊天。它的作用是把分散事件中的信息组织为可检索、可关联的知识。</p><p><b>写入链路：</b>Episodic 成功创建后发布 <code>episodic.created</code>；semantic worker 用 EntityExtractor 提取实体和关系，带上 AgentID、UserID 与 ValidFrom，再调用 <code>IngestExtraction</code> 写入知识图谱。后续 <code>entity.upserted</code> 事件可进入去重处理。提取失败不会阻塞已完成的主回复，也不能说新事实已经进入 KG。</p><p><b>读取与边界：</b>模型需要实体关联时可走 <code>knowledge_graph_search</code> 等路径；不是每轮自动把整张图谱注入。底座还存在 MEMORY.md / memory/* 的文档记忆及写后提取能力，所以“Working → Episodic → Semantic”是主要整理链路，不代表系统只有这三个表，或所有长期写入都必须经过同一条事件链。</p><p><b>冲突怎么讲：</b>有实体去重和时间字段不等于已解决事实冲突。需要区分同名不同对象、同一事实的时间变化、以及尚未确定的新旧结论。业务专项的治理策略应保留来源和适用条件，证据不足时并存并标明冲突，不把新提取的一句话直接覆盖成唯一真值。</p></div></article>

      <h5 id="memory-loading" class="memory-subhead">6.7 L0/L1/L2 只讲加载深度；上下文预算另算</h5>
      <table class="deep-table"><thead><tr><th>加载粒度</th><th>作用</th><th>当前源码能确认的行为</th></tr></thead><tbody>
        <tr><td>L0：一句话摘要</td><td>先让模型知道“可能有相关历史”，避免全文常驻。</td><td>AutoInjector 用当前问题和近期用户消息检索 Episodic，默认最多注入 5 条非空 L0Abstract；无相关结果则不注入。近期语境由最多 2 个用户轮次、合计最多 300 个 rune 构成。</td></tr>
        <tr><td>L1：搜索概览</td><td>返回匹配项、分数、路径或摘要，再决定要不要深入。</td><td>memory_search 合并文档与 Episodic 搜索结果。Schema 声明了 depth=l0/l1/l2，但当前 Execute 未按 depth 分支切换内容，因此不能宣称三个深度参数已完整生效。</td></tr>
        <tr><td>L2：详细展开</td><td>选中记录后加载更完整内容，补足概览。</td><td>memory_expand(id) 返回完整 Episodic 摘要及元信息；“完整”指这条摘要，不是 Session 全部原始对话。文档记忆的原文读取走对应文档工具。</td></tr>
      </tbody></table>
      <div class="memory-note"><b>接口声明和实现要分开：</b>AutoInjector 接口写有默认约 200 tokens 的预算，但当前 Inject 实现主要按条数和相关性过滤，没有落实 MaxTokens 的逐条 token 截断；ContextStage 还在初次计算 overhead 后追加 L0 内容。因此回答应是“采用有限条数的渐进注入，严格 token 预算还需核对实际计数与实现”，不能把注释当成硬限制已经生效。</div>
      <p><b>Prune 的预算公式：</b><code>历史预算 = 模型上下文窗口 − System/Tool Schema overhead − 最大输出 tokens − ReserveTokens</code>。正常路径在历史超过预算的 70% 时尝试软裁剪；仍超过历史硬预算时，先尝试 MemoryFlush，再做 LLM compaction。缓存 TTL 模式可能暂缓软裁剪，但超过硬预算仍会进入保护路径。压缩后再次计数仍超限时终止 Run，避免无限地向模型发送溢出请求。</p>
      <p><b>三个动作解决不同问题：</b>软裁剪是减少本轮可见的冗长工具结果，并修复 Tool Call/Result 配对；compaction 是用摘要和保留内容替换长历史，主要保证当前任务能继续；MemoryFlush 是压缩前尝试把重要内容写入长期记忆，失败会记录但仍继续压缩。它们都不能保证信息无损，更不能替代 InfoQueryState 的正式任务状态。</p>

      <h5 id="memory-vsa" class="memory-subhead">6.9 前期 VSA PoC：L1 工作记忆、L2 核心记忆、L3 档案记忆</h5>
      <p>VSA 这一版强调零后台进程、零异步 LLM 记忆提炼，值得记住的内容由模型在当轮显式写入。它的核心是“近期内容供当前推理，稳定事实小容量常驻，历史原文需要时再查”，三者通过写入、注入和检索形成循环。</p>
      <article class="memory-tier"><div class="memory-tier-label">L1<span>工作记忆</span></div><div><h6>当前这一轮，模型实际拿到的上下文</h6><p><b>保存什么：</b>L1 工作记忆：当前 Context、工具结果、进度，受窗口限制。它包括本轮问题、近期历史、系统提示、按需加载的 Skill/工具定义，以及当前 Agent Loop 中的 Tool Call 和 Tool Result。它的作用是支撑连续推理，例如记住“已经定位版本，但任务列表还没查完”。</p><p><b>怎样进入、怎样退出：</b>请求开始时从会话记录恢复历史，把 L2 核心记忆注入，再进入 ReAct 循环。长工具结果通过 reduction 卸载到按用户隔离的文件，窗口里保留可回读指针；必要时用受限的 read_file 取回。历史过长时生成摘要，摘要用于续接推理，不能等同于完整原文。L1 中的运行时上下文随 Run 结束释放，能跨重启恢复的部分依赖 L3 会话持久化。</p><p><b>关键边界：</b>从上下文移出不等于从档案删除。模型窗口里没有看到某条消息，也不代表系统再也检索不到它；工具结果里的临时数值更不能自动变成永久事实。</p></div></article>
      <article class="memory-tier"><div class="memory-tier-label">L2<span>核心记忆</span></div><div><h6>跨会话反复有用、但容量刻意受限的精炼事实</h6><p><b>保存什么：</b>L2 核心记忆：模型通过 memory_add/replace/remove 显式维护的稳定事实、用户画像和 Agent 经验，有字符预算。材料把它分为 Agent 经验笔记和用户画像两区：例如工具参数教训、用户纠正后的业务术语、长期表达偏好。这里保留原页面的操作叫法；技术介绍文档将实际写入口描述为 memory 工具的 add / replace / remove 操作，不能仅凭叫法断言有三个独立注册工具。</p><p><b>怎样写入：</b>模型决定是否调用记忆工具；同步事务写入 memory_entries，返回条目和用量。材料给出的可配置预算为经验笔记 2200 字符、用户画像 1375 字符。容量不足时拒绝继续新增，要求先合并或移除过时条目。每 10 轮的可配置提醒用于促使模型整理，不是后台自动把每句话变成记忆。</p><p><b>怎样读取：</b>每个用户轮次第一次调用模型前读库并全文注入；同一次 Run 的后续模型调用复用冻结的注入块，使前缀稳定。工具写入本身当轮落库并返回结果，但冻结的核心记忆注入块通常下一轮才刷新。这解释了“记忆已保存”和“本轮系统提示已经更新”为什么不是同一件事。</p><p><b>失败与压缩：</b>注入读库失败时用空注入并记录日志；写工具失败将错误回给模型。材料中的压缩联动采用跨轮信号，下一轮提醒保存重要结论，不能因此声称压缩前必然完成了长期持久化。</p></div></article>
      <article class="memory-tier"><div class="memory-tier-label">L3<span>档案记忆</span></div><div><h6>保存历史原文，需要细节时再检索</h6><p><b>保存什么：</b>L3 档案记忆：SQLite messages 全量原文 + FTS5/trigram 检索；按需通过 session_search 回灌，不把全历史塞进窗口。它适合回答“上次具体怎么说的”“当时为什么采用这个方案”，补足核心记忆只保留精炼结论的不足。</p><p><b>读取机制：</b>对话自动落档并维护全文索引。模型需要回忆时调用 session_search，材料中的返回是“会话开头 3 条 + 命中附近 ±5 条 + 结尾 3 条”的锚定视图，让模型同时看到目标、细节和结论。trigram 用于改善中文匹配，召回的是原文片段，检索步骤本身不经 LLM 再次转述。</p><p><b>与另外两层的反馈关系：</b>L1 对话落入 L3；模型从交互中挑出稳定事实写入 L2；下一轮 L2 全文注入 L1，L3 按需检索补回 L1。L2 被用户纠正时更新精炼事实，L3 仍可用于核对当时的原始表述。原文检索减少转述损失，但不保证所有相关内容必然召回。</p></div></article>

      <h5 id="memory-questions" class="memory-subhead">6.10 面试时把这几种追问分别答完整</h5>
      <div class="answer-script"><b>“你的记忆分几层？”</b><p>我的目标设计按 Working、Episodic、Semantic 三层组织。Working 是当前 Run 的上下文，负责当前问题和工具循环；Episodic 保存有时间与来源的历史事件，帮助回忆之前讨论过什么；Semantic 提炼稳定偏好、实体关系和适用条件明确的事实，供跨会话复用。每层再按租户、Bot、个人或群设置作用域，因此“个人和群”是归属维度，不是另一套上下层。新的 Run 加载当前群上下文与公共记忆，再按真实 Sender 加载本场景允许使用的个人记忆，不能跨发送者复用完整 Prompt。</p><p>如果追问演进，我再解释前期 VSA 的 L1 工作记忆、L2 精炼核心记忆、L3 SQLite 原文档案；后续 GoClaw 提供 Working → Episodic → Semantic 的事件整理基础。它的 L0/L1/L2 又是渐进加载深度，不是这三层的同义词。当前业务查询的完成情况保存在独立正式状态中，不能由记忆摘要推断。</p></div>
      <div class="answer-script"><b>“Workspace、Session 和记忆是不是一回事？”</b><p>不是。Session 保存这段会话聊过什么；Workspace 确定本次能访问哪些文件和产物；长期 Memory 保存可供未来复用的事实与事件。Context 是本轮的装配结果，从 Session 取历史、从 Memory 取相关内容，再结合提示、工具和当前问题交给模型。它们有联系，但生命周期和隔离键各自独立。同群可以共享会话和文件，同时让每次 Run 使用当前发言人的个人记忆；换 Session 也不应自动删除长期记忆或工作区。</p></div>
      <div class="answer-script"><b>“你怎么证明不会串用户？”</b><p>我不会只说加了 user_id，而会沿实际路径看：可信入口如何建立租户与用户，Session 缓存和 SQL 是否同时带作用域，Workspace 如何解析路径，记忆搜索、按 ID 展开、后台写回是否都校验归属。GoClaw 的 Session 有租户前缀缓存和 tenant_id + session_key 查询证据，但 shared 配置会改变记忆可见范围，按 ID 展开也需要单独核验。我们的群聊设计进一步区分当前群和真实 Sender：群资源归群，个人记忆每轮按 Sender 装配，私有注入不写回群共享历史，提取个人事实时只能用本人发言取证。</p></div>
      <div class="answer-script"><b>“上下文满了，或者记忆和当前信息冲突怎么办？”</b><p>上下文满了先做预算检查，减少冗长工具结果，必要时尝试长期记忆写入后再压缩历史；压缩后仍超限就停止，不能无限循环。任务是否完成仍看正式查询状态和 Evidence，不能由摘要决定。旧记忆只是历史线索，遇到版本进展或指标变化必须查当前业务源；出现冲突先比对对象、时间、来源和权限。明确纠正才替代，适用条件不同则并存，不确定就补查并说明边界。</p></div>
      <div class="memory-source-panel"><b>核对依据与代码定位</b><p>前期机制来自《VSA(Voyager Super Agent)技术介绍 (1)》§5.1、§5.4；群聊设计来自《方案设计初稿 (2)》§3.2.2 的身份映射、动态装配、Memory 提取治理与异常恢复。下面代码定位均为本地 GoClaw 提交 <code>0d9db376</code>，用于核验底座机制，不代表个人完成了全部底座开发。</p>
        <ul><li>上下文与预算：<code>internal/pipeline/context_stage.go:28</code>、<code>prune_stage.go:50</code>、<code>memory_flush_stage.go:22</code>。</li><li>事件与三层整理：<code>internal/agent/loop_pipeline_adapter.go:187</code>；<code>internal/consolidation/episodic_worker.go:36</code>、<code>semantic_worker.go:24</code>。</li><li>加载粒度与实现差异：<code>internal/memory/auto_injector_impl.go:27</code>；<code>internal/tools/memory.go:80</code>、<code>memory_expand.go:45</code>。</li><li>身份和 Session：<code>internal/store/context.go:291</code>（MemoryUserID）、<code>:326</code>（KGUserID）；<code>internal/sessions/key.go:48</code>；<code>internal/store/pg/sessions.go:102</code>、<code>sessions_list.go:336</code>。</li><li>文件和记忆落点：<code>internal/workspace/resolver_impl.go:27</code>；<code>internal/tools/memory_interceptor.go:75</code>；<code>internal/store/pg/memory_search.go</code>（ftsSearch）；<code>episodic_search.go:29</code>、<code>episodic_summaries.go:67</code>。</li></ul>
      </div>
    </div>
    <div class="answer-script"><b>最终完整回答可以这样说：</b>“这个项目不是从零写一个聊天机器人。前期 VSA PoC 用 Go、Eino ADK 和 MCP 跑通了 D-Chat 私聊/群聊以及 Cooper、Spaceway、数易三源真实链路；后续以受 OpenClaw 架构启发的 GoClaw 作为通用 Agent Runtime 参考，复用它的 Pipeline、Session、Context、Workspace、Memory、Skill/Tool/MCP、Checkpoint 和治理能力。我在信息查询专项里补的是 Query Gate、InfoQueryState、Controller、来源路由、只读工具治理、结果归一化、Evidence 和完成验收。这样模型负责理解和提出下一步，Runtime 负责保存状态、控制工具和判断能否回答；当证据不足时继续补查或明确降级，而不是让模型凭感觉结束。”</div>

    <h4 id="topic-isolation" class="chapter-subheading">底座适配：Session 与 Workspace 的隔离证据链</h4>
    <div class="deep-code">BaseDir/
  └─ tenants/{tenantSlug-or-tenantID}/
      ├─ {agentKey}/{userID}/             ← 个人/DM 工作区
      ├─ {agentKey}/{chatID}/             ← 群聊会话工作区（按 PeerKind）
      └─ teams/{teamID}/                  ← shared team workspace
          └─ {chatID-or-userID}/          ← isolated team workspace

Session Key：agent:{agentKey}:{channel}:{direct|group}:{chatID}[:thread:{threadID}]
Session 数据库唯一边界：(tenant_id, session_key)
热缓存键：{tenant UUID}:{session_key}</div>
    <div class="deep-grid">
      <article class="deep-card base"><h5>Session Key 解决什么</h5><p><code>BuildSessionKey</code> 按 agentKey、channel、PeerKind、chatID 生成；论坛 topic/DM thread 再追加 thread。它区分会话历史边界，但源码明确写着 tenant isolation separately via context，所以不要说“把 tenant_id 拼进 Session Key”。</p></article>
      <article class="deep-card base"><h5>租户隔离的证据链</h5><p>入口把 TenantID 写入 Context；PG Session Store 的 cache key 先取 TenantID 再拼 session key；sessions 表有 tenant_id，唯一冲突是 (tenant_id, session_key)；List/ListPaged 会按 Context TenantID 加 WHERE 条件。相同 agent/session 名在两个租户可以共存，但不会读到对方缓存或数据库行。</p></article>
      <article class="deep-card base"><h5>Workspace Resolver 的三条路径</h5><p>Delegate 优先，要求 shared path 在 BaseDir 内并限制 ExportPaths；Team 根据 shared/isolated 决定 teamRoot 或追加 chat/user；个人路径按 tenant/agent/user 或 group chat 解析。路径片段 sanitize，拒绝 <code>../</code> 等穿越；Team 目录权限比个人目录更严格。</p></article>
      <article class="deep-card warn"><h5>为什么本地文件不是高可用</h5><p>Workspace Resolver 只负责路径、作用域和访问边界，不负责跨机器复制。Session/Memory 写 PostgreSQL 也不会自动备份本地 Workspace 文件。主机、磁盘、容器丢失时，本地文件可能丢失；这必须单独设计容灾。</p></article>
    </div>
    <h4 id="topic-recovery">07 · 失败处理、状态持久化与恢复</h4>
    <div class="design-prose">
      <p>我把恢复分成三件事：恢复聊过的内容、恢复业务任务进度、恢复文件和证据。Session Checkpoint 能保存消息，不会自动保存 InfoQueryState 的全部任务状态；数据库有备份，也不会自动备份本地附件。因此目标设计将 QueryRun、Task、Observation 和证据元数据持久化，把较大的正文和文件放进可恢复的内容存储，以作用域、RunID、EvidenceID 和文件版本关联。</p>
      <p><b>一次可靠提交：</b>调度前保存调用意图与状态版本，工具完成后先固化可校验的证据对象，再在事务里追加 Observation、写入证据引用并更新 Task 和 Query 决策。结果采用稳定事件 ID 或 ToolCallID 去重；通过版本检查或单写者约束避免旧补丁覆盖新状态。外部文件存储与数据库无法简单跨库原子提交，所以文件先写不可变对象，元数据再引用，孤立对象异步清理；不能先宣布证据可用再慢慢补正文。</p>
      <table class="deep-table"><thead><tr><th>故障发生位置</th><th>恢复判断</th><th>采取的动作</th></tr></thead><tbody>
        <tr><td>已保存调用意图，尚未执行</td><td>没有完成记录，调度租约过期。</td><td>重新授权、检查预算后重调度；不能直接标记任务已完成。</td></tr>
        <tr><td>工具已返回，结果尚未落库</td><td>本地无法确定远端执行结果。</td><td>只读查询可在时效检查后重试；若扩展到写工具，必须查远端幂等记录或人工确认，不能盲目重放。</td></tr>
        <tr><td>证据对象已存，任务补丁未提交</td><td>存在未引用对象或待处理结果事件。</td><td>按稳定 ID 重放归一化与提交，防止重复 Observation；清理真正无主对象。</td></tr>
        <tr><td>任务补丁已提交，回答未送达</td><td>业务结果可用，投递状态未知或失败。</td><td>按投递记录补发并使用渠道幂等能力；不重新调用所有工具。渠道无去重能力时，仍需接受可能重复投递的边界。</td></tr>
        <tr><td>索引丢失或更新失败</td><td>证据/记忆正文仍完整。</td><td>从正文和元数据重建索引；暂不可检索与事实不存在必须分开。</td></tr>
        <tr><td>主机或磁盘损坏</td><td>运行内存和本地缓存消失。</td><td>恢复数据库与内容存储，再校验 manifest、作用域和版本；只有完成恢复校验后才能续跑。</td></tr>
      </tbody></table>
      <p><b>工作区如何解耦：</b>Workspace 负责“这次运行可以使用哪些文件”，持久内容存储负责“文件能否在机器故障后找回来”。目标方案把本地 Workspace 视为可重建的工作目录，对需要保留的附件和产物维护对象键、内容 hash、版本与作用域清单；上传成功再发布 manifest。本地临时文件写完后同步并原子重命名，必要时同步父目录；跨文件系统不能依赖 rename 的原子性。数据库快照、对象版本和备份恢复点需要对齐，不能只恢复其中一半。</p>
      <p><b>恢复不等于无条件续跑：</b>读取最近已提交状态后，先检查取消与超时、用户当前权限、来源时效和证据完整性。过期事实重新查询，已失去访问权的证据停止使用，无法恢复的正文标注缺失。总预算继承已消耗部分；Checkpoint 降低丢失范围，无法承诺零丢失。能够容忍丢多少数据、恢复需要多久，应作为部署要求验证，不能仅凭用了 PostgreSQL 或对象存储就声称高可用。</p>
    </div>
    <table class="deep-table"><thead><tr><th>层次</th><th>可做什么</th><th>故障时怎么恢复</th></tr></thead><tbody>
      <tr><td>Session / Query Metadata</td><td>PostgreSQL 保存 Session、QueryRun、Task、Evidence 元数据；Checkpoint 减少中途丢失。</td><td>数据库主从/高可用、定期备份、WAL/PITR；按 RunID 重建业务状态。</td></tr>
      <tr><td>Workspace 文件</td><td>持久卷、共享文件系统或对象存储保存 Context Files、附件和 Agent 产物。</td><td>文件版本化快照、跨可用区/异地备份、manifest 校验缺失文件；恢复后再挂载到对应 tenant/agent scope。</td></tr>
      <tr><td>写入一致性</td><td>临时文件写完后 fsync，再原子 rename；元数据和文件 manifest 记录版本、hash、更新时间。</td><td>重启后扫描未完成临时文件，按 manifest 判断回滚或补偿，不让半文件进入模型上下文。</td></tr>
      <tr><td>查询续跑</td><td>QueryRun/Task/Observation/Evidence 以 RunID、TaskID、ToolCallID 持久化；已完成只读任务可复用。</td><td>恢复时重新验收 Evidence；已执行的请求按 RequestKey 去重，不重复执行有副作用的工具。</td></tr>
    </tbody></table>
    <div class="answer-script"><b>被问“文件在本地、服务器坏了怎么办”：</b>“GoClaw 源码已经解决了租户、Agent、用户、群聊和委派的路径隔离，但本地文件系统本身不是容灾方案。生产部署时我会把运行数据和文件数据分开治理：Session、Trace、权限和 Query 元数据放高可用数据库并备份；Workspace 放持久卷、共享文件系统或对象存储，采用版本化快照、原子写入和恢复校验。这样服务器故障后可以先恢复元数据，再挂载对应租户工作区，不把‘能隔离’误说成‘天然能恢复’。”</div>

    <h4 id="topic-governance">08 · 权限、安全与底座选型</h4>
    <div class="design-prose">
      <p><b>选型从需要改什么出发：</b>这套方案需要在模型调用前后和工具执行前后挂载控制逻辑，需要稳定的运行状态、Session、工作区解析、身份上下文与可替换存储。GoClaw 的阶段式 Pipeline 和这些接口让业务控制可以插入明确位置，无须把全部能力重写。因此选择理由是与团队技术栈和目标改造路径匹配，而不是“Go 语言天然安全”或“另一个项目一定不能做”。</p>
      <p><b>为什么服务器部署会放大风险：</b>如果 Agent 共用高权限机器人凭证，模型又可调用 Shell、文件和网络工具，外部文档中的恶意指令可能诱导它读取其他工作区、携带凭证请求外部地址或把越权内容输出到群里。风险来自可信身份、模型输出和真实工具权限之间缺少检查，部署在服务器本身并不构成漏洞。OpenClaw 和 GoClaw 都必须根据具体版本、工具配置与运行权限检查，不能凭项目名称下结论。</p>
      <p><b>目标设计的权限链：</b>入口验证用户与群身份，得到租户和真实操作者；查询时按该主体筛选候选资源，取正文时再检查对象权限；工具执行前检查只读能力、参数和出站目的地；结果写入 Evidence 时携带作用域；最终回答投递前检查接收群是否允许看到这些信息。搜索时带过滤、按 ID 读取却不检查，仍然会越权。</p>
      <p><b>机器人凭证不能代替用户授权：</b>连接成功只说明机器人有权调用 API。如果下游不提供用户委托或 ACL 查询，就无法证明某位提问者有权读取某篇资源。我的设计对这类来源采用明确授权的公共/项目资源集合，无法核验则拒绝或走授权流程；不能使用高权限机器人读出正文后再让模型判断“能不能分享”。权限不足是查询限制，不能通过更换高权限工具绕开。</p>
      <p><b>只读也要防泄露：</b>只读限制减少修改和删除风险，但仍可能读取敏感数据。因此需要最小可见字段、证据作用域、日志脱敏、敏感工具结果过滤、网络访问白名单和披露限制。外部内容标为不可信可以帮助模型分辨资料与指令，真正的执行约束仍由 Runtime 完成。Workspace 的路径检查也要覆盖符号链接与真实路径边界，不能只检查字符串中有没有“../”。</p>
    </div>
    <div class="risk-list">
      <article class="risk-item"><b>当前 MCP 鉴权的真实限制</b><p>D-Chat 可以传 userId/username，但当前 Cooper、数易、Spaceway 的 MCP 连接主要按机器人凭证鉴权，不能直接证明“当前用户一定有权看这份文件”。Cooper 团队空间正文也没有稳定返回 C2/C3/C4/C5 等密级，因此一期不能宣称完成了用户级文件鉴权。</p></article>
      <article class="risk-item"><b>一期采用高权限 MCP 风险收敛</b><p>只暴露查询所需的只读工具，禁用 exec 等通用命令能力，不把原始高权限 readContent/download 工具直接交给模型，而是走受控查询、候选资源确认和正文读取路径。</p></article>
      <article class="risk-item"><b>外部内容一律当数据</b><p>Cooper 文档或其他 MCP 返回内容可能含 Prompt Injection。要用不可信数据标记，禁止把文档中的指令当系统指令；PreToolUse 在真实 I/O 前二次拦截，Trace 记录调用、拦截和来源。</p></article>
      <article class="risk-item"><b>OpenClaw / GoClaw 的准确对比</b><p>GoClaw README 的原话是“originally inspired by OpenClaw project architecture”，所以应说“受 OpenClaw 架构启发”，不能说成官方 Go 版或简单 fork。OpenClaw 风险不是 Node 本身，而是模型 + Shell/文件/插件权限 + 外部不可信内容的组合；GoClaw 通过多租户 Context、RBAC、Workspace、ToolAllow、MCP grant、输入防护、SSRF/path traversal 防护、命令审批和可选 sandbox 提供更多控制点，但错误配置仍会越权。</p></article>
    </div>
    <div class="answer-script"><b>被问“为什么选 GoClaw、不选 OpenClaw”：</b>“我不会把它回答成谁绝对安全。OpenClaw 的能力更像个人助手，强大的本地 Shell、文件和插件能力如果直接暴露给不可信模型，Prompt Injection 的爆炸半径会很大。GoClaw 是受 OpenClaw 启发、面向多租户 Gateway 的 Go 实现，它把租户、Session、Workspace、RBAC、工具白名单、MCP grant、审计和数据库存储作为基础设施。对我们的企业信息查询场景，我更看重可控的权限边界、可观测性和后续多用户扩展；同时仍然要在查询专项里只开放只读 MCP，不能把底座能力当成安全保证。”</div>

    <h4 id="topic-evaluation">09 · 端到端评测、Bad Case 与迭代</h4>
    <div class="design-prose">
      <p>评测对象是“用户问题进入，到最终回答输出”的整条链路。只检查答案文字，无法发现重复调用、越权尝试或碰巧答对；只检查工具执行成功，也无法判断实际问题是否完成。因此我把题目、可核对真值、允许来源、预期限制与过程约束一起管理，让同一个案例可以用于定位和回归。</p>
      <p><b>简历记录：</b>74 道问题覆盖 8 类场景，其中 60 道绑定真实文档或结构化真值。整体通过率从 65.3% 提升至 85.1%，事实／来源覆盖从 70.3% 提升至 87.9%，Pass3 稳定通过从 41.9% 提升至 70.3%。这些数值按简历记录保留；基线、模型版本、真实工具与 fixture 的覆盖范围、判分分母和原始轨迹需与对应实验记录一起解释，不能从百分比反推出未提供的运行过程。</p>
      <p><b>判分分工：</b>规则裁判检查可确定的数值、方向、来源 ID、必需字段、禁止写入与越权行为；LLM Judge 检查自然语言完整性、切题和多源融合，并要求对照证据；人工抽检处理边界和校准偏差。Judge 不能自行把模型输出当真值。工具不可用、数据变化和题目歧义单独分类，避免把所有失败都归因给推理能力。</p>
      <p><b>Pass3 的口径：</b>固定题目、真值和可比配置，独立运行三次，三次均通过才把该题计入稳定通过；不是三次中成功一次，也不是单次通过率简单立方。每次运行应明确是否重置 Session、缓存和记忆，否则前次结果可能泄漏到后次。数据时变场景使用快照或明确评测时间，不让真值漂移伪装成随机失败。</p>
      <p><b>Bad Case 如何回到设计：</b>“无记忆就说无业务数据”回到来源路由；“换问题还沿用旧目标”回到初始化与改写；“读不到正文却给结论”回到 Evidence 验收；“反复发现同一工具”回到能力注册和预算；“引用正确但结论夸大”回到最终语义校验。每次修改保留原失败题，并加入能区分正确行为与过度拦截的相邻问题。没有消融记录时，只报告整体变化，不把全部提升归功于单个模块。</p>
    </div>
    <table class="project-table"><thead><tr><th>现象</th><th>暴露的问题</th><th>面试时的结论</th></tr></thead><tbody>
      <tr><td>问“mhd 项目现在是什么进度”时只查 Knowledge Graph 和 Memory，没有召回就直接让用户补充。</td><td>“没有记忆”被误解成“没有业务数据”。</td><td>记忆召回失败和业务事实不存在必须分开；查询应继续走正确来源或明确说明检索范围。</td></tr>
      <tr><td>问“曼哈顿项目进展”时，Spaceway Skill、工具发现和真实权限边界不一致，多轮仍无法稳定取数。</td><td>Skill 描述、工具 Schema、权限和实际能力没有统一。</td><td>能力治理不能只靠 Prompt，要有白名单、Schema 校验和错误回填。</td></tr>
      <tr><td>用户从项目进展改问“有哪些团队空间”后，回答仍沿用上一轮项目逻辑。</td><td>当前 Query 被历史 Goal 污染。</td><td>Query Rewrite 要重建当前目标，历史只作为消歧上下文，不能覆盖新问题。</td></tr>
      <tr><td>搜索结果能返回资源，但继续读取正文失败。</td><td>资源类型、appId、权限和 resourceId 存在差异；搜索结果不是正文证据。</td><td>来源引用必须绑定可读取的原始资源和错误边界。</td></tr>
      <tr><td>一次查询出现约 19 次 LLM 调用、18 次工具调用、约 230 秒耗时。</td><td>工具发现、来源路由、错误恢复和循环控制成本过高。</td><td>要用任务预算、重复检测、并行只读和明确停止条件约束 Agent Loop。</td></tr>
      <tr><td>Trace 显示 run completed，但业务请求仍未完成。</td><td>运行级成功不等于业务任务成功。</td><td>必须由 Controller 根据 Task 和 Evidence 判断完成，不能使用模型或 Run 的状态代替业务完成。</td></tr>
    </tbody></table>
    <div class="project-grid">
      <article class="deep-card"><h5>评测资产与重复运行要求</h5><p>端到端评测集共 74 题：Robotaxi 主轨 19、真实产品文档 8、城市维度查数 10、多轮对话 5、合规红线 8、Robotaxi 跨源循环 1、AV 脱离数据 22、AV 跨源循环 1。底层有月度核心指标 77 行、周度订单 35 行、AV 脱离数据 22,922 行，以及 fixture 文档。</p><p>稳定性评测采用每题三次的口径，保留每次 Trace、判分和使用的数据版本；是否全部走真实 MCP 以对应运行记录为准。代码裁判检查数值、方向、来源、写操作误触发、越权和兜底；LLM 裁判检查完整性、切题、连贯和源融合；人工抽检用于校准 LLM judge。</p></article>
      <article class="deep-card"><h5>设计落地与验证记录</h5><p>查询控制、持久化恢复和群记忆治理均按本页目标方案组织；落地验证分别检查真实来源接入、状态故障恢复、跨群跨用户隔离、权限拒绝和三次运行一致性。前期 PoC 记录、简历指标、目标设计三类材料各有用途，不能把其中一类自动当成另外两类的验证证据。</p><p>持续建设项包括 QueryRun / Task / Evidence 的持久化恢复、统一 Skill / Tool / MCP Schema 与权限目录、群聊作用域和审计、真实 MCP 回归，以及通过 Trace 定位循环、延迟和证据缺口。每项验证保留输入、版本、期望结果和实际日志，便于面试追问和后续实现核对。</p></article>
    </div>
    <div class="project-boundary"><b>材料口径：</b>本页以个人设计为主线，底座源码用于解释复用与接入；实验结果按已提供记录呈现。设计完成、代码完成、上线验证是不同状态，实际进度以对应材料为准。</div>
    <h4 id="topic-walkthrough">10 · 一次完整查询的状态演进与综合追问</h4>
    <div class="design-prose">
      <p class="design-caption">以下是为解释设计构造的案例，不是实际线上日志。问题为“0701 版本有没有上线风险”，假设项目对象已唯一确认，当前用户拥有相应项目资源权限。</p>
      <table class="deep-table"><thead><tr><th>阶段</th><th>本次新增信息</th><th>状态与下一步</th></tr></thead><tbody>
        <tr><td>① 入口与初始化</td><td>保留原问题、真实 Sender 和群；形成 T1 上线范围/规则、T2 未关闭阻塞、T3 相关验收指标。</td><td>三个 Task 均 pending；Query Decision=pending。先定位版本范围，不能查一个同名项目替代。</td></tr>
        <tr><td>② 准备与调度</td><td>T1 得到适用范围，T2/T3 无相互依赖，可并行；当前工具集只开放相关只读能力。</td><td>T1 经证据验收为 satisfied；T2/T3 转 in_progress。Runtime 保存调用意图再执行。</td></tr>
        <tr><td>③ 首批结果</td><td>T2 读到阻塞记录与有效规则；T3 临时超时，生成失败 Observation，无 Evidence。</td><td>T2 satisfied；T3 仍 in_progress，因为有限重试路径存在。超时不能被写成“指标正常”。</td></tr>
        <tr><td>④ 反馈与补查</td><td>T3 在重试预算内成功；若仍失败则检查其他授权来源。当前轮不再重复读取 T2。</td><td>PrepareQueryRound 根据新状态只投影缺口。成功则验收 T3；无路径则 blocked。</td></tr>
        <tr><td>⑤ 整题验收</td><td>重新核对时间、对象、字段、来源和冲突，而非只数成功工具次数。</td><td>全部 satisfied → answer；T3 blocked 且无路径 → degraded，仍使用 T1/T2 的有效证据。</td></tr>
        <tr><td>⑥ 回答验收</td><td>只允许已确认的事实及其来源进入答案，风险结论必须指明规则和依据。</td><td>“全部指标正常”若无支持则拒绝；有补查路径回循环，否则保留不确定性。验收通过才输出。</td></tr>
        <tr><td>⑦ 结束与记忆</td><td>保存可共享的会话结果，触发增量提取；个人注入与敏感工具结果不原样写入群历史。</td><td>稳定术语与确认结论经治理进入对应 Scope；当前版本进度仍附时间，下次问最新进度要重新查源。</td></tr>
      </tbody></table>
      <h5>把关键追问连起来理解</h5>
      <p><b>“既有 Session，为什么还需要查询状态？”</b>Session 记的是对话，不能稳定表达任务还缺哪些事实、哪个请求已经失败、哪些证据经过验收。查询状态保存业务控制，Context 只是给模型看的当前投影；压缩历史不会因此把任务标成完成。</p>
      <p><b>“一个工具成功了，为什么还可能降级？”</b>成功可能只覆盖其中一个子问题，也可能只返回搜索摘要或部分分页。整题要按原始目标验收所有必要事实；无法查到指标时，可以报告已确认的阻塞风险，但不能进一步保证其他条件都正常。</p>
      <p><b>“用户 A 在群里查到结果，B 能不能接着问？”</b>群允许共享的上下文和公共事实可以接续；B 的新 Run 重新建立身份与权限，并重新装配个人记忆。A 曾经有权读到的私有资源不能因为出现在缓存或证据存储中就对 B 放开。</p>
      <p><b>“重启以后还会不会重复查？”</b>可以从已提交任务、Observation 和 Evidence 恢复进度，对有效结果复用，对不确定的只读调用受控重试；续跑前重新检查权限、时效和预算。消息 Checkpoint 不足以单独提供这个能力，需要第 07 节设计的业务状态持久化。</p>
      <p><b>“怎么说明这些改造有价值？”</b>先解释它们分别解决提前结束、历史目标污染、工具循环和身份串用，再用相应 Bad Case 回归与端到端评测记录验证。架构解释回答为什么可能改善，实验记录回答实际改善多少，两者形成完整证据链。</p>
    </div>
</div>
</section>
</div></section>
    <section id="second"><div class="rendered"><h2>3. 第二项目：Robotaxi 碰撞检测 VLM 评测</h2>
<p class="deep-intro"><b>项目定位：</b>这是一个面向 Robotaxi 本车视角碰撞检测模型的安全评测与 Bad Case 治理项目。简历中的个人主线是安全指标重构、争议帧复核和失败模式分析；平台的完整前后端、数据池和评测调度属于团队整体能力，面试时要把“我参与的评测闭环”和“平台提供的支撑能力”分开表达。</p>
<h3>3.1 30 秒版本</h3>
<blockquote><p>第二个项目是 Robotaxi 碰撞检测 VLM 的评测和 Bad Case 治理。因为真实碰撞是低频但高风险事件，单看 Accuracy 会被大量无碰撞帧抬高，无法暴露漏检，所以我们以人工 Ground Truth 为锚，重点看 Recall 和偏向召回的 F2；模型与真值不一致或证据不足时，再让独立的专家 VLM 盲审连续证据帧，最后交人工复核。泛化集上微调模型 Recall 从 4B Zeroshot 的 0.185 提升到 0.812，FN 从 549 降到 127，Precision 为 0.958，并对 396 条 Bad Case 做了失败模式归因。</p></blockquote>
<h3>3.2 90 秒版本</h3>
<blockquote><p>这个项目服务于 Robotaxi 本车视角的碰撞检测模型评测。早期最大的问题不是没有指标，而是类别极不均衡：绝大多数帧没有碰撞，模型即使漏掉很多真实碰撞，整体 Accuracy 仍然可能看起来不错；同时，只看一个汇总指标也无法回答模型为什么错、应该补数据还是调整提示词。</p><p>我参与建立了一个以人工 GT 为客观锚点的三方评测闭环。第一层把被评模型预测和人工 GT 对齐，落到 TP、FP、FN、TN 的混淆矩阵，重点关注 Recall 和 β=2 的 Fβ，把漏检风险显式放在更高权重，同时保留 Precision 和 FPR，防止为了召回而大量误报。第二层对争议帧或 Bad Case 使用独立专家 VLM 做连续证据盲审：先由观察员描述画面事实，再由正方和反方分别举证，最后由判别角色裁定；一审不暴露 GT，分歧或存疑样本进入人工复核。</p><p>在 8,021 帧、674 个真实碰撞的泛化集上，微调模型相对 Qwen3-VL-4B Zeroshot 的 Recall 从 0.185 提升到 0.812，FN 从 549 降到 127，Precision 达到 0.958。之后我们对 396 条已归因 Bad Case 分类，主要集中在碰撞瞬间没有拍到接触、画面边缘接触、鱼眼畸变下车身与围栏紧贴等场景，并将人工确认的模式回流到数据补充、Prompt 和固定回归集。这个项目让我形成的核心方法是：先统一真值和指标，再用证据链解释错误，最后让 Bad Case 反哺下一轮迭代。</p></blockquote>
<h3>3.3 白板图：从模型预测到可复现评测</h3>
<div class="project-board"><div class="board-flow"><div class="board-node board-input"><b>输入资产</b><span>模型预测、连续 5 帧证据图、人工 GT、模型 / Prompt / 数据版本</span></div><div class="board-arrow">↓</div><div class="board-node board-state"><b>第一层：客观指标</b><span>预测 vs GT → TP / FP / FN / TN → Accuracy、Precision、Recall、FPR、F2</span></div></div><div class="board-loop"><div class="board-loop-title">第二层：只对争议帧和 Bad Case 做证据复核，避免让“模型评模型”替代真值</div><div class="board-horizontal"><div class="board-node"><b>盲审一审</b><span>不展示 GT，先输出独立 blind_verdict</span></div><div class="board-arrow right">→</div><div class="board-node"><b>多角色取证</b><span>观察员 → 正方 / 反方 → 判别角色终裁</span></div><div class="board-arrow right">→</div><div class="board-node"><b>分歧判断</b><span>与 GT 不一致、证据不足或角色存疑</span></div></div><div class="board-return">↓ 需要人工判断的样本进入复核队列；人工结论拥有最高真值优先级</div></div><div class="board-outcomes"><div><b>指标入库</b><span>人工 GT / 修正 GT 确认后计算并对比实验</span></div><div><b>Bad Case 归因</b><span>错误类型、帧级证据、严重程度和可复用规则</span></div><div><b>迭代回流</b><span>补数据、重标、改 Prompt、建立 Hard 回归集</span></div></div><div class="board-support"><b>平台支撑：</b>数据准备、异步评测、对比看板、Bad Case 分析、人工复核、版本化 Prompt 与实验记录把这条链路固化下来；个人面试重点讲清指标口径、复核边界和归因方法。</div></div>
<h3>3.4 先把业务问题说清楚：为什么 Accuracy 不够</h3>
<div class="project-grid"><article class="deep-card self"><h5>正样本少，但漏检代价高</h5><p>泛化集共有 8,021 帧，其中真实碰撞 674 帧，非碰撞帧 7,347 帧。碰撞是低频事件，业务却不能接受“真实发生了碰撞但模型没有报出来”。FN（False Negative）直接对应安全风险，因此评测必须把正样本找回能力放在第一层。</p></article><article class="deep-card self"><h5>一个极端反例</h5><p>如果模型把所有帧都预测为“无碰撞”，Accuracy 仍为 7,347 / 8,021，约 91.6%，看起来不低；但 Recall 为 0，674 个真实碰撞全部漏掉。这个例子说明 Accuracy 不能单独代表安全质量。</p></article><article class="deep-card base"><h5>为什么不能只追 Recall</h5><p>把阈值调得很低、几乎见到任何异常都报碰撞，可能得到更高 Recall，但会产生大量 FP，造成无效人工复核和业务干扰。因此保留 Precision、FPR、FP 数量和场景分布，判断召回提升是不是以不可接受的虚警为代价。</p></article><article class="deep-card base"><h5>模型选择要看同一口径</h5><p>Recall 0.812、FN 127 只有在同一泛化集、同一 GT 口径和明确的基线下才有意义。汇报时同时说清 8,021 帧、674 个真实碰撞、对比 Qwen3-VL-4B Zeroshot，避免只报一个“提升百分比”。</p></article></div>
<h3>3.5 混淆矩阵：把“错了”拆成四种可解释结果</h3>
<div class="project-board"><table class="project-table"><thead><tr><th rowspan="2">微调模型（8,021 帧）</th><th colspan="2">人工 Ground Truth</th></tr><tr><th>真实碰撞</th><th>真实无碰撞</th></tr></thead><tbody><tr><th>预测碰撞</th><td class="self-col"><b>TP = 547</b><br>真实碰撞且成功报出</td><td><b>FP = 24</b><br>没有碰撞但误报</td></tr><tr><th>预测无碰撞</th><td class="warn-col"><b>FN = 127</b><br>真实碰撞但漏检，安全上最需要关注</td><td><b>TN = 7,323</b><br>真实无碰撞且正确不报</td></tr></tbody></table><div class="project-grid"><article class="deep-card self"><h5>TP / TN：正确判断</h5><p>TP 说明模型捕获了真实碰撞；TN 说明模型没有把普通行驶误报成碰撞。二者共同影响 Accuracy，但不能掩盖 FN 的安全代价。</p></article><article class="deep-card warn"><h5>FN：漏检</h5><p>真实碰撞但模型预测无碰撞。这个类别是安全评测的核心风险，Bad Case 分析会继续追问：是接触没有出现在证据帧、画面边缘困难、鱼眼畸变，还是数据和真值本身有问题。</p></article><article class="deep-card base"><h5>FP：误报</h5><p>真实无碰撞但模型预测碰撞。误报会增加人工复核和运营干扰，尤其要区分“他车相撞”与“本车发生碰撞”，所以不能用无限报碰撞换 Recall。</p></article></div></div>
<h3>3.6 指标定义：每个数字到底在回答什么</h3>
<div class="project-grid"><article class="deep-card"><h5>Accuracy：整体判断正确率</h5><p class="formula"><code>Accuracy = (TP + TN) / (TP + TN + FP + FN)</code></p><p>回答“所有帧里总体判对了多少”。它会被大量 TN 主导，在碰撞低频时容易显得虚高，因此只能作为概览，不能作为安全结论。</p></article><article class="deep-card"><h5>Precision：报碰撞时有多可信</h5><p class="formula"><code>Precision = TP / (TP + FP)</code></p><p>回答“模型报为碰撞的帧，有多少确实是碰撞”。Precision 低说明虚警多，会消耗人工和业务资源。</p></article><article class="deep-card self"><h5>Recall：真实碰撞找回了多少</h5><p class="formula"><code>Recall = TP / (TP + FN)</code></p><p>回答“所有真实碰撞里，模型找回了多少”。FN 在分母中直接体现漏检，所以它是这个安全场景最关键的单项指标。</p></article><article class="deep-card"><h5>FPR：无碰撞帧被误报的比例</h5><p class="formula"><code>FPR = FP / (FP + TN)</code></p><p>回答“真实无碰撞的样本里，有多少被错误报成碰撞”。它和 Precision 关注的条件不同，二者都要保留。</p></article><article class="deep-card wide self"><h5>Fβ：在一个综合分数里明确偏向 Recall</h5><p class="formula"><code>Fβ = (1 + β²) × Precision × Recall / (β² × Precision + Recall)</code></p><p>当 <code>β &gt; 1</code> 时，Recall 的权重更大；本项目选 <code>β = 2</code>，所以 <code>F2 = 5PR / (4P + R)</code>。它不是凭空创造新信息，而是把“漏检比误报更不可接受”的安全偏好写进综合指标，同时仍然要配合 Precision、FPR 和原始混淆矩阵解读。</p></article></div><p class="project-boundary"><b>口述顺序：</b>先说混淆矩阵确定 TP/FP/FN/TN，再说 Recall 直接刻画碰撞找回，最后说 F2 用 β=2 给 Recall 更高权重。不要只说“用了 F2 所以更安全”，要把它和 FN 的业务代价连起来。</p>
<h3>3.7 为什么最后选 Recall 和 F2</h3>
<div class="project-sequence"><div><b>类别不均衡</b><span>真实碰撞少，TN 多，Accuracy 容易掩盖问题。</span></div><div><b>拆开 FN</b><span>先用混淆矩阵看真实碰撞是否被找回。</span></div><div><b>Recall 优先</b><span>直接衡量正样本召回，最贴近漏检风险。</span></div><div><b>F2 约束取舍</b><span>综合考虑 Precision，但显式偏向 Recall。</span></div></div><div class="project-grid"><article class="deep-card self"><h5>为什么不是只看 Recall</h5><p>只追 Recall 可能把所有异常都报成碰撞；模型在安全上更敏感，但人和业务会被大量误报淹没。Precision 和 FPR 用来约束这种“用虚警换召回”的方案，混淆矩阵则保留原始数量。</p></article><article class="deep-card self"><h5>为什么不是只看 F1</h5><p>F1 默认 Precision 与 Recall 同等重要，适合两类错误代价接近的任务。碰撞检测中 FN 的风险通常高于 FP，因此 β=2 把偏好显式编码；这并不意味着 FP 可以忽略。</p></article><article class="deep-card base"><h5>结果如何证明方向正确</h5><p>微调模型在同一泛化集上 Recall 从 0.185 提升到 0.812、FN 从 549 降到 127，同时 Precision 达到 0.958、FPR 约 0.003。召回和精度同时改善，说明不是简单降低阈值造成的“乱报”。</p></article></div>
<h3>3.8 三方评测与盲审：谁负责什么</h3>
<table class="project-table"><thead><tr><th>参与方</th><th>职责</th><th>边界</th></tr></thead><tbody><tr><th>被评碰撞模型</th><td>对连续视觉输入输出 collision_detected，以及必要的严重程度和证据字段。</td><td>它的预测是被评对象，不能自己证明自己正确。</td></tr><tr><th>人工 GT / 人工修正</th><td>为客观指标提供真值锚点；对模型与复核模型分歧的样本作最终定案。</td><td>人工修正 &gt; 人工 GT &gt; 判别结论，优先级必须记录在 truth_source。</td></tr><tr><th>专家 VLM</th><td>以 Qwen3-VL-30B-Thinking / Qwen3-VL-Plus 等可视模型独立查看连续证据帧，描述事实、提出正反证据、给出复核意见和错因归因。</td><td>不能替代 GT；它是解释和发现争议的第二层机制，避免循环论证。</td></tr></tbody></table><div class="project-board"><div class="board-horizontal"><div class="board-node"><b>观察员</b><span>只描述方向、距离、姿态、逐帧变化和可见性</span></div><div class="board-arrow right">→</div><div class="board-node"><b>正方 / 反方</b><span>分别举证“发生碰撞”与“未发生或证据不足”</span></div><div class="board-arrow right">→</div><div class="board-node"><b>判别角色</b><span>综合证词、原图和规则做终裁</span></div></div><div class="board-return up">首轮不展示 GT → 与 GT 分歧或结论存疑 → 人工亮真值、复核并回写</div></div>
<h3>3.9 碰撞证据链：变化 → 接触 → 结果</h3>
<div class="project-board"><div class="board-horizontal"><div class="board-node"><b>变化证据</b><span>姿态、运动或位置突变；踉跄、倒地、翻滚、拖拽</span></div><div class="board-arrow right">→</div><div class="board-node board-evidence"><b>接触证据</b><span>明确接触、推断接触、持续剐蹭、挂住或卷入</span></div><div class="board-arrow right">→</div><div class="board-node"><b>结果证据</b><span>倒地、翻滚后停止、拖拽停止等可观察后果</span></div></div><p class="board-support"><b>判定规则：</b>变化 + 接触 + 结果是完整证据链；变化 + 结果但接触不可见时，至少需要两个独立变化证据并标注推断；只有结果、没有变化时判为疑似并送人工复核；无变化且无结果则支持无碰撞。证据必须绑定具体帧号，不能用“看起来像”代替可见事实。</p></div>
<table class="project-table"><thead><tr><th>证据层</th><th>典型枚举</th><th>作用</th></tr></thead><tbody><tr><th>变化</th><td>DURING_SLIGHT_AIRBORNE、DURING_STAGGER、DURING_FALL、DURING_ROLL、DURING_DRAG</td><td>说明目标物出现了异常运动，是碰撞的必要征兆。</td></tr><tr><th>接触</th><td>CONTACT_CLEAR、CONTACT_INFERRED、RUBBING_SCRAPE、HOOK_ENTANGLE</td><td>说明目标物与车身存在空间接触或可解释的接触关系，区分碰撞和自行摔倒。</td></tr><tr><th>结果 / 可见性</th><td>倒地、翻滚停止、画面突变；OCCLUDED_PARTIAL、OUT_OF_VIEW、LOW_LIGHT_BLUR</td><td>既记录碰撞后果，也显式记录证据不足，避免强行下确定结论。</td></tr></tbody></table>
<h3>3.10 平台使用流程与实验生命周期</h3>
<div class="project-sequence"><div><b>数据准备</b><span>导入模型预测、5 帧证据图、GT 与实验元数据，解析版本并做差异摘要。</span></div><div><b>评测执行</b><span>选择模型、Prompt、专家模型和模式，异步执行并跟踪 pending → running。</span></div><div><b>对比看板</b><span>固定其他变量，对比 Accuracy、Precision、Recall、FPR、F2 与场景分布。</span></div><div><b>Bad Case 分析</b><span>按 FP/FN 和错误类型筛选，查看复核过程、证据和跨版本趋势。</span></div></div><div class="project-grid"><article class="deep-card self"><h5>草稿态、确认入库和即时重算</h5><p>评测结果先进入草稿态，避免未经复核的判别结果直接污染指标；人工确认后才进入 confirmed。人工修正 GT 后，truth_source 更新为 manual，category 和本次评测整体指标即时重算。</p></article><article class="deep-card base"><h5>失败与重跑边界</h5><p>专家 VLM 任一必需角色调用失败、限流或超时，样本应标为未完成 / 存疑并受控重试，不能用空结果当“无碰撞”。多角色模式每帧大约需要 4–5 次模型调用，因此要有并发收敛、限速和失败回退。</p></article></div>
<h3>3.11 Bad Case：从错误现象回到下一步动作</h3>
<table class="project-table"><thead><tr><th>主要失败模式</th><th>数量 / 占比</th><th>如何解释</th><th>回流方向</th></tr></thead><tbody><tr><th>漏判：未拍到接触</th><td>115 / 29.0%</td><td>碰撞瞬间切帧、模糊或摄像头受冲击，接触本身不可见，但前后帧有突变。</td><td>补充连续时序和异常画面样本；Prompt 要求引用前后帧变化。</td></tr><tr><th>漏判：边缘接触</th><td>109 / 27.5%</td><td>接触发生在视野边缘，目标只露出局部，模型把局部证据当成无碰撞。</td><td>建立边缘 Hard 集；要求模型区分“未看到”与“没有发生”。</td></tr><tr><th>漏判：车身与围栏紧贴</th><td>31 / 7.8%</td><td>鱼眼视角下镜头位置与车身实际边界不同，画面看似有距离但车身已接触。</td><td>按车身轮廓和鱼眼几何补数据，沉淀“车身边界优先”规则。</td></tr><tr><th>真值存疑</th><td>16 / 4.0%</td><td>证据与人工标注不一致，不能直接归为模型错。</td><td>人工复核并标记 gt_suspect，不污染客观指标。</td></tr><tr><th>误报：他车相撞</th><td>主要误报模式</td><td>画面里确有事故，但发生在其他车辆或目标物之间，并非本车碰撞。</td><td>强化“本车 vs 他车”的主体边界和接触对象判定。</td></tr></tbody></table><p class="project-boundary"><b>归因边界：</b>396 条 Bad Case 是已归因样本的分析集，不代表所有生产场景的绝对分布；attribution 是复核模型对原因的推断，最终是否属于模型错、GT 错或证据不足，需要人工确认。</p>

<table class="project-table"><thead><tr><th>模型</th><th>Accuracy</th><th>Precision</th><th>Recall</th><th>FPR</th><th>TP / FP / FN / TN</th></tr></thead><tbody><tr><th>Qwen3-VL-4B Zeroshot</th><td>0.929</td><td>0.839</td><td>0.185</td><td>0.003</td><td>125 / 24 / 549 / 7,323</td></tr><tr><th>Qwen3-VL-2B Zeroshot</th><td>0.936</td><td>0.697</td><td>0.427</td><td>—</td><td>288 / 125 / 386 / 7,222</td></tr><tr><th>微调模型（鱼眼泛化）</th><td>0.981</td><td>0.958</td><td><b>0.812</b></td><td>0.003</td><td>547 / 24 / <b>127</b> / 7,323</td></tr></tbody></table><div class="project-grid"><article class="deep-card self"><h5>结果应该怎么说</h5><p>微调模型把 Recall 从 4B Zeroshot 的 0.185 提升到 0.812，FN 从 549 降到 127，同时 Precision 达到 0.958、FPR 约 0.003。可以说召回与精度同时改善；不能只说“准确率从 0.929 提升到 0.981”，因为那不是本项目最核心的安全结论。</p></article><article class="deep-card base"><h5>数据口径要守住</h5><p>项目资料还存在 8,021 / 7,933 等不同数据集版本，以及 30B 复核子集的不同指标。现场以简历对应的 8,021 帧、674 个真实碰撞和 4B Zeroshot 对比为主，其他结果明确标注子集或实验版本。</p></article></div>
<h3>3.13 Prompt、回归集与版本可追溯</h3>
<div class="project-grid"><article class="deep-card self"><h5>从单次调用到固定回归</h5><p>早期单次 VLM 判别容易受 Prompt 严格程度影响，对行人、骑行者等弱碰撞信号可能漏检，同输入也可能输出漂移。后续把输出约束为严格 JSON，引入具体证据枚举、固定校验步骤和连续帧输入。</p></article><article class="deep-card self"><h5>Smoke / Core / Hard 三层集</h5><p>Smoke 用于快速检查格式和明显回归；Core 用于总体横向比较；Hard 专门覆盖边缘接触、鱼眼畸变、遮挡、未拍到接触等高风险难例。每次记录模型、Prompt、参数、数据版本和结果，避免“换一句 Prompt 刚好跑得好”却无法复现。</p></article><article class="deep-card base"><h5>规则与模型各自负责</h5><p>结构化输出、字段校验、版本记录、TP/FP/FN/TN 计算和人工回写可以由平台规则保证；视觉证据描述、错因归因和复杂争议解释交给 VLM，但最终指标和真值不能由 VLM 自己决定。</p></article><article class="deep-card base"><h5>当前边界</h5><p>提示词级成对比较与胜率锦标赛属于设计 / 待办方向，不主动说成已经完整上线；专家盲审只覆盖争议子集时，要说明抽样和限流，不能把子集一致率泛化为全量能力。</p></article></div>
<h3>3.14 高概率追问与标准回答</h3>
<table class="project-table"><thead><tr><th>追问</th><th>标准回答</th></tr></thead><tbody><tr><th>为什么不直接用 Accuracy？</th><td>因为碰撞是低频但高风险事件，TN 数量很多，Accuracy 会被无碰撞样本抬高。极端情况下全部预测无碰撞仍有约 91.6% Accuracy，但 Recall 是 0，真实碰撞全部漏掉。所以先落混淆矩阵，再以 Recall 和 β=2 的 F2 为核心，同时保留 Precision 和 FPR。</td></tr><tr><th>为什么选 β=2？</th><td>Fβ 的 β 大于 1 时更重视 Recall。我们把 β 设为 2，是把“漏掉一次真实碰撞的代价高于多报一次”的安全偏好写进综合指标；它不是忽略误报，Precision、FPR 和 FP 数量仍然要一起看。</td></tr><tr><th>为什么要用 VLM 评测 VLM，会不会循环论证？</th><td>如果让专家 VLM 直接替代 GT，确实会循环论证。我们的边界是人工 GT 负责客观指标，专家 VLM 只负责独立看连续帧、给证据和解释争议；首轮盲审不展示 GT，和 GT 分歧或存疑才进人工复核，人工结论拥有最高优先级。</td></tr><tr><th>盲审为什么必要？</th><td>如果复核模型先看到真值，它很容易顺着标签解释画面，得到的是对答案的复述而不是独立信号。盲审先产生 blind_verdict，再在分歧时亮出真值进行第二轮复核，既降低锚定效应，也方便判断是模型错、GT 错还是证据不足。</td></tr><tr><th>Recall 提升会不会只是阈值调低？</th><td>不能只看 Recall。我们在同一泛化集上同时看到 Precision 达到 0.958、FPR 约 0.003，FN 从 549 降到 127，因此这次提升不是单纯用大量 FP 换来的。最终还要检查 FP/FN 的场景分布和 Bad Case 类型。</td></tr><tr><th>鱼眼下车身和围栏紧贴为什么难？</th><td>相机是本车视角，镜头位置不等于车身实际边界；鱼眼畸变会让边缘物体看起来距离更远，画面清晰也不能证明没有接触。因此要结合车身轮廓、目标占用区域和连续帧变化判断，证据不足就送人工，而不是强行输出确定结论。</td></tr><tr><th>Bad Case 如何变成下一轮动作？</th><td>先用模型预测与 GT 不一致定义可计算的 FP/FN，再由复核模型提供帧级证据和错因，人工确认后按稳定模式归类。高频、可验证的模式进入 Hard 回归集、Prompt 证据要求或数据补充；真值有问题的样本标为 gt_suspect，不把一次个例直接写成通用规则。</td></tr><tr><th>你个人在项目中负责什么？</th><td>我按简历口径重点参与安全指标口径、争议帧复核和 Bad Case 分析：把模型预测与人工 GT 对齐，关注 Recall、Precision、FPR、F2，理解盲审与人工回流，并把已确认的失败模式整理成后续数据、Prompt 和回归集的改进方向。平台整体的数据池、前后端和调度能力属于团队协作成果，不会表述成我独立完成全部平台。</td></tr></tbody></table>
<h3>3.15 面试收束句与资料边界</h3><blockquote><p>这个项目我最关注的不是把一个指标做高，而是先把安全场景的真值和错误代价定义清楚，再让模型预测、专家复核和人工裁定各司其职。最后通过 Bad Case 分类把一次错误变成下一轮可复用的数据、Prompt 和回归资产。如果您感兴趣，我可以继续展开混淆矩阵和 F2 的指标取舍，或者讲一个鱼眼边缘接触的具体复核案例。</p></blockquote><p class="project-boundary"><b>资料依据：</b>简历中的 Robotaxi Collision-Detection VLM Evaluation &amp; Bad-Case Analysis；《VLM碰撞检测评测平台-项目报告》《VLM 碰撞检测评测平台 使用流程与badcase 分析》《碰撞检测大模型-Prompt 测试》《碰撞检测大模型证据链字段设计》《碰撞模型检测开发过程》。平台级数字和设计待办只在对应边界内使用。</p>
</div></section>

<p class="school-eyebrow">PROJECT 04 · MULTI-SOURCE KNOWLEDGE &amp; RAG</p>
<h2>4. 学校项目：低空经济多源异构文本智能问答与知识抽取系统</h2>
<p class="school-lead">把低空经济政策和低空运行安全资料放到同一个可追溯知识底座中，先按文档类型保留各自的结构和适用边界，再按问题检索证据；其中，政策多跳问答使用子问题引导的细粒度知识抽取（SG-FKE），把分散的政策事实组织成可以回看原文的回答依据。</p>
<div class="school-scope"><p><strong>项目名称与规模按简历：</strong>核心成员，2024/10—2026/03；280 份区域政策、126 份安全文档、55,135 条向量索引；政策问答研究构建了 680 条 LEMQA 多跳问答对。</p><p><strong>本章的讲解范围：</strong>完整系统按“多源资料治理 → 类型化结构抽取 → 统一检索 → 问题分支回答”的主线展开；SG-FKE 的机制和结果来自政策论文，异构文档接入和政策、安全知识的协同回答按简历中的系统设计说明。</p></div>

<h3>开场介绍 · 60 秒主线</h3>
<blockquote><p>我的学校项目是低空经济多源异构文本智能问答与知识抽取系统，围绕产业政策和运行安全两类知识。它的难点在于，不同文件的表达方式差异很大：政策讲目标、扶持条件和期限，法规讲主体义务和例外，标准还会包含参数表格和技术要求。如果直接按固定长度切分，再统一做向量检索，很容易把条件和结论拆开，或者混用不同版本的要求。</p><p>我的设计是先按文档类型还原结构，形成带版本、章节和来源定位的证据单元，再做统一检索。在政策多跳问答这一部分，我重点做的是 SG-FKE：把复杂问题重写为子问题，用子问题引导从候选原文中抽取细粒度三元组，再组织成结构化证据路径。研究在 Qwen-32B 上，相比 Naïve RAG，2Wiki 的 F1、EM 提升 9.6、15.9 个点，LEMQA 的 ROUGE、BERTScore F1 提升 4.7、4.4 个点。</p></blockquote>
<h3>展开介绍 · 90 秒到 2 分钟</h3>
<blockquote><p>这个项目最初研究的是低空经济政策的多跳问答，之后系统范围扩展到了政策与运行安全的多源异构资料。用户的问题可能同时包含地区、企业或运行主体、扶持条件、时间和安全要求，答案分散在不同条款和文件里。普通 RAG 即使召回了相关段落，也可能因为长文本噪声、条件遗漏或版本混用而回答错误。</p><p>我把完整链路分成两部分。第一部分是离线语料治理：先识别 PDF、Word、表格等载体，完成解析和必要的 OCR，再判断它是政策、法规、民航规章还是技术标准。每种类型采用不同的层级解析和抽取策略，例如政策保留支持对象、条件、措施和时间，法规保留条、款、项及义务和例外，标准保留条款号、参数、单位和表格上下文。这些内容统一映射成可检索、可定位、可按版本回溯的证据。</p><p>第二部分是在线问答：先明确问题的地区、时间、主体和文档范围，再检索适配的证据。对于政策多跳问题，我采用 SG-FKE，用子问题聚焦需要抽取的事实，再从召回文本中形成三元组。这里的子问题首先是抽取提示，不等于每个子问题都独立检索、独立回答。融合系统在这个研究方法上补齐来源、条件和原文核验，让答案既能组织跨条款关系，也能回到原始依据。</p><p>研究部分在 HotpotQA、2Wiki、MuSiQue 和自建 LEMQA 上验证。LEMQA 从 176 份权威政策中构建，人工审校后保留 680 条多跳问答。消融说明，子问题负责聚焦，三元组负责压缩和连接，两者互补。我的核心思路是：先把异构文档处理成可靠证据，再让模型围绕证据回答，而不是把所有文档一股脑塞进上下文。</p></blockquote>

<div class="school-unit" id="school-purpose">
<h3>4.1 为什么要做这个系统，真正困难在哪里？</h3>
<p>低空经济知识不是一种格式统一的百科资料。产业政策回答“谁能获得什么支持、什么时间适用”，运行安全资料回答“什么主体在什么场景下需要遵守什么要求”。这两类问题经常出现在同一个业务咨询中，却不能用同一套解释规则处理。比如，某地鼓励建设应用示范场景，并不等于企业已经获得开展某类飞行活动的许可；一份推荐性技术标准，也不能不加区分地解释为任何场景下都必须遵守的法定义务。</p>
<div class="school-grid">
<div class="school-card"><h4>经济政策：重点是适用条件与多跳连接</h4><p>问题通常跨越目标、措施、主体、期限和职责分工。例如询问某类企业能否申请支持，需要把适用主体、门槛条件、支持方式和有效期连接起来。单个关键词命中只是起点，还要验证这些条件能否同时成立。</p></div>
<div class="school-card"><h4>运行安全：重点是规范层级与适用范围</h4><p>问题可能涉及法规、CCAR 民航规章、规范性文件和技术标准。必须保留版本、条款层级、适用对象、情态词、例外、单位等信息。标题相近或语义相似，不意味着规定具有相同效力或适用于同一种运行活动。</p></div>
</div>
<p>因此，这个项目的技术问题可以分为四个层次：<strong>读对文档</strong>，避免 OCR 和表格错位；<strong>保留结构</strong>，避免条件与结论分离；<strong>找对证据</strong>，避免跨地区、跨版本误召回；<strong>组织关系</strong>，避免模型看见相关文本却无法完成跨条款回答。SG-FKE 主要解决最后一层的聚焦与结构化问题，不能替代前面三层。</p>
<h4>个人贡献如何围绕主线展开</h4>
<p>我的角色是项目核心成员，重点围绕 RAG 链路、结构化知识抽取以及 SG-FKE 的实验分析展开。在完整设计中，我把原来的政策问答方法放到多源异构文档系统内：明确每类资料的切分和字段抽取规则，建立统一证据对象，再决定什么问题使用政策子问题引导、什么问题需要直接回到法规或标准条款。团队论文、数据集和成果是协作产出，个人叙述重点放在自己负责的设计、实现环节及其取舍上。</p>
<h4>“多源”“异构”“多跳”是三个不同概念</h4>
<p><strong>多源</strong>指资料来自不同发布机构、地区、站点或采集渠道；<strong>异构</strong>既包含 PDF、Word、表格、HTML 等载体差异，也包含政策、法规、标准等语义结构差异；<strong>多跳</strong>指一个问题要连接两个或多个证据事实才能回答。多源文档不必然形成多跳问题，来自同一份政策的两个条款也可能构成多跳。</p>
</div>

<div class="school-unit" id="school-architecture">
<h3>4.2 完整白板图：语料生产与问题回答如何闭环？</h3>
<p>整体采用“一个权威语料底座、两条处理链路、多个应用入口”。离线链路把原始文件生产成可发布的证据；在线链路在确定的语料版本上检索、抽取和回答。发现错误时，反馈回到对应环节：OCR 错误修解析，版本错误修元数据，证据不足补检索，关系错误修抽取，不能都靠最后一层 Prompt 补救。</p>

<h4>统一底座与应用层怎样协作？</h4>
<p>原始文件、文档身份、版本、解析块、结构树、父子切块和向量索引围绕同一套证据模型组织。面向用户的检索、文档阅读、报告和问答都调用同一套证据服务，管理端负责导入、质量检查和版本发布；不同入口只改变展示方式，不重复维护一份可能不一致的知识。</p>
<p>网页需要可读的文档视图，RAG 需要带定位的证据结果，工具调用需要结构化返回，但它们都指向同一份文档版本和内容块。这样可以保证网页看到的来源、模型引用的来源和后续人工审校的来源保持一致。</p>
</div>

<div class="school-unit" id="school-routing">
<h3>4.3 第一层路由：文件怎么读，内容属于哪一种文档？</h3>
<p>这里需要分开两次判断。<strong>载体解析路由</strong>解决“怎样拿到正确文本和版面”，<strong>文档类型路由</strong>解决“这些文本按什么规则组织和解释”。扫描版技术标准和文本版技术标准的读取路径不同，但最终都需要保留标准条款和表格结构；同样是 PDF，政策与法规的结构规则仍然不同。</p>
<div class="school-table"><table><caption>载体处理：优先保留原始结构，失败才进入替代路径</caption><thead><tr><th>输入载体</th><th>处理方法</th><th>必须保留的信息与异常处理</th></tr></thead><tbody>
<tr><td>文本型 PDF</td><td>先使用原生文本层提取，结合标题、段落、页布局重建阅读顺序；按页判断文本质量。</td><td>页码、块顺序、坐标和原文件引用。存在文字不代表顺序正确，双栏、页眉和脚注需单独处理，不能直接按字符流拼接。</td></tr>
<tr><td>扫描 PDF / 图片</td><td>无有效文本或质量不足的页面再进入逐页 OCR，必要时切换解析后端。</td><td>保留图像与 OCR 结果的关联、解析器版本和质量标记；按内容哈希缓存结果。数字、单位和复杂表格不可靠时进入审校，不由模型猜测补齐。</td></tr>
<tr><td>DOC / DOCX</td><td>提取段落、标题层级、列表与表格，优先沿用文档本身的结构；老 DOC 按可用转换链处理。</td><td>段落顺序、标题路径、附件和表格位置。格式转换结果需要检查，不能把转换成功等同于正文完整。</td></tr>
<tr><td>XLSX 政策汇总表</td><td>识别一行是否代表一份政策，将正文列和标题、地区、链接等列映射为独立文档及元数据。</td><td>sheet、行号、字段名和原始单元格。缺少正文时标记“仅目录/元数据”，可据官方链接补取正文；不能把一行标题扩写成完整政策。</td></tr>
<tr><td>官方网页 / HTML</td><td>保留正文、标题、发布机构和附件关系，清理导航、推荐文章等页面噪声。</td><td>原始 URL、采集时间和正文快照；附件可能是权威正文，网页日期不一定等于文件生效日期。</td></tr>
</tbody></table></div>
<h4>分类不只是一列“文档类型”</h4>
<p>融合设计使用相互独立的分类轴：<code>carrier_format</code> 表示载体，<code>corpus_domain</code> 表示经济或安全知识域，<code>document_kind</code> 表示政策、法规、标准等文类，<code>source_collection</code> 表示来源集合。比如一份讨论安全管理的地方政策，领域可以归为安全相关，但文类仍是政策；不能看到“安全”两个字就按技术标准切分。</p>
<p>分类时先利用可验证线索，例如标准编号、CCAR 标识、发文字号、发布机关和章节形式，再用正文语义辅助判断。低置信度或线索冲突保留候选类型并进入审校，不直接套用最强规范约束。未知类型先采用保守的结构化段落处理，保留原文，待类型明确后再生成新的处理版本。</p>
</div>

<div class="school-unit" id="school-extraction">
<h3>4.4 每种文档具体抽什么，如何保留不同的语义？</h3>
<p>“每种类型一套结构化抽取策略”不只是给不同文件换一个 Prompt，而是同时约定<strong>层级识别、最小证据单元、字段模式、父子关系与校验规则</strong>。离线阶段抽取相对稳定的文档结构和字段，在线阶段才根据用户问题选择事实；这样既避免每次问答重新解析全文，也不需要预先穷举所有可能问题的三元组。</p>
<div class="school-table"><table><caption>文档类型 → 自然层级 → 抽取字段 → 关键边界</caption><thead><tr><th>类型</th><th>层级与切分</th><th>结构化抽取内容</th><th>最容易错的地方</th></tr></thead><tbody>
<tr><td><strong>产业政策 / 发展规划</strong></td><td>标题、章节、总体目标、重点任务、支持措施、责任分工、保障措施。优先保留完整措施；过长时沿自然段拆分，并继承父措施上下文。</td><td>地区、发布机构、适用主体、发展目标、支持方式、资格条件、金额或比例、时间窗、例外、责任单位；分别标记事实性规定、计划目标和倡导性描述。</td><td>发展目标不等于当前实绩；“支持探索”不等于无条件补贴；规划期限不等于文件失效日；不能把同章不同主体的措施拼成同一承诺。</td></tr>
<tr><td><strong>法律 / 法规</strong></td><td>编、章、节、条、款、项。条级节点提供完整上下文，款/项可作为检索子单元；不跨条号、跨版本硬切。</td><td>义务或权利主体、动作、对象、必须/可以/不得等情态、前提条件、例外、程序、责任及条文引用。</td><td>否定和例外会改变规则含义；子项要继承条首的适用前提；“可以”不能改写为“必须”；相关规定不能未经判断合并为同级效力。</td></tr>
<tr><td><strong>CCAR 民航规章</strong></td><td>部号、修订版本、章、具体条文编号及字母/数字子项；按同一版条文建立父子关系。</td><td>适用范围、定义、申请主体、资质、证件、审定或运行程序、运行要求、限制条件、引用条款和修订信息。</td><td>相同条号在不同修订版中可能有不同内容；简写“第几条”必须补回所属规章和版本；不能只凭标题推断全部运行活动都适用。</td></tr>
<tr><td><strong>技术标准</strong></td><td>标准编号、版本、章、条、子条、术语、要求、试验方法、判定准则、附录、图表和公式。</td><td>标准性质、适用对象、参数名、数值/区间、比较符、单位、测量或试验条件、方法、结果判定、规范性引用文件。</td><td>GB 与 GB/T 的属性需要区分；推荐性标准可能因合同或引用而产生具体约束，不能一概说“无约束”；阈值脱离单位、方法和条件没有完整含义。</td></tr>
<tr><td><strong>规范性文件 / 管理办法 / 通知</strong></td><td>按实际结构选择条文化、数字层级或“正文 + 附件”模式，避免只用一个标题正则处理所有文件。</td><td>发布主体、对象范围、管理要求、办理流程、材料清单、执行时间、附件关系、依据文件和责任部门。</td><td>标题叫“办法”不自动等于法规；正文可能只宣布附件生效，实质规则在附件；引用的旧文件需要进一步核对有效性。</td></tr>
<tr><td><strong>表格 / 公式 / 图注</strong></td><td>作为所属文档内的特殊结构处理。完整表格为父节点，行或可独立解释的小段为子节点；公式关联其符号定义与条件。</td><td>表名、列名、行头、单位、脚注、合并单元格继承值、公式表达式及变量定义、图号和关联说明。</td><td>不能把一行裸数字单独向量化；脚注中的例外必须跟随；OCR 识别错小数点、上下标或不等号时须回看原始页面。</td></tr>
</tbody></table></div>
<h4>字段抽取如何避免“看起来结构化，实际上已经编错了”？</h4>
<p>每个重要字段不只保存一个值，而是保存“字段名、候选值、来源证据、抽取方式、置信情况、审校状态”。例如“有效期”必须指出原文中的起止句子；如果只能读到“2024—2026 年发展目标”，就只能保存规划时间范围，不能把它直接写成法律意义上的失效日。模型输出的自评分也不能替代证据校验。</p>
<p>字段之间有冲突时保留多条断言及其来源，不采用“后写入覆盖前写入”。只有通过规则确认或人工核验的字段，才进入默认检索过滤和用户侧明确结论；其余可以以“待核实”显示在管理视图。关键是把“抽出来了”和“可以当作已确认事实”分开，并让每个结论都能回到原文证据。</p>
<h4>为什么不把所有文档统一抽成三元组？</h4>
<p>三元组适合表达“主体—关系—对象”，但不擅长无损承载嵌套条件、例外、参数表格、公式和多步程序。安全规范中的一句话，可能只有在特定运行条件下才成立；如果抽成“设备—需要—某配置”，条件会被丢掉。因此，底座的统一对象是<strong>带结构的证据</strong>，而不是强制统一为三元组。SG-FKE 作为政策问答分支按问题抽取局部关系，其他文档保留最适合自己的表示。</p>
</div>
<div class="school-unit" id="school-evidence">
<h3>4.5 文档、条款、Chunk、三元组是什么关系？</h3>
<p>最容易讲混的是“原始文件”“业务文档”“向量切块”和“抽取知识”。同一份政策可能同时有网页、PDF 和扫描件，文件是多个，但它们不一定是多个独立政策；同一法规的旧版和新版属于一个文档家族，却必须是不同版本；Chunk 是为了检索生成的视图，三元组是为了回答某个问题产生的中间表示。任何一层都不应该覆盖或替代原始证据。</p>
