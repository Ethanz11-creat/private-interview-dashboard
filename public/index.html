<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>求职面试准备</title><link rel="stylesheet" href="/styles.css"></head><body><header><h1>求职面试准备</h1><p class="muted">按轮次组织面试内容，按邀约记录本场准备</p></header><div class="layout"><aside><div class="side-title">固定面试模板</div><button class="nav active" data-view="business">业务面</button><button class="nav" data-view="supervisor">主管面</button><button class="nav" data-view="hr">HR 面</button><div class="side-title">面试邀约</div><button id="newInterview" class="action">＋ 新建面试邀约</button><div id="interviews"></div><div class="side-title">数据</div><button id="export" class="action">导出备份</button><label class="import">导入备份<input id="import" type="file" accept="application/json"></label></aside><main class="main" id="app"></main></div><div id="dialog" class="dialog" hidden><div class="dialog-box"><h2>新建面试邀约</h2><label>公司<input id="fCompany"></label><label>岗位<input id="fRole"></label><label>JD<textarea id="fJd"></textarea></label><label>面试官<input id="fInterviewer"></label><label>面试时间<input id="fTime" type="datetime-local"></label><label>便利贴<textarea id="fNote"></textarea></label><div class="dialog-actions"><button id="cancel">取消</button><button id="saveInvite">保存邀约</button></div></div></div><script src="/content.js"></script><script src="/app.js"></script></body></html>
