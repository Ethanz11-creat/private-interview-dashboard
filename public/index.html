<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>求职面试准备</title><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f2937;background:#fff}header{padding:24px 34px 18px;border-bottom:1px solid #e5e7eb}h1{margin:0;font-size:24px}header p{margin:4px 0 0;color:#6b7280}.layout{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 90px)}aside{border-right:1px solid #e5e7eb;padding:18px}.nav-title{font-weight:700;margin:14px 8px 6px;color:#374151}button,.nav{font:inherit;border:1px solid #d1d5db;background:#fff;border-radius:6px;padding:8px 11px;cursor:pointer}.nav{display:block;width:100%;text-align:left;margin:5px 0}.nav.active{background:#eef6ff;border-color:#93c5fd;color:#1d4ed8}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.main{padding:28px 38px;max-width:1100px}.hero{border-bottom:1px solid #e5e7eb;padding-bottom:20px}.hero h2{margin:0 0 8px;font-size:21px}.muted{color:#6b7280}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.card{border:1px solid #e5e7eb;border-radius:8px;padding:16px;background:#fff}.card h3{margin:0 0 6px;font-size:16px}.section{margin:24px 0}.section h3{font-size:17px;border-left:3px solid #2563eb;padding-left:10px}.tree{margin:0;padding-left:22px}.tree li{margin:8px 0}.tree details{margin:8px 0}.tree summary{cursor:pointer;font-weight:600}.note{background:#fffdf2;border:1px solid #eadf9a;padding:12px;border-radius:6px;white-space:pre-wrap}.links a{display:block;color:#2563eb;margin:6px 0}.modal{position:fixed;inset:0;background:#0005;display:none;align-items:center;justify-content:center}.modal.open{display:flex}.dialog{background:#fff;width:min(620px,92vw);padding:22px;border-radius:9px}.dialog label{display:block;margin:10px 0 4px}.dialog input,.dialog textarea,.dialog select{width:100%;padding:9px;border:1px solid #d1d5db;border-radius:5px;font:inherit}.dialog textarea{min-height:100px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}@media(max-width:760px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #e5e7eb}.grid{grid-template-columns:1fr}.main{padding:22px}}
</style></head><body><header><h1>求职面试准备</h1><p>按面试轮次组织固定话术、主项目追问和每场面试复盘</p></header><div class="layout"><aside><div class="nav-title">固定面试模板</div><button class="nav active" data-view="business">业务面</button><button class="nav" data-view="supervisor">主管面</button><button class="nav" data-view="hr">HR 面</button><div class="nav-title">面试邀约</div><div id="interviews"></div><button id="add" class="nav">＋ 新建面试邀约</button><div class="toolbar"><button id="export">导出备份</button><button id="importBtn">导入备份</button><input id="file" type="file" accept="application/json" hidden></div></aside><main class="main" id="app"></main></div><div class="modal" id="modal"><div class="dialog"><h2>新建面试邀约</h2><label>公司</label><input id="company" placeholder="例如：联想"><label>岗位</label><input id="role" placeholder="例如：AI 知识管理工程师"><label>面试轮次</label><select id="round"><option>业务面</option><option>主管面</option><option>HR 面</option></select><label>面试时间</label><input id="date" type="datetime-local"><label>JD、面试官与临时提醒</label><textarea id="memo"></textarea><div class="actions"><button id="cancel">取消</button><button id="save">保存</button></div></div></div><script>
const KEY='job-interview-dashboard-v1';let state=JSON.parse(localStorage.getItem(KEY)||'{"interviews":[]}');let current='business';
const views={business:{title:'业务面',goal:'证明你确实做过项目，理解技术机制，并能把方案和业务结果联系起来。',nodes:[['自我介绍','中文自我介绍；英文版本作为需要时的附加模块'],['主项目：业务信息查询 Agent','背景 → 我的职责 → 核心问题 → 方案 → 结果 → 反思','二面/业务信息查询Agent-项目追问导图.html'],['项目追问','状态管理、记忆系统、证据不足不回答、方案取舍与边界'],['其他项目','低空政策 RAG、模型评测、学校项目'],['开放问题','模糊需求拆解、跨团队推进、如果重新做会怎么设计'],['英文总结','按本场交流内容概括自己的表现（需要时展开）']]},supervisor:{title:'主管面',goal:'证明你能独立拆解模糊问题、做业务取舍、协同交付，并且有清晰的成长方向。',nodes:[['本轮主线','先讲项目价值，再讲关键判断；回答要体现业务意识和复盘能力'],['主项目深挖','为什么这样设计？哪些没有做？如果重新做，如何贴合业务？','二面/业务信息查询Agent-项目追问导图.html'],['最大挑战','未知业务与模糊需求：需求拆解 → 方案设计 → 对齐颗粒度 → 开发落地'],['低谷期','论文、秋招、实习并行；保持 Work-life balance，平稳度过压力阶段'],['不足与自我剖析','易感性思考、主动汇报与量化表达；从学生思维转向工作思维，提升决策果断度'],['未来规划','研发以业务为导向；积累 RAG、Agent、评测与可信 AI；深入全球服务场景'],['高含金量反问','全球化难点与业务优先级；最有价值的失败经验；晋升与海外机会；结合本次表现最需要提升什么']]},hr:{title:'HR 面',goal:'证明求职动机稳定，沟通可靠，了解自己的优势与不足，并与岗位长期发展匹配。',nodes:[['自我介绍','简洁说明教育背景、实习经历和求职方向'],['求职动机','为什么选择 AI 应用与知识管理，为什么关注这个岗位'],['优势','能把模糊业务需求拆成可验证的 AI 能力，并协同推进落地'],['不足','主动汇报、量化表达、决策果断度；说明已经采取的改进'],['困难与低谷','用事实说明压力来源、应对方式和最终结果'],['职业规划','前 2—3 年扎进具体业务域，成为能对业务结果负责的 AI 应用与解决方案型人才'],['反问','团队培养方式、岗位前三个月期待、后续反馈机制']]}};
function render(){document.querySelectorAll('.nav[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===current));let v=views[current];app.innerHTML=`<div class="hero"><h2>${v.title}</h2><p>${v.goal}</p><div class="toolbar"><button onclick="toggle(true)">展开全部话术</button><button onclick="toggle(false)">收起全部话术</button></div></div><div class="grid"><div class="card"><h3>使用方式</h3><p>先看节点标题和提示，按需展开完整内容。</p></div><div class="card"><h3>主项目</h3><p>业务信息查询 Agent 是当前高频深挖项目。</p></div><div class="card"><h3>本场资料</h3><p>收到邀约后，在左侧新建面试并贴入 JD。</p></div></div><div class="section"><h3>面试思维导图</h3><ul class="tree">${v.nodes.map((n,i)=>`<li><details><summary>${i+1}. ${n[0]}</summary><p>${n[1]}</p>${n[2]?`<div class="links"><a href="${n[2]}">打开主项目详细追问导图 →</a></div>`:''}</details></li>`).join('')}</ul></div>`}
function toggle(open){document.querySelectorAll('details').forEach(x=>x.open=open)}function save(){let x={company:company.value,role:role.value,round:round.value,date:date.value,memo:memo.value,id:Date.now()};if(!x.company||!x.role)return alert('请至少填写公司和岗位');state.interviews.push(x);persist();modal.classList.remove('open');renderInterviews()}function persist(){localStorage.setItem(KEY,JSON.stringify(state))}function renderInterviews(){interviews.innerHTML=state.interviews.map(x=>`<button class="nav" onclick="openInterview(${x.id})">${x.company}｜${x.role}<small class="muted"><br>${x.round}</small></button>`).join('')}function openInterview(id){let x=state.interviews.find(y=>y.id===id);current=x.round==='主管面'?'supervisor':x.round==='HR 面'?'hr':'business';render();document.querySelector('.hero').insertAdjacentHTML('afterend',`<div class="section note"><b>本场面试：${x.company}｜${x.role}</b><br>时间：${x.date||'待定'}<br>${x.memo||'暂无便利贴内容'}</div>`)}document.querySelectorAll('.nav[data-view]').forEach(x=>x.onclick=()=>{current=x.dataset.view;render()});add.onclick=()=>modal.classList.add('open');cancel.onclick=()=>modal.classList.remove('open');document.getElementById('save').onclick=save;document.getElementById('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='求职面试备份.json';a.click()};importBtn.onclick=()=>file.click();file.onchange=e=>{let r=new FileReader();r.onload=()=>{state=JSON.parse(r.result);persist();renderInterviews()};r.readAsText(e.target.files[0])};render();renderInterviews();
</script></body></html>
