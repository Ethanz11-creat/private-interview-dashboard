<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>求职面试思维导图</title><style>body{margin:0;background:#fff;color:#202124;font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:24px 34px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}header p{margin:3px 0;color:#6b7280}.buttons button{margin-left:8px;padding:7px 12px;border:1px solid #cbd5e1;background:#fff;border-radius:4px;cursor:pointer}main{display:grid;grid-template-columns:280px 1fr;max-width:1400px;margin:auto}.left{padding:24px;border-right:1px solid #e5e7eb;min-height:calc(100vh - 90px)}.right{padding:24px 38px}.branch{border-left:2px solid #dbeafe;padding-left:18px;margin:0 0 12px}.branch summary{cursor:pointer;font-weight:600;padding:8px}.branch summary::marker{color:#2563eb}.content{padding:10px 16px;background:#fafafa;border-left:1px solid #e5e7eb}.content p{white-space:pre-wrap}.nav{display:block;width:100%;text-align:left;padding:10px 12px;margin:5px 0;border:1px solid #d1d5db;background:#fff;border-radius:4px;cursor:pointer}.nav.active{background:#eff6ff;border-color:#93c5fd;color:#1d4ed8}.label{font-size:12px;color:#6b7280;margin:18px 0 6px}.note{background:#fffbea;border:1px solid #eadf9a;padding:12px;margin:12px 0;white-space:pre-wrap}.line{height:1px;background:#e5e7eb;margin:22px 0}a{color:#2563eb}.modal{position:fixed;inset:0;background:#0005;display:none;align-items:center;justify-content:center}.modal.open{display:flex}.dialog{background:#fff;width:560px;max-width:90%;padding:22px}.dialog label{display:block;margin:8px 0}.dialog input,.dialog textarea{width:100%;padding:8px;border:1px solid #cbd5e1}.dialog textarea{min-height:80px}</style></head><body><header><div><h1>求职面试思维导图</h1><p>按面试轮次熟悉固定话术，按邀约记录本场准备</p></div><div class="buttons"><button id="expand">展开全部</button><button id="collapse">收起全部</button></div></header><main><aside class="left"><div class="label">面试轮次</div><button class="nav active" data-view="business">业务面</button><button class="nav" data-view="supervisor">主管面</button><button class="nav" data-view="hr">HR 面</button><div class="label">面试邀约</div><button class="nav" id="newInterview">＋ 新建面试邀约</button><div id="interviews"></div></aside><section class="right" id="app"></section></main><div class="modal" id="modal"><div class="dialog"><h2>新建面试邀约</h2><label>公司<input id="company"></label><label>岗位<input id="role"></label><label>JD / 面试官 / 时间 / 便利贴<textarea id="memo"></textarea></label><div class="buttons"><button id="cancel">取消</button><button id="saveInvite">保存</button></div></div></div><script src="/content.js"></script><script>let view='business',state=JSON.parse(localStorage.getItem('job-map')||'{"invites":[]}');const app=document.querySelector('#app');function render(){let v=INTERVIEW_VIEWS[view];app.innerHTML='<div class="label">当前轮次</div><h2>'+v.title+'</h2><p>'+v.goal+'</p><div class="line"></div><div class="label">面试导图</div>'+v.nodes.map((n,i)=>'<details class="branch"><summary>'+ (i+1)+'. '+n[0]+'</summary><div class="content"><p>'+n[1]+'</p>'+(n[0].includes('主项目')?'<a href="/二面/业务信息查询Agent-项目追问导图.html" target="_blank">打开完整主项目追问导图 →</a>':'')+'</div></details>').join('')+'<div class="line"></div><details class="branch"><summary>本轮复盘</summary><div class="content"><textarea id="review" style="width:100%;min-height:140px" placeholder="实际问题、我的回答、面试官反馈、下次改进">'+(state.review?.[view]||'')+'</textarea><button id="saveReview">保存复盘</button></div></details>';document.querySelectorAll('.nav[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.querySelector('#saveReview').onclick=()=>{state.review=state.review||{};state.review[view]=review.value;localStorage.setItem('job-map',JSON.stringify(state))}}function list(){interviews.innerHTML=state.invites.map((x,i)=>'<button class="nav" data-i="'+i+'">'+x.company+'｜'+x.role+'</button>').join('')}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});expand.onclick=()=>document.querySelectorAll('details').forEach(x=>x.open=true);collapse.onclick=()=>document.querySelectorAll('details').forEach(x=>x.open=false);newInterview.onclick=()=>modal.classList.add('open');cancel.onclick=()=>modal.classList.remove('open');saveInvite.onclick=()=>{if(!company.value.trim()||!role.value.trim())return alert('请填写公司和岗位');state.invites.push({company:company.value.trim(),role:role.value.trim(),memo:memo.value});localStorage.setItem('job-map',JSON.stringify(state));modal.classList.remove('open');list()};render();list();</script></body></html>
