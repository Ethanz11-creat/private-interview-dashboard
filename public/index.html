    function prepareFundamentals(root){
      const panel=root.querySelector('.knowledge-panel');
      if(!panel)return;
      panel.querySelectorAll(':scope > .knowledge-body > details').forEach(group=>{
        const section=document.createElement('section');
        section.className='knowledge-group';
        const summary=group.querySelector(':scope > summary');
        const heading=document.createElement('h4');
        heading.innerHTML=summary?summary.innerHTML:'';
        const list=group.querySelector(':scope > .qa-list');
        section.append(heading,list);
        group.replaceWith(section);
      });
      panel.querySelectorAll('.qa').forEach(qa=>{
        const match=qa.querySelector('b')?.textContent.match(/^(\d+)\./);
        const number=match?Number(match[1]):0;
        const visual=fundamentalsVisual(number);
        if(!visual)return;
        qa.classList.add('visual-qa');
        const figure=document.createElement('div');
        figure.className='qa-visual';
        figure.innerHTML=visual;
        qa.append(figure);
      });
    }
    const tripartiteChecklist=`<section class="tripartite-checklist" aria-label="签三方前确认清单"><div class="tripartite-head"><h4>签三方前确认清单</h4><p>签三方或正式确认 Offer 前，逐项问清楚；没有明确口径就先不要签。</p></div><div class="tripartite-grid"><article class="tripartite-item"><h5>1. 五险一金</h5><p>签三方之前要说清楚五险一金的<strong>缴费基数和缴纳比例</strong>。</p></article><article class="tripartite-item"><h5>2. 毕业后的试岗期</h5><p>有没有毕业之后的试岗期？如果有试岗期，要问清楚按什么标准发工资。基本上，如果有试岗期就直接可以跑路了。毕业之后就直接签劳动合同，才是对学生的保护。</p></article><article class="tripartite-item"><h5>3. 试用期、转正标准与转正率</h5><p>明确试用期标准。三年合同的试用期不能超过 6 个月。还要问清楚转正标准和转正率；如果转正率都不清楚，就不要去。</p></article><article class="tripartite-item"><h5>4. 薪资结构与保护期</h5><p>问清楚薪资结构，以及<strong>薪资保护期是多久</strong>。</p></article><article class="tripartite-item"><h5>5. 上下班时间与加班</h5><p>问清楚上下班时间：是双周休还是单休？是大小周？加班有没有加班费，还是调休？法定节假日是否有带薪加班？</p></article><article class="tripartite-item"><h5>6. 当前团队规模</h5><p>明确当前团队的人数。如果是两三个人的小团队，不建议过去当牛做马。</p></article></div></section>`;
    const hrGeneralModule=`<section class="role-special" aria-label="HR 面通用表现与高频问题"><div class="role-special-head"><h4>HR 面通用表现与高频问题</h4><p>HR 面一般耗时 15—30 分钟，主要涉及个人情况、学习情况、成长经历和求职选择。</p></div><div class="role-special-body"><section class="role-group core"><h5>整体表现</h5><p class="high-score">积极、阳光、乐观、开朗、自信；表达不要太跳，也不要太死气，要保持踏实、稳定、有成长性。</p></section><section class="role-group"><h5>高频问题与应对口径（1—8）</h5><p><b>1. HR 问你实习离职原因</b><br>不要说“没转正”或“公司不好”，可以说岗位内容和自己的发展方向不太匹配。</p><p><b>2. HR 问你面过大厂吗，结果怎样</b><br>可以说有面过，技术面都通过了，目前在排序，还不知道最终结果。</p><p><b>3. 有大厂了还选择我们吗</b><br>认可对方公司和岗位，说明自己相信能在这里学到很多东西，并且看重团队、业务和成长空间。</p><p><b>4. 多段实习是否无缝衔接</b><br>不管实际怎么安排，都说明是先离职，再找到下一份工作。</p><p><b>5. 你有其他 Offer 吗</b><br>实话实说，不回避，也不主动比较和贬低任何一家公司。</p><p><b>6. 有其他 Offer 的情况下会怎么选择</b><br>不要简单说业务 Top B 还是 Top C；重点表达对当前公司的认可，说明会综合考虑岗位、团队、业务和成长空间。</p><p><b>7. 期望薪资是多少</b><br>根据对方薪资范围给出预期，通常可以比心理预期提高 1—2K；没有房补时可以再考虑增加 1K，并预留谈判空间。</p><p><b>8. 接受加班吗</b><br>先说明自己年轻、有拼劲、愿意承担工作；同时强调会提高效率、减少不必要的加班，保持长期稳定的工作状态。</p></section><section class="role-group"><h5>高频问题与应对口径（9—15）</h5><p><b>9. 最困难的问题是什么，如何应对</b><br>突出在关键阶段愿意为团队承担责任、付出额外努力，并说明自己如何解决问题和完成闭环。</p><p><b>10. 如何看待行业发展</b><br>先从行业整体趋势和长期空间展开，再落到目标岗位、具体业务和自己能贡献的方向。</p><p><b>11. 如果遇到杂活怎么办</b><br>组织安排的工作都有价值，没有绝对的“杂活”；只要能帮助理解业务、流程或团队，就能从中学习和积累。</p><p><b>12. 如果完善自己的项目，希望做好哪些部分</b><br>可以从性能、用户体验、安全性和隐私保护几个方面继续完善。</p><p><b>13. 与领导意见不一致时怎么办</b><br>不要急于否定领导意见，先理解对方的目标和依据，再私下一对一沟通，基于事实讨论方案。</p><p><b>14. 生活中追求什么、近期打算和择业因素</b><br>追求持续学习和成长，也希望帮助和启发他人，继续拓展知识与技能。择业会考虑成长机会、公司文化价值观、工作内容、影响力和团队氛围。</p><p><b>15. 工作条件和待遇差距较大怎么办</b><br>先询问公司是否有调整空间，明确自己最看重的条件；对不重要的方面保留妥协空间，并综合权衡薪酬、职业成长、工作环境和公司稳定性。</p></section></div></section>`;
    const hrGeneralFollowups=`<section class="role-group"><h5>补充 HR 面追问（16—22）</h5><p><b>16. 你在实习过程中最喜欢且 enjoy 的是什么？</b></p><p><b>17. 你在实习过程中最不喜欢的是什么？</b></p><p><b>18. 你对加班的看法。</b></p><p><b>19. 你的爱好。</b><br><span class="note">这一部分可能继续追问，需要提前准备一段可以详细介绍的真实爱好。</span></p><p><b>20. 你从实习或项目经历中学到了什么？有哪些成长？</b></p><p><b>21. 你还投了哪些类型的企业？为什么？</b></p><p><b>22. 你认为这些企业之间的不同点是什么？</b></p></section>`;
    const hrMergedQuestions=`<section class="role-group"><h5>合并后的交叉高频题</h5><p><b>实习经历与成长：</b>可以从实习经历浅问展开到实习与学习的差异、最喜欢和最不喜欢的部分，以及从实习或项目中学到的东西和个人成长。</p><p><b>行业与企业选择：</b>先谈行业发展，再说明投递的企业类型和原因；联想虽然不属于互联网公司，但仍可以从业务方向、技术场景、平台资源、公司文化和成长空间比较不同企业。</p><p><b>个人复盘与职业规划：</b>准备个人缺点、遇到的最大困难、低谷期、职业规划、对意向工作的期待，以及更偏研发还是业务；回答时强调技术积累和业务理解要同步增长。</p></section>`;
    const hrAdditionalQuestions=`<section class="role-group"><h5>补充 HR 面高频问题</h5><p><b>7.</b> 实习经历浅问。</p><p><b>8.</b> 实习工作和学习有什么不一样的点？</p><p><b>9.</b> 个人缺点。</p><p><b>10.</b> 相较于其他同学觉得自己的差异化优势什么。</p><p><b>11.</b> 对联想的认知，以及认知途径。</p><p><b>12.</b> 你刚才一直在说互联网行业，联想其实不算互联网行业，你怎么考虑的，以及找工作的时候会投递哪些企业。</p><p><b>14.</b> 会如何选 offer，薪酬、业务等的考虑。</p><p><b>15.</b> 一个有成就感的 case。</p><p><b>16.</b> 除了项目，还问了就是自己的一个职业规划，最好要说作为 xxx 不但要有技术上的积累，也要在工作当中去积累业务经验，逐步理解真正的业务理解产品。</p><p><b>17.</b> 问遇到的最大的困难，然后最大的低谷期是什么时候？还有我的不足在哪儿？还有职业规划是什么？对意向工作的期待？更想做偏研发类，还是说偏业务类。</p></section>`;
    const handwritingModule=`<section class="handwriting-index" aria-label="手撕题库"><div class="handwriting-index-head"><div><span class="handwriting-kicker">CODE WALKTHROUGHS / INTERVIEW DRILLS</span><h3>手撕题库 · 逐行理解与现场复现</h3><p>把题干、公式、代码、执行过程和盲写骨架放在同一套阅读路径里。点击卡片进入完整独立页面，页面内容和原始学习稿保持一致。</p></div><span class="handwriting-count">09 份学习稿</span></div><div class="handwriting-grid"><a class="handwriting-card" href="./handwriting/linear-regression.html"><span class="handwriting-card-no">01 / 基础算法</span><h4>线性回归</h4><p>最小二乘闭式解、公式推导、NumPy 与普通循环。</p><span class="handwriting-card-link">打开逐行手撕 →</span></a><a class="handwriting-card" href="./handwriting/knn.html"><span class="handwriting-card-no">02 / 基础算法</span><h4>KNN</h4><p>欧氏距离、广播、稳定排序、投票与 K 值边界。</p><span class="handwriting-card-link">打开逐行手撕 →</span></a><a class="handwriting-card" href="./handwriting/kmeans.html"><span class="handwriting-card-no">03 / 基础算法</span><h4>K-Means</h4><p>分配、聚类中心更新、收敛判断与张量形状。</p><span class="handwriting-card-link">打开逐行手撕 →</span></a><a class="handwriting-card" href="./handwriting/backprop.html"><span class="handwriting-card-no">04 / 深度学习</span><h4>反向传播</h4><p>两层全连接网络、链式法则、梯度和参数更新。</p><span class="handwriting-card-link">打开逐行手撕 →</span></a><a class="handwriting-card" href="./handwriting/softmax.html"><span class="handwriting-card-no">05 / 深度学习</span><h4>Softmax</h4><p>稳定形式、指数归一化、概率分布与数值边界。</p><span class="handwriting-card-link">打开逐行手撕 →</span></a><a class="handwriting-card" href="./handwriting/self-attention.html"><span class="handwriting-card-no">06 / Transformer</span><h4>Self-Attention</h4><p>Q、K、V、缩放点积、逐行 Softmax 与输出。</p><span class="handwriting-card-link">打开逐行手撕 →</span></a><a class="handwriting-card" href="./handwriting/multi-head-attention.html"><span class="handwriting-card-no">07 / Transformer</span><h4>Multi-Head Attention</h4><p>分头、批量矩阵乘法、拼接、输出投影与维度。</p><span class="handwriting-card-link">打开逐行手撕 →</span></a><a class="handwriting-card" href="./handwriting/training-resource-scheduling.html"><span class="handwriting-card-no">08 / 系统设计</span><h4>训练资源调度</h4><p>资源分配、队列、约束和训练任务调度思路。</p><span class="handwriting-card-link">打开逐行手撕 →</span></a><a class="handwriting-card" href="./handwriting/react.html"><span class="handwriting-card-no">09 / Agent</span><h4>ReAct</h4><p>Thought、Action、Observation 循环与最小执行器。</p><span class="handwriting-card-link">打开逐行手撕 →</span></a></div><div class="handwriting-index-note"><strong>公式阅读：</strong>线性回归、Softmax、Self-Attention 和 Multi-Head Attention 中的公式会在独立页面中使用 MathJax 进行排版；如果网络暂时不可用，页面保留原有的公式结构作为降级显示。</div></section>`;
    const englishInterviewModule=`<section class="role-special english-interview-module" aria-label="英文 HR 面现场话术"><div class="role-special-head"><h4>英文 HR 面现场话术</h4><p>放在 Offer / 薪资确认清单右侧。现场按顺序使用，不需要把所有问题一次问完；英文以自然、清楚和有分寸为主。</p></div><div class="role-special-body"><section class="role-group core"><h5>1. 开场打招呼</h5><p><b>English:</b> Hi, it’s nice to meet you. Thanks for taking the time to speak with me today. Can you hear me okay?</p><p><b>中文：</b>您好，很高兴见到您。谢谢您今天抽时间和我交流。您这边能听清楚吗？</p><p class="note"><b>线下面试：</b>去掉最后一句即可。</p></section><section class="role-group core"><h5>2. 自我介绍（约 60 秒）</h5><p><b>English:</b> Sure. I’m Yiheng Zhao, a master’s student in Electronic Information at Xiamen University, and I’m expected to graduate in 2027.</p><p class="answer-en">Rather than repeat every project on my resume, I would describe my main focus as making AI systems useful and reliable in real workflows. During my internship at Didi, I worked on an internal business information Agent. My main contribution was improving how it handles multi-step queries, keeps task state, checks supporting evidence, and responds safely when the information is incomplete.</p><p class="answer-en">I also worked on RAG and knowledge extraction for policy and safety information. That experience taught me how to connect retrieval quality with clear and traceable answers.</p><p class="answer-en">Across these projects, I learned that good AI work is not only about model capability. It also requires understanding the business problem, working with different people, and making practical trade-offs. That is the kind of work I hope to continue in this role.</p><p><b>中文：</b>您好，我叫赵一恒，目前在厦门大学电子信息专业读硕士，预计 2027 年毕业。如果不逐条重复简历，我会把自己的主要方向概括为：让 AI 系统在真实业务流程中真正有用，并且足够可靠。我在滴滴参与了内部业务信息查询 Agent，主要改进多轮查询、任务状态记录、证据校验以及信息不完整时的安全处理。此外，我还做过政策和安全信息相关的 RAG 与知识抽取项目。这些经历让我认识到，好的 AI 工作不只是模型能力强，还需要理解业务问题、和不同角色协作，并做出符合实际的技术取舍。</p></section><section class="role-group"><h5>3. HRBP 反问（现场选 2—3 个）</h5><div class="question"><b>岗位成功标准</b><p><b>English:</b> If I joined the team, what would success look like in the first three to six months?</p><p><b>中文：</b>如果我有机会加入，前 3—6 个月做到什么程度，算是进入了比较好的状态？</p></div><div class="question"><b>团队协作方式</b><p><b>English:</b> How does this role usually work with business, product, and engineering teams?</p><p><b>中文：</b>这个岗位通常会怎样和业务、产品以及研发团队协作？</p></div><div class="question"><b>全球化难点</b><p><b>English:</b> For a global team, what are the biggest challenges in cross-region collaboration?</p><p><b>中文：</b>对于全球化团队来说，跨地区协作目前最大的挑战是什么？</p></div><div class="question"><b>成长和晋升</b><p><b>English:</b> How are performance and career growth usually evaluated for this role? Are there opportunities to work on global projects over time?</p><p><b>中文：</b>这个岗位通常如何评估绩效和成长？后续是否有机会参与全球项目或跨区域业务？</p></div><div class="question"><b>薪资结构</b><p><b>English:</b> Could you help me understand the compensation structure, including base salary, performance pay, annual bonus, and benefits?</p><p><b>中文：</b>方便了解一下薪资结构吗？包括 Base、绩效、年终奖和福利分别是怎样安排的？</p></div><div class="question"><b>下一步流程</b><p><b>English:</b> Could you share the next steps and the expected timeline? Will I hear back by phone, email, or through the recruiting system?</p><p><b>中文：</b>方便介绍一下后续流程和大致时间吗？结果通常会通过电话、邮件，还是招聘系统通知？</p></div><p class="note"><b>推荐顺序：</b>先问岗位成功标准，再问全球化或成长；如果进入谈薪阶段，问薪资结构；结束前问后续流程。</p></section><section class="role-group"><h5>4. 薪资结构与五险一金追问</h5><div class="question"><b>第一层：整体结构</b><p><b>English:</b> Could you walk me through the compensation structure for this role, including the monthly base salary, performance pay, annual bonus, and other benefits?</p><p><b>中文：</b>可以介绍一下这个岗位的整体薪资结构吗？包括月度 Base、绩效、年终奖和其他福利。</p></div><div class="question"><b>第二层：绩效和年终</b><p><b>English:</b> How is the performance pay calculated, and is the annual bonus separate from the monthly compensation?</p><p><b>中文：</b>绩效工资通常如何计算？年终奖是独立于月度收入之外的吗？</p></div><div class="question"><b>第三层：五险一金</b><p><b>English:</b> Could you also clarify how social insurance and the housing fund are calculated? What are the contribution base and the company and employee rates?</p><p><b>中文：</b>也想确认一下五险一金的缴纳方式：缴费基数是多少，公司和个人分别承担什么比例？</p></div><div class="question"><b>第四层：其他福利</b><p><b>English:</b> Are there any other benefits I should know about, such as housing, meals, transportation, or relocation support?</p><p><b>中文：</b>还有其他需要了解的福利吗？比如住房、餐饮、交通或搬迁支持。</p></div><p class="note"><b>使用方式：</b>先问第一层和第三层；对方回答比较开放时，再继续追问绩效、年终和其他福利。</p></section><section class="role-group core"><h5>5. 结束语</h5><p><b>English:</b> Thank you for explaining everything and for taking the time to speak with me today. I really enjoyed learning more about the role and the team. The position sounds like a strong fit with my background and what I would like to do next. I look forward to hearing from you. Have a great day.</p><p><b>中文：</b>谢谢您今天的介绍，也感谢您抽时间和我交流。今天的沟通让我对这个岗位和团队有了更清晰的了解，我觉得这个岗位和我的经历以及下一步发展方向都比较匹配。期待后续的消息，祝您今天愉快。</p></section></div></section>`;
    const hrBilingualQuestions=`<section class="hr-bilingual" aria-label="HR 面中英文问答"><div class="role-special-head"><h4>HR 面通用表现与高频问题</h4><p>HR 面通常 15—30 分钟，重点看动机稳定性、表达方式、成长性、岗位匹配和长期选择。以下答案均按已确认的个人事实整理，英文保持口语化。</p></div><div class="role-group core"><h5>整体表现</h5><p class="high-score">积极、阳光、乐观、开朗、自信，但表达要踏实、稳定，不夸张也不消沉。回答时围绕真实经历、具体行动和后续成长展开。</p><p class="answer-en"><b>English:</b> Be positive, confident, and open, while staying practical and grounded. Keep your answers based on real experiences, clear actions, and what you learned from them.</p></div><div class="role-group"><h5>通用高频题</h5><div class="question qa-bilingual"><b>1. 为什么离开上一段实习？</b><p class="answer-cn">这段实习是按计划结束的，后续需要返校推进毕业论文和学校项目，同时准备秋招。并不是因为对团队或工作不满意，而是希望在毕业阶段重新寻找和长期方向更匹配的机会。</p><p class="answer-en"><b>English:</b> The internship ended as planned. I needed to return to school to work on my thesis and academic projects, while also preparing for full-time recruitment. It was not because I was unhappy with the team. I wanted to look for a role that is a better fit for my long-term direction.</p></div><div class="question qa-bilingual"><b>2. 你面过哪些大厂，结果怎么样？</b><p class="answer-cn">我主要面过阿里巴巴、字节跳动、蔚来和长鑫存储。阿里和字节属于互联网平台型公司，蔚来是新能源智能汽车，长鑫是半导体企业。目前这些机会都在等待结果或处于不同的后续阶段，其中蔚来已经完成一面。</p><p class="answer-en"><b>English:</b> I have interviewed with Alibaba, ByteDance, NIO, and CXMT. Alibaba and ByteDance are internet platform companies, NIO is in smart electric vehicles, and CXMT is in semiconductors. The processes are at different stages and I am still waiting for the results. For NIO, I have completed the first round.</p></div><div class="question qa-bilingual"><b>3. 有其他大厂机会，为什么还会选择我们？</b><p class="answer-cn">我不会只看公司的行业标签或名气，更看重岗位内容、业务方向、团队和长期成长。贵司的岗位能够让我把 RAG、Agent 和 AI 应用经验放到真实业务里，同时积累更完整的业务理解和协作经验，这是我很看重的。</p><p class="answer-en"><b>English:</b> I do not choose a company only by its industry label or reputation. I care more about the role, the business, the team, and long-term growth. This role gives me a chance to apply my experience in RAG, Agents, and AI applications to real business problems, which is very important to me.</p></div><div class="question qa-bilingual"><b>4. 简历上的几段经历是不是无缝衔接？</b><p class="answer-cn">每段经历之间都是先完成离职或实习安排，再寻找下一段机会，并不是同时在多家公司任职。我会按照学校安排、项目节奏和求职计划来安排时间。</p><p class="answer-en"><b>English:</b> There was a clear transition between each experience. I finished one internship or work arrangement before starting the next one. I planned the timing around my school schedule, project milestones, and recruitment process.</p></div><div class="question qa-bilingual"><b>5. 你还有其他 Offer 吗？</b><p class="answer-cn">目前我已经收到一份 Offer，同时也有几家公司还在面试流程中。不过从岗位匹配度、业务方向和长期发展来看，我会更倾向于贵司。</p><p class="answer-en"><b>English:</b> I have received one offer, and I am still in the interview process with a few other companies. However, considering the role fit, business direction, and long-term development, I would be more interested in your company.</p></div><div class="question qa-bilingual"><b>6. 你会如何选择 Offer？</b><p class="answer-cn">我会综合看岗位内容、业务方向、团队和长期成长空间，再看薪酬福利和城市。第一优先级是岗位能否让我持续积累技术和业务能力；如果几个机会整体接近，我会再比较薪资、团队氛围、发展路径和地点。天津对我有一定吸引力，但不会只因为城市做决定。</p><p class="answer-en"><b>English:</b> I would first compare the role, business direction, team, and long-term growth, and then look at compensation and location. My first priority is whether the role helps me build both technical and business skills. Tianjin is attractive to me, but I would not make the decision based on location alone.</p></div><div class="question qa-bilingual"><b>7. 期望薪资是多少？</b><p class="answer-cn">我想先了解一下薪酬结构，包括 Base、绩效、年终奖和其他福利。结合我的经历、岗位要求和市场情况，我目前期望的税前月度 Base 大概在 20K 到 22K 之间，具体也会结合整体 package 综合评估。</p><p class="answer-en"><b>English:</b> I would first like to understand the compensation structure, including the base salary, performance pay, bonus, and other benefits. Based on my experience, the role requirements, and the market, my expected monthly pre-tax base salary is around 20K to 22K RMB. I would also consider the overall package.</p></div><div class="question qa-bilingual"><b>8. 你怎么看加班？</b><p class="answer-cn">我接受项目节点、紧急问题或关键阶段的阶段性加班，也愿意在团队需要时多投入。但我不把加班本身当作目标，会通过提前规划、明确优先级和提高效率，减少不必要的加班，让工作保持长期稳定。</p><p class="answer-en"><b>English:</b> I am willing to work extra hours during important project milestones or urgent situations, especially when the team needs support. However, overtime itself is not the goal. I prefer to plan ahead, set priorities, and improve efficiency so that unnecessary overtime can be reduced over the long term.</p></div><div class="question qa-bilingual"><b>9. 你遇到过最大的困难是什么？</b><p class="answer-cn">最大的挑战是在滴滴实习期间面对陌生业务和比较模糊的需求，需要从需求拆解开始，形成设计方案，再推进开发落地。中途方案出现过偏差，我通过和需求方深入讨论、与组长持续对齐颗粒度，逐步纠正并顺利落地。这让我认识到，面对未知业务时，先理解场景、持续校准方案比急于实现更重要。</p><p class="answer-en"><b>English:</b> My biggest challenge was working on an unfamiliar business with unclear requirements during my internship at Didi. I had to break down the needs, design a solution, and then move it into development. When the initial design was not fully aligned, I discussed it with the requester and my team lead, adjusted the level of detail, and delivered the solution. I learned that understanding the context and continuously checking alignment is more important than rushing into implementation.</p></div><div class="question qa-bilingual"><b>10. 你怎么看 AI 行业的发展？</b><p class="answer-cn">我觉得 AI 会从单点能力展示，逐步走向和真实业务深度结合。未来关键不只是模型能不能完成某个任务，而是能不能稳定嵌入业务流程并持续产生价值。我更关注 AI 应用、Agent、RAG 和知识管理，希望先在一个具体业务域扎实积累，再形成跨场景的解决方案能力。</p><p class="answer-en"><b>English:</b> I think AI is moving from showing isolated model capabilities to being deeply integrated into real business processes. The key is not only whether a model can finish a task, but whether it can work reliably and create continuous value. I am interested in AI applications, Agents, RAG, and knowledge management, and I hope to build solid experience in one business area first.</p></div><div class="question qa-bilingual"><b>11. 如果遇到看起来比较琐碎的工作怎么办？</b><p class="answer-cn">我不会简单把工作分成有价值和没价值。只要是团队目标需要、能够帮助我理解业务或推进项目的事情，我都会认真完成。对于重复性工作，我会先保证质量，再尝试用模板、脚本或流程优化减少重复，并确认好优先级和交付标准。</p><p class="answer-en"><b>English:</b> I would not simply divide tasks into valuable and unvaluable work. If a task supports the team goal or helps me understand the business, I will take it seriously. For repetitive work, I first ensure quality and then look for improvements through templates, scripts, or better processes.</p></div><div class="question qa-bilingual"><b>12. 如果和领导意见不一致怎么办？</b><p class="answer-cn">我不会在公开场合直接否定，而是先确认双方对目标和约束的理解是否一致，再私下一对一沟通，用事实、风险和备选方案说明自己的判断，也理解领导更关注的目标。如果最终结论不同，我会先执行并反馈结果，重点是把事情推进好。</p><p class="answer-en"><b>English:</b> I would not reject the idea directly in public. First, I would make sure we share the same understanding of the goal and constraints. Then I would discuss it privately with facts, risks, and alternatives, while understanding my manager’s priorities. If the final decision is different from my suggestion, I will execute it well and share feedback. The goal is to move the work forward.</p></div><div class="question qa-bilingual"><b>13. 你生活中追求什么，近期有什么计划？</b><p class="answer-cn">我比较看重持续学习、稳定成长，以及把能力转化为实际价值。近期计划是完成毕业论文和学校项目，顺利毕业，并找到一个能够长期积累的 AI 应用研发或解决方案岗位。选择工作时，我会综合考虑岗位内容、技术和业务发展空间、团队氛围、公司文化和长期成长机会。</p><p class="answer-en"><b>English:</b> I value continuous learning, steady growth, and creating real value with my skills. In the near term, I plan to finish my thesis and school projects, graduate smoothly, and find a role in AI applications or solution development. I look at the work itself, growth opportunities, team culture, and the long-term path.</p></div><div class="question qa-bilingual"><b>14. 实习工作和学习有什么不一样？</b><p class="answer-cn">学习更强调知识掌握和任务完成，而工作更强调在约束条件下把事情真正落地。学习中的问题边界通常比较清晰，工作中则经常面对模糊需求、时间限制和不同角色的意见。实习之后，我更习惯先理解业务目标，再拆解问题、同步风险、推动协作，并对最终结果负责。</p><p class="answer-en"><b>English:</b> School focuses more on learning knowledge and finishing tasks, while work focuses on delivering real results under constraints. At work, requirements can be unclear, timelines are limited, and people may have different views. I learned to understand the business goal first, break down the problem, communicate risks, coordinate with others, and take responsibility for the result.</p></div><div class="question qa-bilingual"><b>15. 你在实习中最喜欢什么？</b><p class="answer-cn">我最享受的是把一个模糊问题逐步拆解成清晰方案，并最终看到它落地。在业务信息查询 Agent 项目中，我参与了业务理解、查询链路、记忆和证据校验设计，也和需求方、组长持续对齐。相比只完成一个功能，我更喜欢参与从问题理解到开发交付的完整过程。</p><p class="answer-en"><b>English:</b> What I enjoy most is turning a vague problem into a clear solution and seeing it work in practice. In the business information query Agent project, I worked on the business understanding, query flow, memory, and evidence checks, while aligning with the requester and my team lead. I enjoy being involved in the full process from understanding the problem to delivery.</p></div><div class="question qa-bilingual"><b>16. 你在实习中最不喜欢什么？</b><p class="answer-cn">相对来说，我不太喜欢长时间重复性高、反馈少的工作。不过只要项目需要，我仍会认真完成并保证质量，也会尝试通过模板、脚本或流程优化减少重复劳动，把它当成理解业务细节和发现流程问题的机会。</p><p class="answer-en"><b>English:</b> I am not a big fan of work that is highly repetitive and provides little feedback for a long time. However, I will still complete it carefully when the project needs it. I try to reduce repetition through templates, scripts, or process improvements, and use the work to understand business details.</p></div><div class="question qa-bilingual"><b>17. 你的爱好是什么？</b><p class="answer-cn">我主要去健身房，一周大约六练，胸、肩、背循环，也会安排休息。过去一年我减重了大约 8kg，同时保持了训练重量。健身对我来说不仅是兴趣，也帮助我在论文、秋招和实习并行时保持规律生活和稳定状态。</p><p class="answer-en"><b>English:</b> I mainly go to the gym, usually around six times a week. I train chest, shoulders, and back in rotation, with rest days in between. Over the past year, I lost about eight kilograms while keeping my training weight. It helps me stay disciplined and balanced when school, recruitment, and internship work happen at the same time.</p></div><div class="question qa-bilingual"><b>18. 你从实习和项目中学到了什么？</b><p class="answer-cn">我最大的成长是认识到技术方案不能脱离业务目标。一个技术上优秀的项目，不一定是当前业务最适合的方案。现在我会先理解场景、目标、约束和验收标准，再选择技术路线，同时提升需求拆解、沟通协作、预期管理和持续迭代能力。</p><p class="answer-en"><b>English:</b> My biggest lesson is that a technical solution cannot be separated from the business goal. A technically strong project is not always the best fit for the current business. I now clarify the scenario, goal, constraints, and acceptance criteria first, then choose the technical approach. I also improved my requirement analysis, communication, expectation management, and iteration skills.</p></div><div class="question qa-bilingual"><b>19. 你还投了哪些类型的企业？为什么？</b><p class="answer-cn">我主要关注 AI 应用研发、Agent、RAG 和智能化解决方案岗位。企业类型可以包括互联网平台、智能汽车、半导体、硬件和企业服务。它们的行业不同，但共同点是都希望把 AI 技术和真实业务结合，解决具体问题并推动落地。</p><p class="answer-en"><b>English:</b> I mainly apply for roles in AI applications, Agents, RAG, and intelligent solutions. The companies can be in internet platforms, smart vehicles, semiconductors, hardware, or enterprise services. Their industries are different, but they all need to connect AI technology with real business problems and deliver practical results.</p></div><div class="question qa-bilingual"><b>20. 这些企业之间有什么不同？</b><p class="answer-cn">它们的业务场景、用户对象、技术落地周期和交付方式不同，对岗位能力的要求也不同。互联网平台更强调快速迭代和规模化，智能汽车更关注软硬件协同，半导体和硬件更重视稳定性与产业链协作，企业服务更强调流程、权限和长期交付。但共同基础都是技术理解、业务协作和落地能力。</p><p class="answer-en"><b>English:</b> They differ in business scenarios, users, delivery cycles, and the skills required. Internet platforms often emphasize fast iteration and scale. Smart vehicles require software and hardware collaboration. Semiconductors and hardware focus more on stability and industry coordination, while enterprise services care about processes, permissions, and long-term delivery. The common foundation is still technical understanding, business collaboration, and execution.</p></div><div class="question qa-bilingual"><b>21. 你相较于其他同学的差异化优势是什么？</b><p class="answer-cn">我的优势不只是接触过 RAG、Agent 或评测，而是能把技术能力和业务落地结合起来。面对陌生领域，我会先建立业务认知，再把模糊问题拆成流程、模块、验收标准和具体任务，并推动方案落地。我也参与过开发、测试、Bad Case 分析、文档整理和 AI Coding SOP 沉淀。</p><p class="answer-en"><b>English:</b> My difference is not only my experience with RAG, Agents, and evaluation. More importantly, I can connect technical work with real business needs. I build business understanding first, break vague problems into workflows, modules, acceptance criteria, and tasks, and then help deliver the solution. I have also worked on development, testing, bad-case analysis, documentation, and an AI Coding SOP.</p></div><div class="question qa-bilingual"><b>22. 你的个人缺点是什么？</b><p class="answer-cn">面对不确定问题时，早期我容易先从主观感受出发，决策时也会反复权衡。实习中我刻意用事实、进度、量化信息、风险和下一步进行表达，也在从学生思维转向工作思维：不只判断项目本身好不好，而是看它是否符合业务目标、约束和交付要求，再及时做决定。</p><p class="answer-en"><b>English:</b> One area I am still improving is that I sometimes start from my personal perspective when I face uncertainty, and I may spend too long weighing options. During my internship, I trained myself to communicate with facts, progress, risks, and next steps. I am also learning to judge a project by its fit with business goals and delivery needs, not only by its technical quality.</p></div><div class="question qa-bilingual"><b>23. 讲一个有成就感的 Case。</b><p class="answer-cn">我比较有成就感的是参与滴滴内部业务信息查询 Agent 的改造。刚开始需求模糊，查询链路存在不稳定、多轮调用丢进度、证据不足直接回答等问题。我把场景拆成查询任务、工具调用、状态记录和结果校验，再和需求方、组长对齐方案，最后负责核心链路和记忆系统开发。这个过程让我完成了从问题理解到可验证方案落地的闭环。</p><p class="answer-en"><b>English:</b> One project I am proud of was improving an internal business information query Agent at Didi. The requirements were unclear, and the system could lose progress in multi-step calls or answer without enough evidence. I broke it into task planning, tool calls, state tracking, and result validation, aligned the solution with the requester and my team lead, and implemented the key flow and memory system. It gave me the experience of taking a problem from understanding to delivery.</p></div><div class="question qa-bilingual"><b>24. 你的职业规划和对意向工作的期待是什么？</b><p class="answer-cn">我希望成为懂技术、也能对业务结果负责的 AI 应用与解决方案型人才。技术上持续积累 RAG、Agent、评测和可信 AI；业务上深入具体服务场景，打通需求拆解、协同交付和持续迭代。前 2—3 年先扎进一个业务域，在实践中沉淀方法论和知识资产。我既希望保持研发深度，也愿意承担更多业务理解和方案协同工作。</p><p class="answer-en"><b>English:</b> I want to become an AI application and solution professional who understands technology and can also take responsibility for business results. I plan to keep building skills in RAG, Agents, evaluation, and trustworthy AI, while learning a real business domain deeply. In the first two or three years, I hope to grow through hands-on delivery and build my own methods and knowledge assets. I want to keep technical depth while taking more responsibility for business understanding and solution coordination.</p></div><div class="question qa-bilingual"><b>25. 工作中最擅长和最不擅长的是什么？</b><p class="answer-cn">我擅长面对陌生业务主动学习，把复杂问题拆成流程、模块、状态和验收标准，并在压力下保持稳定、推动方案落地。我不擅长的是早期容易受主观感受影响，决策时反复权衡，工作汇报和向上管理还不够主动；现在会用量化信息、风险和下一步进行汇报，并基于业务目标及时做决定。</p><p class="answer-en"><b>English:</b> I am good at learning unfamiliar business areas, breaking complex problems into clear workflows and acceptance criteria, and staying steady under pressure. What I am still improving is being less influenced by personal feelings, making decisions faster, and communicating upward more proactively. I now use facts, numbers, risks, and next steps in my updates, and make decisions based on business goals.</p></div></div></section><section class="role-special" aria-label="岗位专项：联想 HRBP 面"><div class="role-special-head"><h4>岗位专项：联想 HRBP 面</h4><p>三面 HRBP 面通常是 1v1：面试官介绍 → 自我介绍 → 面试官提问 → 最后反问。以下回答以一面真实了解到的团队信息为基础。</p></div><div class="role-special-body"><div class="question qa-bilingual"><b>1. 为什么选择这个岗位？</b><p class="answer-cn">我选择这个岗位，主要是因为它同时连接 AI 技术和全球服务业务。我的经历集中在 RAG、Agent、评测和 AI 应用落地，而岗位需要参与知识整理、需求理解、方案设计、研发协同和上线后的迭代，这和我过去的能力比较匹配。我也希望在全球化团队中继续补足业务理解和跨地区协作经验。</p><p class="answer-en"><b>English:</b> I am interested in this role because it connects AI technology with global service business. My experience is mainly in RAG, Agents, evaluation, and practical AI applications. This role involves knowledge organization, requirement understanding, solution design, collaboration with engineering teams, and continuous improvement, which fits my background well.</p></div><div class="question qa-bilingual"><b>2. 你对这个岗位的理解和了解是什么？</b><p class="answer-cn">我理解这个岗位不是单纯做模型或写接口，而是围绕全球服务场景，把产品和服务知识结构化，并通过 RAG、Agent 或知识管理能力支持 eService、self-service 和智能客服。工作会涉及需求梳理、方案设计、研发协同、交付后的精度优化，还要关注来源可追溯、地区差异、权限和人工兜底。</p><p class="answer-en"><b>English:</b> I understand this role as more than model development or API integration. It is about organizing product and service knowledge for global service scenarios, and using RAG, Agents, and knowledge management to support eService, self-service, and intelligent customer service. It also requires requirement analysis, solution design, engineering coordination, iteration after delivery, traceability, regional differences, permissions, and human fallback.</p></div><div class="question qa-bilingual"><b>3. 如果加入后面对多任务、多方压力，你会怎样协调精力？</b><p class="answer-cn">我会用重要性和紧急性做四象限：又紧急又重要的优先处理，紧急但不重要的快速处理或集中处理，不紧急但重要的拆成阶段目标，不紧急也不重要的延后。滴滴实习中，我最先保证方案设计和方向校准，及时解决前期偏差，同时做好领导预期管理，再推进开发和落地。</p><p class="answer-en"><b>English:</b> I use an importance-and-urgency matrix. I handle urgent and important tasks first, deal with urgent but less important tasks quickly, break important but less urgent work into milestones, and postpone low-priority tasks. In my Didi internship, I first protected the solution design and alignment, managed expectations with my lead, and then moved the development and delivery forward.</p></div><div class="question qa-bilingual"><b>4. 团队合作中你的角色是什么？</b><p class="answer-cn">我通常是结构化方案推动者、技术落地者，也是不同角色之间的沟通桥梁。我会先梳理模糊需求，推动需求方、组长和研发同事对齐目标、范围和验收标准，再负责核心开发、测试和问题闭环。</p><p class="answer-en"><b>English:</b> I usually act as a structured solution driver, a hands-on implementer, and a bridge between different roles. I clarify vague requirements, align the goal, scope, and acceptance criteria with the requester and the team, and then take responsibility for key development, testing, and issue closure.</p></div><div class="question qa-bilingual"><b>5. 对 Base 地有什么意向？家是哪里的？</b><p class="answer-cn">我来自河北，优先考虑天津。天津离家近，同时我也比较看好这里的职业发展、住房和教育资源。不过地点不是唯一条件，如果岗位、团队和成长空间更匹配，我也会综合考虑其他城市。正式入职时间会在毕业之后，具体结合论文、答辩和学校安排提前沟通。</p><p class="answer-en"><b>English:</b> I am from Hebei, so Tianjin is my first choice. It is close to home, and I also see good opportunities there in terms of career development, housing, and education. However, location is not the only factor. If the role, team, and growth opportunity are a better fit elsewhere, I can consider it as well. I plan to start after graduation, with the exact timing aligned with my thesis and defense schedule.</p></div><div class="question qa-bilingual"><b>6. 你使用 AI 的项目技术亮点是什么？</b><p class="answer-cn">主线是把不稳定的多轮、多源查询改造成有状态、可追踪、有证据校验的 Agent 查询流程：先把复杂查询拆成可验证任务，记录任务状态、工具结果和证据，工具调用前后做参数与结果校验；证据不足时继续查询或明确降级，而不是直接回答。它解决的核心不是让模型更会聊天，而是让 Agent 在真实业务流程里更可靠。</p><p class="answer-en"><b>English:</b> The main improvement was turning an unstable multi-step and multi-source query into a stateful, traceable Agent workflow with evidence checks. We broke complex queries into verifiable tasks, tracked task states, tool results, and evidence, and validated tool calls and outputs. When the evidence was not enough, the system continued the query or clearly downgraded the answer instead of guessing. The goal was to make the Agent reliable in a real business workflow.</p></div><div class="question qa-bilingual"><b>7. 对前公司的技术氛围和 mentor 评价怎么样？</b><p class="answer-cn">整体技术氛围比较积极，重视真实问题解决和方案落地，不只是看 Demo。mentor 和组长会在需求拆解、方案颗粒度和技术取舍上给我指导，同时也要求我先独立思考、带着具体问题沟通。我得到的评价是学习能力强、有责任心，能快速进入陌生业务并推动从需求分析到开发、测试和问题闭环；需要继续提升主动汇报和决策果断度。</p><p class="answer-en"><b>English:</b> The technical environment was positive and focused on solving real problems and delivering practical solutions, not just building demos. My mentor and team lead guided me on requirement analysis, solution scope, and technical trade-offs, while also encouraging me to think first and bring specific questions. They saw me as a fast learner with a strong sense of responsibility. They also suggested that I improve proactive updates and decision-making speed.</p></div><div class="question qa-bilingual"><b>8. 你对联想这个部门的认知，以及认知途径是什么？</b><p class="answer-cn">我主要通过一面和面试交流了解到，团队属于全球服务方向，围绕 eService、self-service 和智能客服做售后服务的 AI 转型，探索 MCP + Agent 在自助提单、设备诊断等场景中的应用，也关注 B 端和多模态服务。我的理解是，岗位的核心是把不同地区的知识、流程和系统能力组织起来，让更多问题可靠地在自助渠道解决。</p><p class="answer-en"><b>English:</b> I learned about the team mainly through the first-round interview and our discussions. The team focuses on global service and AI transformation in eService, self-service, and intelligent customer service. It is exploring MCP and Agent solutions for self-service ticket creation, device diagnosis, B2B service, and multimodal experiences. I see the core challenge as organizing knowledge, processes, and system capabilities across regions so more issues can be solved reliably through self-service.</p></div><div class="question qa-bilingual"><b>9. 到岗时间、其他 Offer 和岗位匹配度怎么考虑？</b><p class="answer-cn">我会在毕业之后正式入职，具体时间结合论文、答辩和学校安排提前沟通。目前我已经收到一份 Offer，也有几家公司在面试流程中，但我更看重岗位匹配度、业务方向和长期发展；如果这边更合适，我会优先考虑。</p><p class="answer-en"><b>English:</b> I plan to join after graduation, and I will confirm the exact timing based on my thesis, defense, and school schedule. I have received one offer and I am still interviewing with a few companies, but I care more about role fit, business direction, and long-term growth. If this role is the best fit, I would prioritize it.</p></div></div></section></section>`;
    function render(){
      document.body.dataset.round=current;
      document.querySelectorAll('[data-round]').forEach(b=>b.classList.toggle('active',b.dataset.round===current));
      const title=current==='technical'?'业务面':current==='fundamentals'?'八股题库':current==='supervisor'?'主管面':current==='hr'?'HR 面':'手撕';
      const desc=current==='technical'?'按固定主线持续沉淀每次业务面的新增问题、回答和复盘，不再按公司拆分。':current==='fundamentals'?'把高频基础题集中管理：每道题直接展示标准定义、原理、执行机制、工程实践和边界。':current==='supervisor'?'沿用原主管面页面的左右结构，保留可复用的项目、复盘与反问内容。':current==='hr'?'正式 HR 问答与 Offer / 薪资确认分开整理：先准备动机、沟通和发展，再按阶段核对薪酬福利。':'算法、深度学习、Transformer、训练系统与 Agent 的手撕题目，按逐行代码和公式路径独立复习。';
      const map=current==='handwriting'?'<div class="round-map four"><div class="map-node"><strong>基础算法</strong><span>回归、KNN、K-Means</span></div><div class="map-node"><strong>深度学习</strong><span>反向传播与 Softmax</span></div><div class="map-node"><strong>Transformer</strong><span>Attention 与多头机制</span></div><div class="map-node"><strong>系统与 Agent</strong><span>调度与 ReAct</span></div></div>':current==='technical'?'<div class="round-map four"><div class="map-node"><strong>自我介绍</strong><span>背景与岗位价值</span></div><div class="map-node"><strong>项目拷打</strong><span>机制、证据与取舍</span></div><div class="map-node"><strong>八股／基础题</strong><span>技术深度与边界</span></div><div class="map-node"><strong>反问</strong><span>团队、岗位与反馈</span></div></div>':current==='fundamentals'?'<div class="round-map four"><div class="map-node"><strong>Python</strong><span>语言与工程基础</span></div><div class="map-node"><strong>Agent</strong><span>工具、记忆与上下文</span></div><div class="map-node"><strong>RAG／模型</strong><span>检索与模型原理</span></div><div class="map-node"><strong>中间件</strong><span>Redis、MySQL 与缓存</span></div></div>':'<div class="round-map"><div class="map-node"><strong>开场</strong><span>自我介绍与本轮主线</span></div><div class="map-node"><strong>展开</strong><span>项目、问题与个人经历</span></div><div class="map-node"><strong>收束</strong><span>规划、反问与复盘</span></div></div>';
      let html='<div class="hero"><h2>'+title+'</h2><p>'+desc+'</p><span class="badge">当前轮次</span></div>'+map;
      if(current==='technical')html+=businessStages+source('#projectSource','业务信息查询 Agent：原 HTML 全部正文');
      if(current==='fundamentals')html+=eightModule;
      if(current==='supervisor')html+=source('#supervisorSource','主管面通用模板：按原页面结构整理');
      if(current==='hr')html+='<section class="source-wrap"><div class="source-label"><h3>HR 面通用准备</h3></div>'+hrBilingualQuestions+tripartiteChecklist+offerLedger+offerReplies+salaryScript+'<div class="hr-layout"><div class="hr-side"><h4>Offer / 薪资确认清单</h4><p>进入 Offer 或薪资沟通后，按实际对话选择问题，不需要一次问完。</p><div class="offer-sequence">'+hrOfferChecklist.map(x=>'<div class="offer-item"><b>'+x[0]+'</b><span>'+x[1]+'</span><small>'+x[2]+'</small></div>').join('')+'</div><p class="offer-note"><b>现场顺序：</b>先确认固定与浮动收入，再确认总包和福利；加班、定级和晋升放在后面。没有明确政策时记为“待确认”，不要自行推算。</p></div>'+englishInterviewModule+'</div></section>';
      if(current==='handwriting')html+=handwritingModule;
      html+='<footer style="margin-top:28px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px">业务面正文保留第一、第二和学校项目的完整资料，技术追问作为业务面中的一个阶段；主管面正文来自原始 HTML，八股题库独立维护，页面仅负责轮次切换和样式承载。</footer>';
      app.innerHTML=html;
      if(current==='hr'){
        // HR 内容已在 hrBilingualQuestions 中按中英文问答统一渲染，避免旧的短提示重复出现。
      }
      if(current==='fundamentals')prepareFundamentals(app);
      if(current==='supervisor')customizeSupervisor(app);
      if(current==='hr')customizeHr(app);
    }
    window.addEventListener('popstate',()=>{
      const round=new URLSearchParams(location.search).get('round');
      const next=['technical','fundamentals','supervisor','hr','handwriting'].includes(round)?round:'technical';
      if(next!==current){current=next;render();if(!location.hash)window.scrollTo({top:0,behavior:'instant'});}
    });
    document.querySelectorAll('.side-nav [data-round]').forEach(b=>b.addEventListener('click',()=>{
      current=b.dataset.round;
      const url=new URL(location.href);url.searchParams.set('round',current);url.hash='';
      try{history.replaceState(null,'',url)}catch{}
      render();window.scrollTo({top:0,behavior:'instant'});
    }));document.querySelector('#openAll').onclick=()=>document.querySelectorAll('#app details').forEach(x=>x.open=true);document.querySelector('#closeAll').onclick=()=>document.querySelectorAll('#app details').forEach(x=>x.open=false);render();
  </script>
</body>
</html>
