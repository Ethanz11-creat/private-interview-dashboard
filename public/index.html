<h4>为什么“条款级切分”仍然需要父子结构？</h4>
<p>条款是很好的起点，却不保证每条都短且独立。有的条款几千字，包含多个子项；有的子项只有“符合前款要求”，离开父条款就没有意义。所以实际策略是按自然层级切分，检索时使用足够细的子项，回答时恢复父条款的前提与范围。对法规/规章，父条款主要用于上下文还原，细粒度子项参与向量检索；对较短政策措施，完整措施本身就可作为检索单元。</p>
<p>嵌入文本可以由“文档标题 + 版本或标准号 + 章节路径 + 必要的前导条件 + 子块正文”组成。这样搜索“申请条件”时，子项不再只是孤立句子。原始正文和用于嵌入的增强文本分别保存，引用仍展示原文，避免把自动补充的标题路径误当成原句。</p>
<h4>统一证据对象：模型拿到的不只是字符串</h4>
<pre><code>{
  "document_id": "稳定的文档身份",
  "document_version_id": "该次回答使用的明确版本",
  "chunk_id": "命中的证据块",
  "parent_chunk_id": "同版本父块，没有则为空",
  "document_kind": "policy / regulation / ccar / standard / ...",
  "structure_path": ["章节", "条款", "子项"],
  "text": "原始证据片段",
  "parent_context": "必要的父条款与前导条件",
  "locator": {"page": "页码", "bbox": "原页坐标或其他定位"},
  "source_uri": "可回看的原始来源",
  "validity": {"effective_from": "可为空", "effective_to": "可为空"},
  "quality_state": "可检索 / 待核验 / 已隔离",
  "release_id": "本次使用的语料快照",
  "embedding_generation": "对应的索引处理代次"
}</code></pre>
<p>这是融合接口的字段示意，不要求所有输入都有页码和坐标。网页可以定位到章节和原链接，表格可以定位到 sheet 与行；缺失字段保留为空，不制造精确定位。前端基于这些字段展示出处，模型基于正文和父上下文组织答案，审校人员可以据此找回原始页面。</p>
<h4>有效期、修订版和索引代次如何隔离？</h4>
<p><strong>文档版本</strong>解决内容与效力变化；<strong>处理代次</strong>解决同一正文采用不同解析器、切块策略或嵌入模型生成的产物；<strong>发布快照</strong>决定这一批对外可查询的数据集合。三者不能只用一个“最新”标记代替。例如只更新切块算法，不代表法规产生了新修订版；重新下载文件，也不代表文件刚刚发布。</p>
<p>默认查询使用已发布且通过质量检查的版本，指定历史时间的问题则按该时间选择可适用版本。版本限制在候选生成阶段就生效，不能先把新旧文本混入模型，再指望回答时自行去重。历史资料仍保留，便于解释制度变化。若未能确认某文件已被替代或失效，就显示已知来源与未知状态，不擅自把它判为有效或无效。</p>
<p>更新时先在候选代次生成切块和向量，检查结构、来源覆盖和检索可用性，再切换活动快照；失败时继续使用上一个可用快照。原文件和解析产物保留独立副本或备份，索引可按版本重建。具体备份介质和保留周期属于部署选择，这里不把“有数据库”当作已经具备容灾能力。</p>
</div>

<div class="school-unit" id="school-retrieval">
<h3>4.6 统一检索：怎样保证先找到适用证据？</h3>
<p>检索目标并非“语义最像的几段话”，而是<strong>在指定主体、地区、时间和文档范围内，找到足以支持回答的证据</strong>。例如查询明确给出标准编号时，先精确定位编号与版本比只做语义搜索更可靠；问地区扶持政策时，地区和效力约束则需要在候选生成时就生效。</p>
<ol>
<li><strong>保留原始问题，提取显式约束。</strong>识别主体、活动、地区、时间、文档类型、标准号或条款号。查询重写只做消歧和规范化，不把用户没给出的资质、日期补成事实。缺少决定适用范围的关键条件时先澄清；可以分条件回答的则分别标注。</li>
<li><strong>确定检索范围与版本。</strong>按文档元数据过滤，同时保留必要的上位或关联文件候选。限制过严导致零结果时先检查过滤条件和未知字段，不能悄悄放宽地区或时间后仍声称“完全适用”。</li>
<li><strong>并行使用精确/词法与稠密向量检索。</strong>编号、机构名和专业术语适合精确或词法匹配，意图和同义表达适合向量检索。向量索引的模型、维度和存储方式按部署配置选择，关键是让同一份证据同时具备可过滤、可召回和可定位能力。</li>
<li><strong>融合排序，再按需要重排。</strong>词法分数与向量分数不同尺度，可用 RRF 按各路名次融合，再对候选做语义相关性重排。重排服务异常时返回可复现的基础排序并记录降级，不能把失败吞掉变成“没有资料”。</li>
<li><strong>回填同版父上下文并组装证据。</strong>子项命中后恢复条首、章节限定、表头或脚注；对同一父节点的多次命中合并展示，保留每个子项的定位。给生成层的内容需要控制总预算，但不能为了短而丢掉改变结论的例外。</li>
<li><strong>检查证据覆盖，再进入问答分支。</strong>能找到政策支持措施却没有有效期，说明证据仍有缺口。补检针对缺失字段或关联条款，不重复检索整句问题；设置轮次、候选量和上下文预算，达到上限后输出已知部分与未解决项。</li>
</ol>
<div class="school-formula">RRF(d) = Σᵢ 1 / (k + rankᵢ(d))<br>rankᵢ(d)：文档或切块 d 在第 i 路召回中的名次；未进入该路结果时，该项不贡献分数。</div>
<p>这里的 RRF 是融合设计中的排序方法，并不是 SG-FKE 论文提升数字的单独归因。它解决不同召回分数不好直接相加的问题，不保证召回正确。<code>k</code> 控制高位名次的优势程度，取值应结合结果稳定性选择，不能把某个常用值当成所有语料都最优。</p>
<div class="school-selection-panel"><h4>技术选型：向量库、Embedding 与索引策略为什么这样选？</h4>
<p>这个选型不是先问“哪个向量库最热门”，而是先看项目约束：当前简历口径约有 55,135 条向量索引，文档需要按地区、文类、版本、生效时间、发布机构和质量状态过滤；命中后还要回查父条款、原文定位和审校记录。也就是说，向量相似度只是召回的一部分，系统还需要关系字段、版本事务、证据关联和可追溯查询。基于这个规模与需求，当前目标设计选择 <strong>PostgreSQL + pgvector</strong>：结构化元数据和证据关系放在同一数据边界内，向量列用于稠密召回，再配合词法检索和 RRF 融合。</p>
<div class="school-table"><table><caption>候选方案比较：先按当前约束做第一阶段选择，再保留演进空间</caption><thead><tr><th>方案</th><th>适合的场景</th><th>优势</th><th>当前没有优先选它的原因</th></tr></thead><tbody>
<tr class="school-result"><td><strong>PostgreSQL + pgvector</strong><br>当前选择</td><td>文档量中等、结构化过滤复杂、证据关系和版本管理与检索同等重要。</td><td>关系数据、版本状态、权限字段、父子 Chunk、来源定位可以统一管理；事务和 SQL 过滤成熟；向量与词法结果容易在一个查询链路中组合；部署组件少，便于先把正确性和可追溯性做完整。</td><td>极大规模纯向量检索、超高并发和复杂分布式扩展不是它的最强项；因此需要持续观察索引规模、延迟和并发，再决定是否拆出专用检索服务。</td></tr>
<tr><td><strong>Milvus / Qdrant / Weaviate 等专用向量库</strong></td><td>向量规模大、相似度检索是绝对主路径、需要水平扩展和独立向量服务。</td><td>向量索引和 ANN 检索能力更专门，扩展、分片、量化和高并发支持通常更丰富。</td><td>文档版本、政策效力、父子结构、审校状态和来源关系仍要落在关系库；双写和跨库一致性会增加系统复杂度。当前 55,135 条索引尚不足以证明必须引入两套数据系统。</td></tr>
<tr><td><strong>FAISS</strong></td><td>本地实验、离线评测、单机原型或需要快速比较索引算法。</td><td>轻量、速度快，适合研究阶段快速验证召回效果。</td><td>它本身不是完整的文档数据库，不负责版本、权限、证据关系、事务和多用户服务。可以作为实验组件或索引加速层，但不能单独承担本项目的权威存储。</td></tr>
<tr><td><strong>Elasticsearch / OpenSearch</strong></td><td>全文检索、字段过滤、日志和搜索分析是主场，同时希望补充向量检索。</td><td>倒排检索、分词、过滤、聚合和搜索运维能力成熟，适合关键词密集的政策编号、机构名和条款号。</td><td>它很适合成为词法召回通道，但作为唯一权威数据模型时，复杂版本关系、父子证据和业务事务仍需谨慎设计；如果已有搜索集群，可以与关系库或向量库协同，而不是因为能存向量就让它替代全部数据层。</td></tr>
<tr><td><strong>Neo4j 等图数据库</strong></td><td>实体关系稳定、图遍历和关系分析本身就是核心业务。</td><td>节点、边和多跳遍历表达直观，适合长期维护的关系网络。</td><td>政策与安全文档首先是带条件、版本和原文定位的证据，很多关系需要按问题即时抽取；强行先建全局图会增加实体消歧、更新和冲突治理成本。图结构可以作为后续能力，不能替代原文证据库。</td></tr>
</tbody></table></div>
<p><strong>面试中的一句话：</strong>“我没有因为 pgvector 能做向量相似度就直接选它，而是先看项目的真实约束。我们当前只有约 5.5 万条索引，但每条结果都要关联文档版本、地区、时间、父条款、来源和审校状态，所以第一阶段更需要关系查询、事务和证据可追溯。PostgreSQL 加 pgvector 能把结构化过滤和向量召回放在一个一致的数据边界里，组件少、维护成本低，足够支撑当前规模。Milvus 或 Qdrant 在超大规模和高并发 ANN 上更有优势，FAISS 更适合实验，Elasticsearch 更适合作为词法召回通道；如果未来规模、并发或检索延迟达到瓶颈，再把向量检索拆成专用服务，并通过稳定的文档版本和 Chunk ID 保持一致。”</p>
<p class="school-selection-subhead"><strong>Embedding 模型怎么选：</strong>存储选型和 Embedding 选型是两件事</p>
<p>向量库决定“怎样存、怎样建索引、怎样过滤”，Embedding 模型决定“什么文本在语义空间里更接近”。两者不能混为一个选择。当前设计可采用 <strong>BAAI/bge-m3 的 dense 表示</strong>，按 1024 维向量建立索引；它对中文和多语种资料覆盖较好，适合政策、法规和安全资料混合的语料，也支持本地部署，便于控制敏感文档不出域。这里明确只使用已配置的 dense 路径，不把模型一般支持的 sparse 或多向量能力说成当前系统已经启用。</p>
<div class="school-grid"><div class="school-card"><h4>为什么不只用中文小模型？</h4><p>如果资料始终只有中文、问题也没有英文产品名、标准名或跨语种内容，中文模型可以是成本更低的选择。但多源安全资料可能包含英文缩写、国际标准名称和混合术语，因此优先考虑中英文覆盖、长文本能力和本地可部署性，再用领域样本验证，不凭模型名判断效果。</p></div><div class="school-card"><h4>为什么不直接用云端 Embedding API？</h4><p>云端模型可能有更强的通用语义能力、更新方便，但需要评估敏感资料出域、调用费用、网络稳定性、版本变化和向量重建成本。本地模型更容易固定版本、离线重建和审计；如果未来采用云端服务，必须把模型版本写进 embedding generation，并重新生成索引，不能混用不同模型的向量。</p></div></div>
<p>最终仍要用代表性语料验证：政策编号、地区和机构名的精确命中依靠词法或字段过滤，语义相似的政策表达依靠向量召回，标准参数和条款号不能只靠 Embedding。模型效果、维度和索引类型应作为可替换配置，证据对象和 Chunk ID 保持稳定，这样更换模型或向量库时不会破坏版本与引用关系。</p>
<p class="school-selection-subhead"><strong>pgvector 的索引怎么选：</strong>HNSW 和 IVFFlat 的取舍</p>
<p>如果当前以增量更新、较高召回质量和中等规模查询为主，我会优先从 <strong>HNSW</strong> 起步。HNSW 通过多层近邻图减少搜索范围，不需要像聚类索引那样先训练中心，新增文档和重建候选版本更自然；代价是建索引更耗时、内存开销更高，<code>m</code>、<code>ef_construction</code> 和查询时的 <code>ef_search</code> 需要结合召回率和延迟调节。<strong>IVFFlat</strong> 的索引构建和存储成本通常更容易控制，批量导入、数据相对静态时有优势，但需要训练聚类中心，并且 <code>lists</code> 与 <code>probes</code> 会影响召回和速度。两者都不是“天然更准确”，要用冻结的代表性查询集比较 Recall、延迟和索引资源。</p>
<p>元数据过滤还会影响近似检索的实际召回：如果先限定某个地区、版本或文类，过滤后候选很少，单纯提高向量相似度并不能找回被过滤掉的证据。因此需要给过滤字段建立普通索引，合理扩大候选后再重排，必要时使用分区、迭代扫描或精确回查；版本和权限过滤不能为了提高召回而最后才做。面试中可以概括为：“索引算法负责近似邻居，业务字段负责适用边界，两者要一起评估。”</p>
<p class="school-selection-subhead"><strong>什么时候会从当前方案切换？</strong></p>
<p>切换不是因为“专用向量库更先进”，而是出现可量化的瓶颈：向量规模和索引构建时间持续超过单库可接受范围；并发查询下 ANN 延迟成为主要瓶颈；结构化过滤与向量召回需要独立扩展；或者团队已有稳定的搜索基础设施。届时可以保留 PostgreSQL 作为文档、版本和证据的权威库，把向量检索拆到 Milvus、Qdrant 或搜索引擎，再通过文档版本、Chunk ID、embedding generation 和 release ID 做异步构建、校验、切换和回退。架构演进的判断依据是数据规模、延迟、成本、一致性和运维能力，而不是单纯比较产品功能列表。</p>
</div>
<h4>不同使用入口为什么必须共用检索结果？</h4>
<p>网页搜索、问答和工具调用如果各自写一套检索，很容易出现“网页能找到、模型找不到”或“引用打开的是另一个版本”。统一检索服务返回证据标识、原文、父上下文、版本、质量和降级状态；网页转成阅读卡片，问答转成上下文，工具转成结构化结果。调用方式可以不同，但不能复制出多套事实库。</p>
<h4>检索有结果，为什么仍不能立即回答？</h4>
<p>向量相似性只说明语言相关，不能证明规则适用。还要检查证据是否覆盖问题要求、不同证据的主体是否一致、引用文件是否同一版本、某个措施是否附带前提。引用存在也不等于引用支持结论，因此后续抽取与核验必须继续保留“结论—证据”的对应关系。</p>
</div>

<div class="school-unit" id="school-sgfke">
<h3>4.7 政策分支：SG-FKE 到底怎样工作？</h3>
<p>SG-FKE 的全称是 <strong>Subquestion-Guided Fine-grained Knowledge Extraction，子问题引导的细粒度知识抽取</strong>。它处理的核心矛盾是：多跳问题需要连接多个事实，但检索回来的长文本包含大量背景、目标和泛化表达；直接拼接上下文，模型不一定能抓住真正决定答案的关系。方法先让问题变得明确，再把相关知识压缩为细粒度三元组。</p>
<div class="school-note"><strong>必须讲准的机制：</strong>论文中，子问题用于引导从已经检索到的上下文抽取三元组，不直接逐个检索、逐个回答。原始问题和三元组进入最终生成；融合系统进一步加上来源绑定、条件保留与原文核验。这两层做法要分清，不能把融合后的所有步骤都说成论文原本验证过的组件。</div>

<h4>步骤一：重写与子问题生成，解决“抽什么”</h4>
<p>复杂问题往往同时问主体、时间和措施。论文用少样本提示把原问题生成两个语义明确的子问题，使抽取目标更集中。例如雄安政策案例，原问题同时包含“有效期”和“企业获得扶持的条件”，可以分别询问“该扶持政策的有效期是什么”和“在这个时间范围内企业需要满足哪些条件”。子问题仍围绕原问题，不能添加“企业已经满足某资质”一类未经用户或文档确认的前提。</p>
<p>论文中的“两个”是实验设置，不能直接声称已经实现任意复杂度的动态规划器。系统设计可以根据任务控制子问题数量，但必须兼顾覆盖、重复与调用成本，保留原问题并允许少拆或不拆。拆分后要检查原始约束是否都被覆盖，而不是只看子问题读起来是否流畅。</p>
<h4>步骤二：带着子问题抽取，解决“哪些事实真的有关”</h4>
<p>把原问题、子问题和候选政策文本一起输入抽取模型，用 2—3 个高质量示例约束 <code>&lt;实体1, 关系, 实体2&gt;</code> 的输出方式。子问题相当于抽取注意范围：目标相关的措施、条件和主体被保留，不相关的发展背景、宣传性表述和重复句子被排除。它不是先回答子问题再拿答案拼接，也不是把子问题生成的内容直接当作知识。</p>
<p>在融合设计中，三元组外层附带 <code>evidence_ids</code>、原文片段和限定信息。例如“主体—可申请—支持措施”的关系还要绑定适用地区、资格前提、时间窗和例外。正文中没有明确关系时，可以保留原句或标记不足，不能因为两个实体出现在同一段就认定它们存在支持、隶属或因果关系。</p>
<h4>步骤三：组织局部证据路径，解决“事实能否连接”</h4>
<p>按子问题把事实分组，再验证跨组连接是否成立：同名主体是否真是同一对象，支持措施与适用条件是否属于同一政策，引用的时间范围是否与所问时间一致。去重只合并相同来源或等价事实，不能把互相矛盾的不同版本抹成一个结论。最终形成“原问题—子问题—事实集合—原始条款”的映射。</p>
<p>这种表示可以视为按问题生成的局部证据结构，不要求预先为全部文件建全局知识图谱。文档层级树、实体关系图和这一局部证据路径是三种不同结构：层级树还原原文件，实体图表达实体间关系，证据路径说明本次回答用了哪些依据。</p>
<h4>步骤四：生成答案并核验，解决“回答有没有越过证据”</h4>
<p>论文以抽取的三元组替代冗长上下文，与原问题共同生成答案。融合设计保留这一高密度表示，同时对关键条件和最终引用回看原文；需要时把必要原文片段一并送入生成，而不是重新塞回全部文档。这会改变实际输入长度，因此论文中的字符压缩比例不能不加说明地套用到完整系统。</p>
<p>输出应包含结论、适用主体和时间、必要条件，以及对应来源。核验时看关系是否能由原文支持、是否把“鼓励”改成“保证”、是否漏掉例外，以及每个子问题是否有证据。无法解决的冲突或缺口保留在答案中；没有证据的事实不靠模型常识补齐。</p>
<h4>论文真实案例：丰台产业载体问题</h4>
<p>论文给出的原问题是：“<strong>丰台区为实现低空经济产业规模目标，计划建设哪些载体以培育优质企业？</strong>”候选来源为《关于促进丰台区低空经济产业高质量发展的指导意见（2024—2026年）》。两个子问题分别关注产业规模目标与培育优质企业所需的产业载体，模型据此从政策全文抽取五个相关三元组，再生成回答。</p>
<p>这个案例说明子问题帮助确定抽取范围，而不是把“目标”和“载体”两个词检索到就算完成推理。本章不补写原材料图中未能核实的具体三元组和数值；机制解释与具体政策事实分开，避免为了示例完整而引入未经核对的条款。</p>
</div>
<div class="school-unit" id="school-example">
<h3>4.8 把政策和安全资料放在一起后，如何回答一个混合问题？</h3>
<p>以“<strong>某企业准备在某地开展无人机应用，能申请哪些产业支持，同时需要核对哪些运行安全要求？</strong>”为例。这是用于解释融合设计的示意问题，不代表任何具体地区的现行政策结论。系统首先要判断企业类型、活动内容和查询时间是否明确；仅凭“无人机应用”不能推出载人/载货、运行方式、适航或运营要求。</p>
<div class="school-table"><table><caption>同一问题的两个证据分支：分别成立，再合并表达</caption><thead><tr><th>处理位置</th><th>经济政策分支</th><th>运行安全分支</th></tr></thead><tbody>
<tr><td>确定问题范围</td><td>地区、企业类型、拟申请的支持类别、查询时间。</td><td>活动类别、运行主体、运行环境、具体适用对象与时间；关键条件不明时先询问。</td></tr>
<tr><td>选择证据</td><td>地区政策、申报通知、实施细则及其同版本附件。政策原则和当期申报细则需要区分。</td><td>相关法规、民航规章、规范性文件和标准；先核对适用范围，再选择具体条款。</td></tr>
<tr><td>需要抽取什么</td><td>支持对象、条件、措施、申请窗口与例外；用子问题聚焦这些字段，再形成带来源三元组。</td><td>主体义务、许可或程序要求、技术条件、参数与例外；以原结构证据为主，不强行压缩成政策式三元组。</td></tr>
<tr><td>如何组织证据</td><td>同一措施关联到它的资格条件与有效时间。缺少细则时标明“政策支持方向已找到，具体申报条件待补充”。</td><td>条文关联同版上位范围、定义与子项；标准参数附带单位、方法和原表定位。未知适用性不能转写为“无要求”。</td></tr>
<tr><td>如何合并答案</td><td colspan="2">第一部分说明可能适用的产业支持与条件；第二部分说明基于已知活动范围应核对的安全要求；最后列明仍缺少的资质、日期或运行细节。政策鼓励不替代运行许可，两类结论分别附来源。</td></tr>
</tbody></table></div>
<h4>一个条件保留的微型示例</h4>
<p>假设候选政策原文表达“符合条件 A 的主体，在时间窗 B 内，可以申请支持 C，情形 D 除外”。最小三元组可以是“主体—可申请—支持 C”，但单独这一条会丢掉决定适用性的内容。因此融合表示需要保留 <code>conditions=[A]</code>、<code>time_window=B</code>、<code>exceptions=[D]</code> 和来源证据，回答时仍应使用“符合 A 且位于 B 内，并排除 D”的完整条件。A、B、C、D 是结构占位符，不是实际政策字段值。</p>
<p>同样，标准表格中的“阈值 E”只有结合参数名、单位、试验条件和判定方法才是完整证据。如果条件缺失，即使数值 OCR 识别正确，也不能作为确定结论。类型化抽取的价值就在这里：统一检索入口，同时保留每类知识不能丢掉的语义。</p>
<h4>为什么不能把两个分支检索结果直接拼给模型？</h4>
<p>直接拼接会把“可以获得产业扶持”与“允许开展运行”混成一件事，还可能让模型对没有资料的安全环节作补全。融合层需要先分清每个结论回答的是哪一个子目标，再验证主体、时间和活动条件是否一致。只有来源明确、条件兼容的事实才可以连接；不兼容的证据需要分别解释，不能为了给出一个简短答案强行统一。</p>
</div>

<div class="school-unit" id="school-experiments">
<h3>4.9 简历数字怎么来的，实验到底证明了什么？</h3>
<p>要先区分系统语料规模、问答数据规模和方法实验结果。简历中“280 份区域政策、126 份安全文档、55,135 条向量索引”描述系统语料口径；论文中的“176 份政策、680 条 LEMQA”描述政策问答研究的数据构建口径。这些数字的统计对象不同，不能相互替代，也不能据此声称安全分支已经获得相同问答提升。</p>
<div class="school-table"><table><caption>数据口径：文档、检索单元和问题不是同一种计数</caption><thead><tr><th>数字 / 数据集</th><th>准确含义</th><th>面试时如何解释</th></tr></thead><tbody>
<tr><td>280 + 126 份</td><td>简历记录的区域政策文档与低空安全文档，合计 406 份。</td><td>表达多源异构资料范围。文档去重与版本规则应按对应语料快照定义；不等于 406 个原始文件，也不等于论文全部实验输入。</td></tr>
<tr><td>55,135 条向量索引</td><td>简历记录的向量检索规模。</td><td>与切块粒度、纳入版本及有效嵌入记录有关，不是三元组数，也不是问答对数。不能仅由文档数反推每份文档的精确切块量。</td></tr>
<tr><td>LEMQA：176 份 → 680 问</td><td>从国务院、民航局和地方政府官网的 176 份权威政策构建；每份生成 5 个候选问答，经人工筛选审校保留 680 条多跳问答。</td><td>问答构建过程与文档入库过程分开。现有材料没有给出与 280 份政策清单的逐项快照映射，不凭数量就认定两者完全相同或严格包含。</td></tr>
<tr><td>HotpotQA-distractor</td><td>实验测试样本 2,222 条，每题含 10 篇背景文档。</td><td>公共多跳任务，用于观察跨段事实连接能力，不是低空业务数据。</td></tr>
<tr><td>2WikiMultihopQA</td><td>实验测试样本 3,773 条，每题含 10 篇背景文档。</td><td>简历中的 F1 / EM 提升来自这里的 Qwen-32B 对比。</td></tr>
<tr><td>MuSiQue-Ans</td><td>实验测试样本 725 条，每题含 20 篇背景文档。</td><td>包含更复杂的组合式多跳问题，用于观察长上下文与多关系连接表现。</td></tr>
</tbody></table></div>
<p>公共数据集由于公开测试集没有可用标签，论文使用公开开发集按 7:3 划分验证与测试。这个比例不能未经确认就套到 LEMQA。评测结果需要和模型、样本、输入设置及评分脚本一起理解；它们不是完整生产系统在真实在线流量中的成功率。</p>
<h4>对比方法各自检验了什么？</h4>
<p><strong>Naïve RAG</strong>提供直接使用检索上下文的基线；<strong>CoT</strong>观察增加推理提示的效果；<strong>RQ-RAG</strong>引入查询重写、分解等查询侧增强；<strong>GraphRAG</strong>提供图结构知识组织的对照；<strong>SG-FKE</strong>把子问题作为抽取提示，使用细粒度三元组减少上下文噪声。这里比较的是论文给定实验配置，不能从一张表推导出所有图检索方法在任何任务都不如 SG-FKE。</p>
<h4>Qwen-32B 完整结果：简历的四个提升都能直接核对</h4>
<div class="school-table"><table><caption>论文表 1 · Qwen-32B · 表内分数按 0—100 标度报告</caption><thead><tr><th>方法</th><th>HotpotQA<br>F1 / EM</th><th>2Wiki<br>F1 / EM</th><th>MuSiQue<br>F1 / EM</th><th>LEMQA<br>ROUGE / BERTScore F1</th></tr></thead><tbody>
<tr><td>Naïve RAG</td><td>58.9 / 48.4</td><td>49.4 / 37.1</td><td>46.9 / 23.0</td><td>43.1 / 72.4</td></tr>
<tr><td>CoT</td><td>59.2 / 50.2</td><td>51.8 / 44.6</td><td>47.2 / 26.2</td><td>45.8 / 74.2</td></tr>
<tr><td>RQ-RAG</td><td>60.4 / 52.7</td><td>54.3 / 48.0</td><td>48.9 / 29.0</td><td>46.2 / 75.3</td></tr>
<tr><td>GraphRAG</td><td>63.6 / 55.1</td><td>57.6 / 51.2</td><td>53.1 / 33.4</td><td>47.4 / 76.4</td></tr>
<tr class="school-result"><td>SG-FKE</td><td>65.3 / 57.5</td><td>59.0 / 53.0</td><td>54.2 / 35.0</td><td>47.8 / 76.8</td></tr>
</tbody></table></div>
<div class="school-formula">2Wiki F1：59.0 − 49.4 = +9.6 个点<br>2Wiki EM：53.0 − 37.1 = +15.9 个点<br>LEMQA ROUGE：47.8 − 43.1 = +4.7 个点<br>LEMQA BERTScore F1：76.8 − 72.4 = +4.4 个点</div>
<p>因此，简历的这组数字对应的是 <strong>Qwen-32B + SG-FKE 相对 Naïve RAG</strong>，属于绝对分数差，不是相对提升百分比。不同模型、不同基线的差值不能混用。旧页面关于这组简历数字“与论文不一致”的判断已依据原表纠正。</p>
<h4>另一模型的结果与结论边界</h4>
<div class="school-table"><table><caption>ChatGLM-9B：保留跨模型验证口径</caption><thead><tr><th>方法</th><th>HotpotQA<br>F1 / EM</th><th>2Wiki<br>F1 / EM</th><th>MuSiQue<br>F1 / EM</th><th>LEMQA<br>ROUGE / BERTScore F1</th></tr></thead><tbody>
<tr><td>Naïve RAG</td><td>56.2 / 46.4</td><td>45.7 / 34.0</td><td>42.8 / 19.3</td><td>42.4 / 71.3</td></tr>
<tr class="school-result"><td>SG-FKE</td><td>62.6 / 51.0</td><td>54.6 / 46.9</td><td>48.8 / 29.9</td><td>46.5 / 75.1</td></tr>
</tbody></table></div>
<p>这说明在两种被测试模型上都观察到了收益，但不能据此保证换成任意模型、任意安全规范或任意检索系统都有相同增益。尤其在 LEMQA 上，Qwen-32B 的 SG-FKE 相对 GraphRAG 仅高 0.4 / 0.4 个点，不能把相对 Naïve RAG 的 +4.7 / +4.4 错报为相对 GraphRAG 的收益；材料未给出显著性检验时，也不额外宣称统计显著。</p>
<h4>这些指标的定义，以及各自不能说明什么</h4>
<div class="school-grid">
<div class="school-card"><h4>问答 F1：答案词元重合</h4><p>在相同规范化和分词规则下，令 <code>m</code> 为预测答案与参考答案重合的词元数（按多重集合计数），<code>P = m / 预测词元数</code>，<code>R = m / 参考词元数</code>，<code>F1 = 2PR / (P + R)</code>。空答案等特殊情况按评测脚本处理。</p><p>这里是问答答案重合 F1，不是碰撞检测里根据 TP/FP/FN 计算的分类 F1。它可以反映答案词语覆盖，却不保证主体、否定关系和引用正确。</p></div>
<div class="school-card"><h4>EM：规范化后完全匹配</h4><p><code>EM = 1[normalize(预测) = normalize(参考)]</code>，数据集层面再取平均。大小写、标点、冠词等如何规范化由数据集脚本规定，多个参考答案也应遵循相应规则。</p><p>EM 严格，适合较明确的短答案；开放式政策回答即使语义正确，也可能因措辞不同而未完全匹配，因此不能只用 EM 衡量政策长回答。</p></div>
<div class="school-card"><h4>ROUGE：偏向表面文本覆盖</h4><p>ROUGE 是指标家族。以 ROUGE-N 召回形式为例，计算预测与参考的 n-gram 重合数，占参考 n-gram 总数的比例；ROUGE-L 则利用最长公共子序列。具体报告项与聚合方式需要按论文和评分脚本确认，本章保留原表的“ROUGE”名称。</p><p>它能反映关键表述覆盖，但对措辞敏感；只改一个否定词就可能改变政策含义，文本重合分数却仍然较高。</p></div>
<div class="school-card"><h4>BERTScore F1：上下文语义匹配</h4><p>使用上下文编码器得到词元表征，对预测和参考的词元寻找最大相似度匹配，分别聚合为语义 Precision 和 Recall，再求 F1。IDF 加权、编码器及基线重标定设置会影响数值，必须保持配置一致。</p><p>它更能容忍同义改写，但高语义相似度不代表日期、金额和条件完全正确。ROUGE 与 BERTScore 互补，二者都不能代替事实与来源核验。</p></div>
</div>
<h4>消融：子问题和三元组分别贡献了什么？</h4>
<div class="school-table"><table><caption>Qwen-32B · 论文消融的代表结果</caption><thead><tr><th>配置</th><th>2Wiki F1</th><th>相对完整方法</th><th>解释</th></tr></thead><tbody>
<tr class="school-result"><td>完整 SG-FKE</td><td>59.0</td><td>—</td><td>子问题聚焦 + 三元组抽取共同工作。</td></tr>
<tr><td>移除子问题引导</td><td>56.7</td><td>−2.3 个点</td><td>仍有细粒度表示，但抽取目标不够聚焦，容易保留无关信息或遗漏关键关系。</td></tr>
<tr><td>移除三元组抽取</td><td>52.4</td><td>−6.6 个点</td><td>缺少显式事实压缩与连接，长上下文噪声仍会影响回答，下降更明显。</td></tr>
</tbody></table></div>
<p>LEMQA 上，去掉子问题引导后，ROUGE / BERTScore F1 从 47.8 / 76.8 降至 46.4 / 75.7，也支持其聚焦作用。消融可以支持“这两个组件在该实验配置中都有效，三元组抽取影响更大”的判断，不能简单把两个下降值相加作为组件独立收益，因为两者存在交互。</p>
<h4>上下文压缩与效率：不能偷换计量单位</h4>
<p>论文按<strong>平均字符数</strong>统计抽取前后的上下文，报告抽取后约保留原文本 5%—15% 的长度。代表性的抽取后长度包括：HotpotQA 约 629 / 668 字符，2Wiki 约 463 / 505 字符，LEMQA 约 437 / 472 字符（依次为 ChatGLM-9B / Qwen-32B）；MuSiQue 原始上下文超过 9,600 字符，抽取后不足 500 字符。</p>
<p>字符数不等于模型 token 数，原稿对个别比例的概括也存在近似表述，因此应把“明显压缩生成输入”作为主结论，并以原始统计核对精确比例。整体链路额外增加了子问题生成和三元组抽取调用，生成输入减少不意味着端到端延迟按同等比例下降；若融合系统再加入原文核验，也需要重新测量它自己的成本与时延。</p>
</div>

<div class="school-unit" id="school-defense">
<h3>4.10 面试深挖：把关键选择讲透</h3>
<div class="school-faq"><h4>Q1. 这个项目和普通 RAG 的差别是什么？</h4><p>RAG 本身是借助外部检索支持生成，不天然局限于单跳。这个项目针对的是简单 RAG 在异构文档和多跳政策问答中的薄弱环节：在检索前还原文类结构、来源和版本，在检索时保证适用范围，在生成前用子问题与三元组聚焦跨条款事实。改进不只是“换一个向量库”或“多写一个 Prompt”，而是把资料处理、证据选择和关系组织分开设计。</p></div>
<div class="school-faq"><h4>Q2. 为什么不用固定长度切块，条款特别长又怎么办？</h4><p>固定长度不知道某个句子是条件、结论还是例外，很容易把完整规则拆散。因此先识别条款、措施或标准子节，过长时再沿段落与语义边界分子块，保留父节点和必要前导条件。长度控制仍然需要，但它是结构约束后的第二层规则。字符上限只是工程近似，不能把字段名叫 token_count 的字符计数当成真实 tokenizer 的结果。</p></div>
<div class="school-faq"><h4>Q3. 为什么不直接构建完整知识图谱或只用 GraphRAG？</h4><p>全局知识图谱适合关系稳定、跨文档实体查询频繁、需要长期复用图遍历的场景，但要承担实体消歧、关系模式维护、时间版本和增量更新成本。政策文件更新频繁，很多关系只对某个问题有用，SG-FKE 选择先检索、后按需抽取局部事实，减少无差别建图的工作。代价是每次查询可能重复抽取，缓存也必须绑定问题、文档版本和模型配置；如果后续稳定高频关系足够多，再逐步沉淀全局图是合理演进方向。论文中比较了 GraphRAG，但不是宣称图谱没有价值。</p></div>
<div class="school-faq"><h4>Q4. Query Rewrite 或子问题拆错了怎么办？</h4><p>保留原问题作为始终有效的约束，对照检查主体、地区、日期和目标有没有遗漏或被新增假设替换。重复子问题合并，超出原问题的子问题剔除；不确定时允许少拆或直接用原问题约束抽取。如果只是为了增加召回，可保留原问题检索通道，不让重写完全覆盖它。补检是统一检索层的能力，要与论文中“子问题仅引导抽取”的主机制分别说明。</p></div>
<div class="school-faq"><h4>Q5. 三元组抽取自己也会幻觉，为什么还能改善回答？</h4><p>收益来自把注意范围聚焦到可核对的事实，不是三元组格式天然更真实。结构化输出只能保证字段形状，不能保证事实成立；仍要核对关系是否被原文支持、实体是否指向同一对象、时间和例外是否保留。找不到来源的三元组不进入最终证据集；抽取表示过度简化时回到原句。幻觉可以通过检索、约束、核验和降级降低，无法承诺完全消除。</p></div>
<div class="school-faq"><h4>Q6. 检索本身错了，后面能救回来吗？</h4><p>如果关键事实根本没有进入候选证据，抽取模型不能凭空恢复它。先分辨是元数据过滤太严、术语不匹配、切块缺上下文，还是语料里就没有该文件；分别回到过滤、混合召回、父上下文或补充语料处理。重排只能重排已经召回的候选，不能创造缺失证据；所有通道都找不到时，说明未检索到依据比补写一个确定答案更合适。</p></div>
<div class="school-faq"><h4>Q7. 同一问题召回互相矛盾的规定怎么办？</h4><p>先检查它们是否针对相同主体、地区、时期与活动；看似冲突的内容可能只是适用条件不同。再核对来源层级、修订关系和已知效力状态。仅仅“发布时间较新”不自动证明旧文件整体失效，也不能让语言模型自行裁定复杂规范冲突。能够解释的按条件分开回答，无法消解的同时列出来源和冲突点，不强行选一个作为唯一事实。</p></div>
<div class="school-faq"><h4>Q8. 政策和安全资料为什么既要统一，又要分开处理？</h4><p>统一的是文档身份、版本、证据定位、检索协议与质量状态，这些能力能减少重复建设并使引用一致；分开的是知识的自然结构与解释规则。政策关注条件、支持方式和时间，安全规范关注适用范围、义务、参数与例外。用同一底座承载不同结构，再由问题决定消费方式，才是有机融合。</p></div>
<div class="school-faq"><h4>Q9. 结构化抽取和知识抽取是不是同一件事？</h4><p>文档结构化先回答“这是哪一章、哪一条、属于什么文档、表格有哪些列”，并提取稳定元数据；知识抽取进一步回答“某主体与某措施是什么关系、在什么条件下成立”。前者主要在离线阶段生产可追溯语料，后者在 SG-FKE 中按用户问题在线聚焦。两者可以共享模型或字段，但不能用抽到几个实体来替代文档层级与来源管理。</p></div>
<div class="school-faq"><h4>Q10. 方法有什么局限，后续怎样落地？</h4><p>它依赖初始召回，额外引入模型调用，复杂限定关系可能在三元组化时丢失，静态实验也无法覆盖文档实时变化。因此落地顺序是先把类型化结构、质量和版本数据做好，再打通统一检索与出处定位，然后接入政策 SG-FKE 与安全证据分支，最后验证混合问题的适用条件和引用。不要把研究中的上下文压缩、词语重合分数或系统能跑通，直接等同于完整业务可靠性。</p></div>
<h4>项目成果与关联研究</h4>
<ul>
<li><strong>政策问答研究：</strong>《面向低空经济政策多跳问答的知识抽取策略》材料，包含 SG-FKE、LEMQA、对比实验和消融，是本章方法与数值的依据。</li>
<li><strong>应用系统：</strong>《低空经济洞察平台产业政策智能分析系统 V1.0》，软件著作权登记号 <code>2026SR0424325</code>。系统说明包括政策处理、问答、子问题、三元组与政策分析报告；当前提供的学校项目目录是文档材料，没有该系统源代码。</li>
<li><strong>业务研究产出：</strong>《涉低空飞行器案件大数据分析及对策建议》，《司法大数据决策参考》2025 年第 5 期。</li>
<li><strong>运行安全综述：</strong>《面向低空运行安全保障的大模型技术研究综述》，SESC 2026 已录用并推荐至《系统工程理论与实践》；会议录用、期刊推荐和期刊录用是不同状态。</li>
</ul>
<p>这些成果共同体现政策与安全领域积累，但不能把报告、综述或软件著作权分别当作完整系统全部能力已经上线的证明。后续独立开展的因果证据子图研究，也不直接混入本项目已经验证的 SG-FKE 实验机制。</p>
<h4>收束与引导追问</h4>
<blockquote><p>这个项目让我更重视证据在整个链路中的形态：原始文档要保留版本和结构，检索结果要能回到条款，三元组要保留关系的条件，最终答案要能解释依据。我的核心设计是让政策和安全资料共用一个可靠底座，同时按文类保留各自的语义；在政策多跳问题上，再用子问题引导的细粒度抽取减少长文本噪声。您如果感兴趣，我可以继续展开不同文档的切分策略、SG-FKE 的证据路径，或者子问题和三元组的消融对比。</p></blockquote>

<details open><summary><span class="kicker">LEFT 01</span><h2>主管面在验证什么</h2></summary><div class="content"><div class="route"><div class="step"><strong>能否把项目讲成业务交付</strong><span>将模糊目标拆为需求、方案、依赖、验收和持续迭代，而不是只讲模型与框架。</span></div><div class="step"><strong>是否有产品与协同潜力</strong><span>与业务、研发、数据及地区团队对齐；理解功能之外的端到端业务目标。</span></div><div class="step"><strong>是否适合长期做 AI + 业务</strong><span>持续积累技术，同时理解服务业务、产品体验和结果，不定位为纯模型研发。</span></div></div><p class="note"><b>全程主线：</b>以技术为底座，以业务结果为目标。所有技术选择回到“可靠解决用户问题、减少不必要的人工转接”。</p></div></details>
<details open><summary><span class="kicker">LEFT 02</span><h2>高含金量反问：向主管学决策方法</h2></summary><div class="content"><h3>优先问：团队战略与全球化取舍</h3><div class="question"><b>1. 全球化难点（重点）</b><br>海外服务涉及地区、语言、产品线及当地法规/SOP。站在您的视角，团队目前在知识、数据或评测治理上最难的部分是什么？您通常会怎样判断哪些能力应该全球统一，哪些必须交给 region 做本地化？</div><div class="question"><b>2. 业务优先级</b><br>未来 12 个月，团队围绕 self-help 和 AI 服务转型，最希望优先解决的用户问题或业务指标是什么？在机会很多的情况下，您通常用什么标准判断一个 AI 场景值得优先投入？</div><div class="question"><b>3. 从 PoC 到正式交付</b><br>团队如何判断一个 Agent 能力可以从 PoC 进入正式交付？除了模型或任务效果外，您最看重哪些条件，例如地区流程适配、数据/权限、人工兜底或运营指标？</div><h3>深入问：向主管学习项目管理与复盘</h3><div class="question"><b>4. 最有价值的失败经验</b><br>您在推动 AI 服务产品时，是否遇到过一个技术上可行、但业务上没有达到预期的案例？后来团队是如何定位问题，并调整方向的？</div><div class="question"><b>5. 跨区域协同的关键动作</b><br>和不同 region、维修站或 IT 团队协作时，最常见的分歧或阻塞是什么？您认为一个新人最应该尽早建立的协同习惯是什么？</div><div class="question"><b>6. 衡量“解决问题”而非“回答问题”</b><br>对于自助提单、设备诊断等场景，团队现在如何平衡 self-help 解决率、转人工率、用户体验和错误风险？当这些指标出现冲突时，通常怎样做取舍？</div><h3>最后问：个人成长、晋升与全球机会</h3><div class="question"><b>7. 个人反馈与成长（重点）</b><br>从您的观察，能在团队持续成长的人通常在哪些能力上形成差异？结合我这次面试的表现，以及如果后续有机会加入，您觉得我最需要补充和提升的是什么？</div><div class="question"><b>8. 前三到六个月的成功标准</b><br>如果有机会加入，您会期待我在前三到六个月先解决或建立哪些能力？做到什么程度，说明我已经能够独立承担一个场景？</div><div class="question"><b>9. 晋升与海外机会（最后问）</b><br>团队是全球化协作的模式。想了解一下，团队对这个岗位的晋升和能力成长通常怎么看？随着责任范围扩大，是否有机会像您一样参与海外业务、跨区域项目，或获得出差、短期派驻等经历？我自己也希望把视野放得更长远一些。</div><p class="note"><b>推荐现场选法：</b>时间只够 2 个时，问 1 + 7；有 3 个时，问 1 + 3 + 7；聊到具体项目时，把 4 或 6 替换进去。第 9 个始终放在最后，用“能力成长与全球机会”切入，而不是只问职级。</p></div></details>
</aside>
<section class="column right">
<details open><summary><span class="kicker">RIGHT 01 / OPENING</span><h2>自我介绍：中文与英文</h2></summary><div class="content"><h3>中文（约 90 秒）</h3><div class="quote">面试官您好，我叫赵一恒，目前在厦门大学电子信息专业读硕士，将于明年毕业。

实习和在校项目的经历主要聚焦在 RAG、AI Agent 和 AI 应用落地。在滴滴实习时，我参与了团队内部业务信息查询 Agent 的方案和研发，负责信息查询链路和记忆系统的设计与开发，重点解决查询链路不稳定、在复杂查询中多轮调用丢进度、证据不足却直接回答的问题。

此外，我也做过低空经济政策 RAG 与知识抽取，以及 AI 模型评测和 Bad Case 分析相关项目。我也熟练使用 Claude Code、Codex 等 AI 开发工具，辅助进行需求分析、开发、测试和文档整理，并将实践方法梳理成 AI Coding SOP，分享给其他团队。我的优势是能把比较模糊的业务需求拆成可验证的 AI 能力，并和其他岗位同事协同推进落地。

我对贵公司这个岗位很感兴趣，因为 AI 知识管理本质上是把分散的信息、经验和方案沉淀成可信、可检索、可复用的资产，这和我过去做 Agent、RAG 和评测的经历高度相关。我也希望在联想的全球服务场景中，继续积累技术和业务结合的能力。</div><h3>英文（约 60-75 秒）</h3><div class="quote en">Hello, my name is Yiheng Zhao. I am currently pursuing a master's degree in Electronic Information at Xiamen University, and I will graduate next year.

My internship and academic projects have mainly focused on RAG, AI agents, and practical AI applications. During my internship at Didi, I worked on the design and development of an internal business information-querying agent. I was responsible for the information-querying workflow and the memory system. I focused on issues such as unstable query flows, losing progress during complex multi-step queries, and generating answers without enough supporting evidence.

I have also worked on a policy RAG and knowledge extraction project in the low-altitude economy domain, as well as AI model evaluation and bad case analysis. I am comfortable using AI development tools such as Claude Code and Codex to support requirement analysis, development, testing, and documentation. I also organized these practices into an AI Coding SOP and shared it with other teams.

My strength is turning broad business needs into AI capabilities that can be built and tested, and working with colleagues across different functions to move projects forward. I hope to keep developing both my technical skills and business understanding in Lenovo's global service environment.</div></div></details>
<details open><summary><span class="kicker">RIGHT 02 / MAIN PROJECT</span><h2>主项目：VSA 信息查询 Agent</h2></summary><div class="content"><div class="route"><div class="step"><strong>背景</strong><span>内部同学跨多个系统查询指标、项目和研发任务；复杂查询需要多轮工具调用。</span></div><div class="step"><strong>我的职责</strong><span>信息查询链路和记忆系统设计与开发；确认范围：内部 IM 入口、MCP 接入、信息查询 Pipeline 和记忆系统改造。</span></div><div class="step"><strong>问题与方案</strong><span>处理多轮调用丢进度、证据不足直接回答：理解/拆解 → 工具调用 → 结果归一 → 证据覆盖检查 → 补查或降级。</span></div><div class="step"><strong>验证边界</strong><span>PoC 使用 Mock → 真实数据源 → D-Chat 私聊/群聊的逐层验收。PoC、后续改造和线上效果必须分开讲。</span></div></div><h3>为什么主管会技术质疑？怎样接住</h3><div class="question"><b>“这不就是 RAG 吗？”</b><br>不完全是。还有任务拆分、跨工具查询、状态管理、结果归一、事实覆盖检查和带来源回答；RAG 只是文档知识源的一部分。</div><div class="question"><b>“为什么不让更强模型直接回答？”</b><br>强模型不能解决权限、时效、来源、执行可靠性和错误成本。日期、排序、编号、去重、权限和工具参数由代码/工具控制；LLM 负责理解、拆解、工具选择和表达。</div><div class="question"><b>“怎么证明准确？”</b><br>区分 PoC 可行性、离线评测、小范围试用和生产反馈。74 题覆盖事实、合规与兜底；没有核验的整体通过率就不报。</div><div class="question"><b>“幻觉怎么看？”</b><br>LLM 是概率生成；检索缺失、上下文冲突/过期、工具不完整和无校验都会造成无依据回答。用来源/版本/权限、重排、工具校验、引用、拒答或转人工、回归评测闭环降低风险。</div></div></details>
<details open><summary><span class="kicker">RIGHT 03 / LENOVO CONTEXT</span><h2>联想团队：真实业务与主管可能提问</h2></summary><div class="content"><h3>一、一面了解到的团队情况</h3><div class="route"><div class="step"><strong>团队定位：海外售后服务的 AI 转型</strong><span>隶属 SSG 下的 SISS/International Service，负责中国区以外的硬件、软件和服务产品售后支持。面试官所在小团队约 10 人，主要做 chat 相关的售后机器人/智能客服。</span></div><div class="step"><strong>服务入口：eService 自助渠道</strong><span>用户可通过网站、社交媒体和预装软件获得服务。业务目标不是单纯上线聊天功能，而是把原本需要人工客服处理的问题，尽可能在 self-help 渠道中解决。</span></div><div class="step"><strong>已做项目：MCP + Agent 的售后服务</strong><span>团队已探索不同 Agent 调用不同系统、执行任务的模式，具体包括自助提单、设备诊断等。它从早期客服能力叠加大模型，发展到 MCP/Agent 架构。</span></div><div class="step"><strong>正在探索：B 端与多模态服务</strong><span>本财年还在看 Agent 是否能服务 B 端客户，以及实时语音、桌面共享、摄像头识别硬件故障等 UI/UX 能力是否能提升服务体验。</span></div><div class="step"><strong>全球化约束：地区差异不能被忽略</strong><span>不同 region 的法律法规、语言、服务方式、维修站和当地 SOP 不同。例如自动提单后如何分发给维修站，需要结合当地实际流程。团队要先收集区域需求，再推动自动化和 AI 化。</span></div><div class="step"><strong>岗位角色：端到端方案与迭代</strong><span>To C 生产开发主要由内部 IT/子公司承担安全和工程交付；这个岗位更深度参与需求梳理、方案设计、研发协同、交付后的精度优化，也可用低/无代码 Agent 做内部提效。</span></div></div><p class="note"><b>你对团队的理解：</b>这是一个“全球服务业务 + AI 产品方案”的岗位。核心不在于堆技术，而在于把各地区真实服务流程、知识和系统能力组织起来，让更多用户问题可靠地在自助渠道解决。</p><h3>二、站在二面 Director 的视角：可能问什么</h3><div class="question"><b>Q1. 你如何理解我们团队当前的业务？你觉得最难的点在哪里？</b><br>他想确认：你是否听懂一面介绍，能否从“做 Agent”上升到“全球服务转型”。</div><div class="question"><b>Q2. 如果让你参与全球自助提单/设备诊断，你会怎样从需求开始推进？</b><br>他想确认：你是否会做需求收集、跨地区协同、方案拆解和交付验收，而不是上来就讲模型。</div><div class="question"><b>Q3. AI 客服或 Agent 做得好，应该怎么衡量？</b><br>他想确认：你是否以业务结果衡量 AI，而不只谈模型准确率。</div><div class="question"><b>Q4. 对语音、桌面共享、摄像头诊断这些新能力，你会怎么判断是否值得做？</b><br>他想确认：你是否具备产品判断和技术取舍，能避免为了多模态而多模态。</div><div class="question"><b>Q5. 全球各地区 SOP 和合规要求不一致，如何保证方案可复制又能落地？</b><br>他想确认：你对全球化、权限、流程和治理复杂度是否有现实认识。</div><h3>三、详细回答思路：按“目标 → 动作 → 验收/风险”展开</h3><div class="question"><b>Q1 回答：理解团队业务与难点</b><br><b>目标：</b>提升 self-help，减少低价值人工转接，让客服资源聚焦复杂问题。<br><b>难点：</b>不是单一模型效果，而是跨地区流程和知识不一致、跨系统执行的可靠性、以及售后错误的风险。<br><b>我的切入：</b>我做过内部信息查询 Agent，理解“模型会回答”不等于“业务可用”。我会先梳理高频问题、知识/系统来源、地区差异和人工兜底，再通过评测和小范围验证迭代。</div><div class="question"><b>Q2 回答：如何推进自助提单或设备诊断</b><br><b>第一步，收集与分层：</b>和 region、客服、维修站确认用户旅程，拆出全球共性步骤和地区差异规则。<br><b>第二步，确定边界：</b>明确哪些信息由用户提供、哪些由系统查询；哪些条件可自动提单，哪些必须追问或转人工。<br><b>第三步，设计与协同：</b>将规则、接口、异常处理、权限和交付责任写进方案，与 IT/研发共同验收。<br><b>第四步，灰度与复盘：</b>先从高频、低风险地区或场景验证；看任务完成率、转人工率、错误工单和用户反馈，再按 bad case 优化。</div><div class="question"><b>Q3 回答：如何衡量 AI 客服价值</b><br><b>业务指标：</b>self-help 问题解决率、转人工率、重复咨询率、用户满意度和处理时长。<br><b>质量指标：</b>事实/政策准确性、来源引用正确性、工具调用与工单执行正确性。<br><b>风险指标：</b>错误提单、错误诊断、合规违规和不恰当转人工。<br><b>方法：</b>离线回归集 + 小范围灰度 + 线上反馈，将问题归因到知识、检索、工具、Agent 规划或生成环节。</div><div class="question"><b>Q4 回答：是否做多模态能力</b><br><b>先判断需求：</b>用户是否确实因文字无法描述故障、或缺少证据导致无法自助。<br><b>再验证可行性：</b>选一个高频具体问题做 PoC，比较文字与语音/图像方案在解决率、时延和人工转接上的差异。<br><b>最后守住边界：</b>提前评估用户授权、隐私、地区合规、识别准确度和人工接管；没有明确业务增益就不扩大投入。</div><div class="question"><b>Q5 回答：全球方案如何兼顾复制与本地落地</b><br><b>统一：</b>沉淀共性的意图、数据字段、评测口径、接口规范和安全底线。<br><b>配置：</b>把语言、法规、SOP、服务网点和工单路由做成地区配置，而不是写死在同一条流程里。<br><b>治理：</b>每个地区明确知识/流程责任人和版本机制；分地区灰度发布、监控和回滚，保留人工兜底和可追溯记录。</div></div></details>
<details open><summary><span class="kicker">RIGHT 04 / PERSONAL REVIEW</span><h2>个人复盘与规划（中文）</h2></summary><div class="content"><h3>最大挑战：从未知业务到方案落地</h3><p>滴滴实习期间，我面对的是此前没有接触过的业务，需求方最初提出的需求也比较模糊，因此挑战不只是开发，而是逐步完成需求拆解。从最初梳理需求，到形成完整设计方案，再到最终开发实现，中途方案也出现过偏差。后续我通过和需求方深入讨论，并与组长持续对齐颗粒度，逐步纠正并顺利落地。这个过程让我认识到，面对未知业务时，先理解场景、持续校准方案比急于进入实现更重要；也很感谢组长和领导在这个阶段提供的指导。</p><h3>低谷期：一段多重压力并存的时期</h3><p>我不把它定义为真正的低谷，更像一段“奥德赛时期”。当时同时面对论文、秋招、实习工作和对转正的不确定感，多重压力曾影响工作效率。我会通过健身等方式保持工作与生活的平衡，主动调整节奏，最终平稳度过。这段经历让我更清楚地认识到，面对长期压力时，稳定的生活习惯和节奏管理很重要。</p><h3>不足与自我剖析</h3><p><b>易感性思考与专业表达：</b>我感觉自己的一个劣势是容易进行易感性思考，在面对不确定问题时，早期有时会更关注个人感受和担忧。后续在实习中，我有意识地用事实和结果来建立专业表达：汇报时尽量使用量化数字、进度、风险和下一步，而不是停留在主观判断上；遇到问题也先梳理证据和解决方案，再向团队同步。<br><b>工作沟通与向上管理：</b>我和同事私下相处融洽，但在工作沟通上还需要更主动，例如更频繁地汇报进展、尽早暴露风险、站在负责人角度思考他关心的目标和节奏。<br><b>决策果断度与工作思维：</b>在最终拍板时有时会犹豫，决断力仍需加强。这也和从学生思维转向工作思维有关：最初的调研和选型阶段，我有时会更关注“这个项目/Agent 本身是否优秀”，但一个好的项目不代表它就是最适合当前业务的方案。后续我逐渐把目标、约束和业务指标放在前面，先明确要解决的问题，再比较方案的适配度、成本、可扩展性和交付风险，最终选择最适合业务目标的 Agent 项目。滴滴实习后期，我通过及时对齐决策标准、限定判断时间和复盘结果，持续改进自己的决断力。</p><h3>未来规划：研发以业务为导向</h3><p>我希望成为懂技术、也能对业务结果负责的 AI 应用与解决方案型人才。技术上持续积累 RAG、Agent、评测和可信 AI 能力；业务上深入全球服务场景，打通从需求拆解、协同交付到持续迭代的完整链路。前 2-3 年，我会先扎进具体业务域，在实践中持续成长，并沉淀自己的方法论和知识资产。</p><h3>工作中最擅长的</h3><p><b>面对陌生业务主动学习：</b>愿意研究业务背景和问题本质，从不了解的领域逐步形成解决方案。<br><b>结构化解决复杂问题：</b>能把问题拆成流程、模块、状态、验收标准和具体实现，并推动方案落地。<br><b>压力下保持稳定：</b>在论文、秋招和实习任务并行时，能够调整节奏，持续完成重要任务。<br><b>重视规范、细节和质量：</b>关注证据、边界、来源、验收和可追溯性，这与企业 AI 知识管理场景比较匹配。</p><h3>工作中最不擅长的</h3><p><b>易感性思考影响专业表达：</b>面对不确定信息或他人反馈时，早期容易先从主观感受出发。后续在实习中有意识地用进度、量化数字、风险和下一步进行汇报，而不是只描述感受。<br><b>决策果断度不足：</b>早期调研和选型时，容易把“项目本身优秀”和“最适合当前业务”混在一起。现在会先明确业务目标、约束和验收标准，再比较方案的适配度、成本、可扩展性和交付风险，并在信息足够时及时做决定。这个过程也是从学生思维转向工作思维的过程。</p><h3>性格优势</h3><p>求知欲和洞察力较强，愿意探索陌生领域；情绪相对稳定、抗压能力较好；对自己有一定信心，遇到质疑不会轻易自我否定；重视规则、细节和质量；愿意听取他人意见并持续完善方案。</p><h3>性格劣势</h3><p>容易从主观感受出发思考，需要加强基于事实和数据的表达；做决策时容易反复权衡；工作汇报和向上管理还不够主动；有时更关注把自己的事情做好，需要加强主动解释、推动共识和长期业务视角。</p><p class="note"><b>面试总结说法：</b>我的优势是面对陌生业务时有较强的学习和分析能力，能够把复杂问题逐步拆解并落成可执行方案，同时在压力下保持稳定。我的不足主要是早期容易受主观感受影响，决策时也会反复权衡。实习过程中，我在刻意训练自己用量化信息汇报、主动做好向上沟通，并从“追求一个好方案”转向“基于业务目标选择最适合的方案”。</p></div></details>
<details open><summary><span class="kicker">RIGHT 05 / KNOWLEDGE SHARING</span><h2>对外输出：AI Coding SOP 与工具实践</h2></summary><div class="content"><p>我不只是把 AI 工具用于个人提效，也把实践过程整理为可复用的 SOP、工具分享和检查清单，帮助其他同学从“随口让 AI 写代码”转向“有上下文、有验证、可交接”的工作方式。</p><h3>一、AI Coding SOP：把 AI 开发变成可复用的工程流程</h3><div class="route"><div class="step"><strong>解决的问题</strong><span>一句话把需求交给 AI 时，AI 容易猜业务、跳过澄清、扩大改动范围，最后即使代码能跑，也难以证明满足真实验收要求。</span></div><div class="step"><strong>核心方法</strong><span>“不要直接让 AI 写代码”：先补足项目、需求、接口、验收标准和验证方式等输入包；Cooper 负责读取内部 PRD、方案、接口和历史决策，Superpowers 负责需求澄清、方案比较、计划、分阶段实现和交付前验证。</span></div><div class="step"><strong>8 阶段闭环</strong><span>规划知识沉淀 → 拉取内部上下文 → 澄清需求 → 比较方案 → 编写计划 → 分阶段开发 → 完整验证 → 交付总结与接手包。前一阶段产出未确认，不进入下一阶段。</span></div><div class="step"><strong>工程质量底线</strong><span>把正常、异常、边界和不可破坏旧行为写成验收标准；测试通过不等于交付完成，还要记录验证命令、覆盖范围、未覆盖风险、回滚方式和知识沉淀。</span></div><div class="step"><strong>可验证的推广思路</strong><span>设计“流程化输入”与“一句话输入”的对比实验，关注验收通过率、异常覆盖、计划外改动、返工次数、一次过审率、关键路径覆盖及方案/回滚完整度。</span></div></div><p class="note"><b>主管可感知的价值：</b>这套 SOP 与联想岗位很贴合。它不是教大家更快生成代码，而是让业务需求、方案、研发协同、验证和知识资产形成可追溯闭环，适合低/无代码 Agent 和 AI 产品迭代场景。</p><h3>二、AI 工具分享：按真实工作闭环组织，不是工具清单</h3><div class="question"><b>1. 信息与知识进入 AI：让 AI 有正确上下文</b><br><b>实践：</b>用公众号订阅采集工具建立本地技术语料库，已订阅 10 个大厂技术公众号、积累 500+ 篇带元数据文章；下游用于 AI Coding SOP 的可追溯参考，以及资讯摘要推送。用 D-Chat 消息读取和内部数据工具，让 AI 结合群消息、PRD、表格和数据理解项目，而不是只靠人工转述。<br><b>方法论：</b>工具本身不是价值，关键是把分散文档、群消息和数据转成可检索、可引用、可复用的知识资产。</div><div class="question"><b>2. 工程执行与验证：让 AI 做事有边界、有证据</b><br><b>实践：</b>使用 Claude Code、Codex 做需求分析、开发、测试和文档；Playwright MCP 用于网页信息核对、登录流程自动化和截图验证；cmux 支持同时推进 2-3 个相互独立任务；行为规范类 skill 约束 AI 先对齐再动手、只修改相关范围，使 diff 更易 review。<br><b>方法论：</b>AI 可以并行提效，但要通过任务边界、阶段检查、浏览器验证和人工复核控制风险。</div><div class="question"><b>3. 数据到洞察再到交付：让结果能被业务使用</b><br><b>实践：</b>验证数据库 MCP、联邦查询与语义指标层的用法：先把数据源或指标口径做成受控接口，再让 Agent 查询；查询结果可直接调用图表 MCP 产出周报图表。也使用 draw.io skill 将口头方案转为可编辑的架构图/流程图，例如“评测导向 Agent 迭代全景图”。<br><b>方法论：</b>对业务数据不让 AI 任意猜 SQL 或口径，而是通过参数化工具、指标层、可视化和来源链路提升可控性与可解释性。</div><p class="note"><b>面试中 30 秒说法：</b>“我分享工具时不会只讲‘这个工具好用’，而是按工作流讲：先让 AI 获得可靠上下文，再让它在工程边界内执行和验证，最后把数据、图表、文档沉淀为团队可以复用的输出。这样工具能力才能真正服务于业务交付。”</p><h3>三、前端美化（简写）</h3><p>我还做过 AI 前端美化实践分享：不让 AI 凭默认审美自由发挥，而是先从参考页面提炼颜色、字体、间距、圆角等设计 Token，再约束 AI 只改样式、不改业务逻辑；完成后检查交互状态、可访问性、响应式和页面截图差异。核心是将“好不好看”转为可检查的设计规范与交付验证。</p></div></details>
<details open><summary><span class="kicker">RIGHT 06 / CLOSING</span><h2>英文总结与结束前检查</h2></summary><div class="content"><h3>英文面试总结（45 秒）</h3><div class="quote en">Thank you for the interview. Today we discussed my experience in building an internal information-querying agent at Didi, especially how I translated a broad business request into a verifiable workflow with tool calls, evidence checks, and source-based answers. We also discussed Lenovo's global service scenarios and the goal of improving self-service for customers. I believe my experience in RAG, agent development, evaluation, and cross-functional collaboration is relevant to this role. I am particularly interested in learning the service domain deeply and contributing to reliable AI solutions from requirement definition to iteration.</div><h3>通用英文总结模板（约 45 秒，聊什么都可用）</h3><div class="quote en">Thank you for the conversation today. It was really helpful to learn more about Lenovo's global service team and the challenges of building AI solutions across different regions. I shared my experience with an internal information-querying agent at Didi, where I worked on making multi-step queries more reliable and evidence-based. I also talked about how I learn from project challenges and keep improving my communication and decision-making. This role matches what I want to do: use AI skills to solve real business problems and grow through end-to-end delivery. Thank you again.</div><h3>结束前检查</h3><p><span class="tag">主项目 2 分钟</span><span class="tag">个人贡献有边界</span><span class="tag">每个数字带口径</span><span class="tag">有真实阻塞案例</span><span class="tag">英文短句慢速</span></p><p class="note">避免“模型很强”“效果不错”这类空话。改为说明证据、验收方式、业务风险、已验证范围和下一步。</p></div></details>

    const hr=[['HR 面验证什么','动机是否稳定、沟通是否可靠、是否能客观看待自己，并且和岗位长期发展匹配。','回答重点：不把 HR 面当成背稿，围绕真实经历说明选择、行动和成长。'],['自我介绍','教育背景 + 实习经历 + 求职方向。','我叫赵一恒，目前在厦门大学电子信息专业读硕士，将于明年毕业。我的经历主要聚焦 RAG、AI Agent 和 AI 应用落地，在滴滴参与过业务信息查询 Agent 的方案和研发，也做过政策 RAG、知识抽取和 AI 模型评测。我希望从事研发以业务为导向的 AI 应用与解决方案工作。'],['工作中最擅长的','陌生业务学习、结构化拆解、压力下保持稳定、重视证据和质量。','我擅长面对陌生业务主动学习，把复杂问题拆成流程、模块、状态和验收标准，并推动方案落地。'],['工作中最不擅长的','易感性思考、主动汇报、向上管理和决策果断度。','我早期面对不确定问题时容易先关注主观感受，决策时也会反复权衡。实习中我刻意使用量化数字、进度、风险和下一步进行汇报；选型时先明确业务目标，再比较适配度、成本、可扩展性和交付风险。'],['最大挑战','未知业务和模糊需求下完成需求拆解、方案设计与落地。','通过和需求方深入讨论、与组长对齐颗粒度，纠正方案偏差并顺利落地。'],['低谷期','论文、秋招、实习和转正焦虑并行。','我把它看作一段多重压力并存的“奥德赛时期”，通过健身和调整节奏保持 Work-life balance，最终平稳度过。'],['未来规划','研发以业务为导向，成为能对业务结果负责的 AI 应用与解决方案型人才。','前 2—3 年扎进具体业务域，持续积累 RAG、Agent、评测和可信 AI 能力，打通需求拆解、协同交付到持续迭代的完整链路。'],['薪资期望','先了解薪酬结构，再结合市场带宽给出期望区间；预算受限时继续讨论整体 package。','<b>第一步：反问薪酬结构：</b>我想先了解下咱们这边的薪酬结构：底薪、绩效、股票、签字费分别是怎么安排的。<br><br><b>第二步：抛出市场数据：</b>我了解到这个岗位或者这个 base 地的相关其他岗位在市场上的中位数大概是多少多少，我想知道咱们这边的带宽大概是多少。<br><br><b>第三步：给范围不单点：</b>基于我的经验和市场行情，我的期望是 x 到 y 之间，上限是我真正想要的，下限是留给 HR 砍的。<br><br><b>如果 HR 说已经到预算上限了：</b>我理解公司的预算限制，但我更看重岗位的成长空间和整体 package，除了底薪，绩效系数、股票部分有没有调整空间。'],['反问','团队培养、岗位期待和反馈机制。','如果有机会加入，您希望我前三个月先建立哪些能力？结合今天的表现，您觉得我最需要补充和提升的是什么？']];

    const lenovoHrbpModule=`<section class="role-special" aria-label="岗位专项：联想 HRBP 面"><div class="role-special-head"><h4>岗位专项：联想 HRBP 面</h4><p>三面 HRBP 面为 1v1 形式：面试官介绍 → 自我介绍 → 面试官提问 → 最后反问。前两组先记录问题，等补充岗位 JD 和个人经历后再定制答案。</p></div><div class="role-special-body"><section class="role-group"><h5>一、本次预约的联想 HRBP 面 · 问题集</h5><ol><li>为什么选这个岗位？</li><li>对该岗位的理解和了解。</li><li>如果能加入联想，面对多问题、多方压力的处理，你会怎样协调自己的精力？</li><li>团队合作中你的角色是什么？</li><li>对 base 地的意向。</li><li>有没有其他 offer？</li></ol></section><section class="role-group"><h5>二、其他 HRBP 面经 · 仅记录问题</h5><ol><li>自我介绍。</li><li>你使用 AI 的项目技术亮点是什么？解决了什么问题，有没有实用价值，有没有量化的数据？</li><li>对前公司的技术氛围评价怎么样？</li><li>前 mentor 对你的评价怎么样？</li><li>你对联想这个部门的了解是什么？</li><li>到岗时间，家是哪里的？</li><li>有没有别的 offer？</li></ol></section><section class="role-group core"><h5>三、HRBP 高频核心题 · 问题与高分答案</h5><p class="logic">HRBP + HR：不拼纯专业知识，更多是拼业务理解前提上的专业 + 协同闭环。</p><p><b>1. 你如何处理业务矛盾？</b></p><p class="logic">底层逻辑：先诊断 → 再对齐 → 再落地</p><ul><li>不说空话：先倾听业务痛点、数据现状、核心诉求；</li><li>不站队：客观分析矛盾根源（目标 / 资源 / 流程）；</li><li>给方案：输出可落地的协调动作 + 预期结果。</li></ul><p class="high-score"><b>一句话高分答法：</b><br>我会先深入业务一线，厘清矛盾背后的真实诉求与数据；再对齐双方目标，找到共赢点；最后推动落地并闭环跟进，用结果解决矛盾。</p><p><b>2. 跨部门协同推动不动，你怎么办？</b></p><p class="logic">底层逻辑：结果导向 + 责任闭环 + 价值赋能</p><ul><li>不抱怨：明确协同目标、责任边界、关键节点；</li><li>不等待：主动拉通、同步进度、暴露风险；</li><li>给价值：用数据 / 结果证明协同价值，减少阻力。</li></ul><p class="high-score"><b>一句话高分答法：</b><br>我会先明确协同目标与责任，主动拉通各方对齐；过程中同步进度、闭环风险；最终用业务结果体现协同价值，推动跨部门高效配合。</p><p class="high-score"><b>HRBP 的核心：</b>是懂业务、能协同、拿结果。面试不是表演，是真实能力的呈现。</p></section></div></section>`;
    const offerLedger=`<div class="offer-ledger" aria-label="公司薪资结构记录"><div class="offer-ledger-head"><div><h4>Offer 数据库 · 欣旺达</h4><p>第一条公司薪资结构记录：把确定口径、个人推算和待确认事项分开。</p></div><span class="offer-status">谈薪中 · Base 待确认</span></div><div class="offer-ledger-body"><div class="offer-ledger-grid"><section class="offer-card"><h5>月薪结构 · 当前 HR 报价</h5><div class="offer-content"><div class="offer-line"><span>基础工资 Base</span><strong>17.5K / 月</strong></div><div class="offer-line"><span>绩效工资基数</span><strong>3.5K / 月</strong></div><div class="offer-line"><span>B 级绩效系数</span><strong>0.85</strong></div><div class="offer-line"><span>B 级绩效工资</span><strong>3.5K × 0.85 = 2.975K</strong></div><div class="offer-highlight">正常 B 绩效月薪：20.475K 税前 / 月</div></div></section><section class="offer-card"><h5>年度收入 · 口径待确认</h5><div class="offer-content"><div class="offer-line"><span>12 个月正常工资</span><strong>约 245.7K</strong></div><div class="offer-line"><span>年终奖制度</span><strong>0–3 个月岗位工资</strong></div><div class="offer-line"><span>正常年终预期</span><strong>约 1 个月 Base</strong></div><div class="offer-line"><span>粗略年收入</span><strong>约 245.7K–298.2K</strong></div><div class="offer-ledger-note">年终奖制度范围为 0–3 个月岗位工资，正常情况下通常按 1 个月理解，也就是常说的 13 薪；具体发放基数是 Base 还是含绩效，仍需向 HR 确认。</div></div></section><section class="offer-card"><h5>试用期 · 按转正口径 90%</h5><div class="offer-content"><div class="offer-line"><span>试用期 Base</span><strong>15.75K / 月</strong></div><div class="offer-line"><span>试用期绩效基数</span><strong>3.15K / 月</strong></div><div class="offer-line"><span>假设 B 绩效工资</span><strong>2.6775K / 月</strong></div><div class="offer-highlight">假设 B 绩效月薪：约 18.4275K 税前 / 月</div></div></section><div class="offer-table-wrap"><table><thead><tr><th>五险一金项目</th><th>个人比例</th><th>公司比例</th><th>8000 基数下个人 / 月</th><th>8000 基数下公司 / 月</th></tr></thead><tbody><tr><td>养老</td><td>8%</td><td>14%</td><td>640</td><td>1120</td></tr><tr><td>医疗</td><td>2%</td><td>6%</td><td>160</td><td>480</td></tr><tr><td>失业</td><td>0.3%</td><td>0.7%</td><td>24</td><td>56</td></tr><tr><td>工伤</td><td>0%</td><td>0.63%</td><td>0</td><td>50.4</td></tr><tr><td>住房公积金</td><td>5%</td><td>5%</td><td>400</td><td>400</td></tr><tr><th>合计</th><th>15.3%</th><th>26.33%</th><th>约 1224</th><th>按比例约 2106；材料口径约 2200</th></tr></tbody></table><p class="offer-ledger-note"><b>五险一金重点：</b>硕士入职按 8000 元基数缴纳，不是按 17.5K Base 或 20.475K 实际月薪全额缴纳。制度材料称转正后结合年度调整窗口和公司规划调整基数，具体是否接近实际工资仍待确认。</p></div><section class="offer-card"><h5>福利与工作规则</h5><div class="offer-content"><span class="offer-flag">无房补</span><span class="offer-flag">免费三餐</span><span class="offer-flag">研发周末可调休</span><span class="offer-flag">工作日责任制</span><p>工作日晚间延长工作时间原则上无额外加班费和调休；研发、职能周末加班原则上可调休。需要继续确认团队实际加班频率、调休申请和有效期。</p></div></section><section class="offer-card"><h5>谈薪状态</h5><div class="offer-content"><div class="offer-line"><span>当前方案</span><strong>17.5K Base + 3.5K × 0.85</strong></div><div class="offer-line"><span>个人诉求</span><strong>Base 提高至 20K</strong></div><div class="offer-line"><span>20K 推算月薪</span><strong>约 23.4K，未确认</strong></div><div class="offer-line"><span>SP / SSP</span><strong>HR 表述为无此档位</strong></div></div></section></div><div class="offer-pending"><b>待向 HR 核对：</b><ul><li>绩效基数到底按 Base 的 20% 还是制度材料中的硕士 25% 计算，为什么当前报价是 3.5K。</li><li>年终正常按 1 个月理解；具体发放基数是 Base 还是含绩效。</li><li>转正后五险一金基数的调整规则、时间窗口和实际执行口径。</li><li>研发周末调休是否容易申请，是否有有效期或年底清零限制。</li></ul></div></div></div>`;
    const offerReplies=`<section class="offer-replies" aria-label="Offer 状态回复话术"><div class="offer-replies-head"><h4>Offer 状态回复话术</h4><p>收到 Offer 后，根据当前决定选择对应回复。</p></div><div class="offer-replies-grid"><article class="offer-reply"><h5>1. 确认接受 Offer</h5><p>很荣幸收到贵公司的 offer，之后入职有什么不清楚的地方，还要麻烦您多提点，期待以后与您共事，谢谢！</p></article><article class="offer-reply"><h5>2. 打算对比再做决定</h5><p>很荣幸收到贵公司的 offer，稍后再详细阅读，因为最近有些事情，我会在三天内回复您，好吗</p></article><article class="offer-reply"><h5>3. 拒绝 Offer</h5><p>很荣幸收到贵公司的 offer，但是我已经接受别公司的 offer 了，很遗憾错过了这个机会，这段时间辛苦您忙前忙后安排面试，实在不好意思，希望未来有缘再来贵司</p></article><article class="offer-reply"><h5>4. 挽回已拒绝的 Offer</h5><p>HR 您好，请问之前贵公司面试的岗位有人入职了吗？经过这段时间的慎重对比梳理，我认为贵公司的业务方向、团队氛围更契合我的长期职业规划，如果该岗位目前名额还未敲定，我能不能再试试呢？给您添麻烦了，期待您的回复，感谢！</p></article></div></section>`;
    const salaryScript=`<section class="salary-script" aria-label="谈薪话术"><div class="salary-script-head"><h4>谈薪话术</h4><p>以图片中的原话为准</p></div><div class="salary-script-body"><p>我的话术是，我会结合平台业务的发展空间、企业文化、城市等因素综合考量，不会只看薪资，毕竟不同 offer 城市生活成本啥的也都不一样。</p><p>所以我不会比较薪资绝对值，但是我会比较看重公司给我开的薪资的相对情况，在我心里这代表着对我的认可度。我希望跟未来进入的公司是双向奔赴的，彼此都非常认可对方的价值，然后共同创造未来。<br>我非常希望能够加入 xxx，非常看好 xxx，也非常有信心能在这里贡献我的价值，所以我也希望公司能同样认可我，有诚意。</p><div class="salary-pressure"><h5>HR 常见压力问题</h5><div class="salary-pressure-item"><p><b>HR 问：</b>你还有其他 offer 吗</p><p><b>我：</b>（不直接回答）目前呢有在同步几家，也有在沟通阶段的一个机会。不过我更看重岗位的匹配度和成长空间，如果这边更合适，我会优先考虑的。</p></div><div class="salary-pressure-item"><p><b>HR 问：</b>我为什么要录用你（压力测试）</p><p><b>我：</b>（这里的细节内容我后续会补，冷静地把自己的技术优势、项目经验还有跟岗位的匹配度说的清清楚楚，顺带解释之前的技术经验怎么样转移到意向公司业务上面去）</p></div><div class="salary-pressure-item"><p><b>HR 问：</b>如果给不到预期薪资怎么办</p><p><b>我：</b>薪资我有一个预期取区间，但更看重整体的机会，如果说是岗位匹配发展空间合适，我也是可以综合评估的（要又体面又有分寸）</p></div></div></div></section>`;
    const businessStages = `<section class="stage-panel" aria-label="业务面通用思维导图">
      <h3>业务面通用主线 · 持续累积</h3>
      <div class="stage-grid">
        <div class="stage-card"><b>01 · 自我介绍</b><p>把背景、主项目、技术方向和岗位价值连成一条主线，主动把面试引向准备最充分的内容。</p></div>
        <div class="stage-card"><b>02 · 项目拷打</b><p>证明项目真实做过：讲清业务问题、个人边界、技术机制、验证证据、方案取舍与不足。</p></div>
        <div class="stage-card"><b>03 · 技术追问</b><p>围绕简历技术栈继续下钻，包括八股、Agent、RAG、工程基础、算法题及安全可靠性；完整题库见左侧“八股题库”。</p></div>
        <div class="stage-card"><b>04 · 反问</b><p>确认团队真实业务、岗位成功标准和成长空间，同时展示对业务与技术的长期判断。</p></div>

      <details open><summary>二、AI Agent 核心与工具调用 <small>重中之重</small></summary><div class="qa-list">
        <div class="qa"><b>3. AI 和 AI Agent 的区别是什么？</b><p><strong>Answer：</strong>AI 是能力或模型的总称，通常针对一次输入生成输出；Agent 是把模型放进一个面向目标的闭环系统，能够理解任务、规划步骤、调用工具、读取结果、更新状态并决定继续还是结束。模型是 Agent 的推理组件，但 Agent 还需要工具、状态、记忆、权限和评测。</p></div>
        <div class="qa"><b>4. Agent 的核心组成模块有哪些？</b><p><strong>Answer：</strong>至少包括模型、任务理解与路由、规划或决策、工具注册与执行、上下文和记忆、状态机或 Agent Loop，以及权限、异常处理、日志和评测。生产系统还要有超时重试、成本预算、人工兜底和可观测性。</p></div>
        <div class="qa"><b>5. ReAct 的完整执行流程是什么？</b><p><strong>Answer：</strong>模型先基于目标和上下文形成下一步判断，再选择直接回答或调用工具；工具返回 Observation 后，结果被放回上下文，模型继续判断下一步，直到满足终止条件。工程上不应把隐式思维链直接暴露，而应显式维护任务状态、工具记录和可审计的观察结果。</p></div>
        <div class="qa"><b>6. Function Calling 的实现原理和完整闭环是什么？</b><p><strong>Answer：</strong>服务端先把工具名称、参数 JSON Schema 和说明交给模型；模型返回结构化的工具调用请求，应用层校验名称、参数和权限后执行函数，再把工具结果以 tool message 回传给模型，模型最终生成答案。闭环是工具声明 → 模型决策 → 参数校验 → 执行 → 结果回填 → 继续决策或结束。</p></div>
        <div class="qa"><b>7. Tool Calling 与 Skills 的区别和联系？</b><p><strong>Answer：</strong>Tool Calling 是一次具体的函数调用协议，强调“调用哪个工具、传什么参数”；Skill 是面向某类任务的可复用能力封装，通常包含提示词、流程、工具组合、输入输出约束和验收标准。Skill 可以内部调用一个或多个工具，工具是原子执行能力，二者不是同一层级。</p></div>
        <div class="qa"><b>8. MCP 的核心概念、作用和用途是什么？</b><p><strong>Answer：</strong>MCP 是连接模型应用与外部能力的标准协议。MCP Server 暴露 tools、resources、prompts 等能力，MCP Client 负责发现、选择和调用，应用层仍负责权限和生命周期。它的价值是统一接入方式、降低工具适配成本，让 Agent 能在受控边界内访问数据库、文件、业务 API 或其他服务。</p></div>
        <div class="qa"><b>9. MCP 的核心原理、架构分层和工作流程是什么？</b><p><strong>Answer：</strong>架构可分为 Host/Agent 应用、Client 连接层和 Server 能力层。启动时 Client 与 Server 建立会话并协商能力，随后发现工具和资源的 schema；模型产生调用意图后由 Client 发起请求，Server 执行并返回结构化结果，Client 再把结果交给 Agent Loop。协议标准化了通信，不替应用层承担业务权限。</p></div>
        <div class="qa"><b>10. 如何让大模型稳定输出结构化内容？</b><p><strong>Answer：</strong>优先使用原生 JSON Schema、structured output 或严格的 tool calling；再配合清晰字段定义、枚举约束、示例和少量重试。服务端必须做 JSON 解析、schema 校验、字段补全和错误回退，不能因为模型“看起来像 JSON”就直接入库。复杂输出可拆成多个小结构，降低一次生成的自由度。</p></div>
        <div class="qa"><b>11. Agent 接入第三方工具有哪些安全风险，如何控制？</b><p><strong>Answer：</strong>主要风险有越权访问、提示注入诱导调用、参数注入、敏感数据外泄、恶意或副作用操作、供应链风险和不可审计。控制方式包括工具白名单与最小权限、用户和租户隔离、参数与结果校验、敏感信息脱敏、沙箱、超时限流、幂等键、审计日志，以及写操作的人工确认。</p></div>
        <div class="qa"><b>12. Agent 系统中意图路由怎么实现？</b><p><strong>Answer：</strong>先定义互斥且可验收的意图集合和边界，结合规则、关键词、轻量分类模型或 LLM structured output 做分层路由。高置信的确定性场景直接走固定链路，低置信或多意图场景追问或进入通用 Agent。评估要看路由准确率、拒识率、误路由成本和端到端任务成功率，而不只看分类准确率。</p></div>

        <div class="qa"><b>21. 上下文窗口有限时有哪些管理策略？</b><p><strong>Answer：</strong>优先保留系统约束、原始目标、未完成任务、关键证据和近期对话；对旧对话和大体积工具结果做摘要、裁剪或外置存储，按需检索回来。还可以限制工具返回字段、分阶段执行、设置 token 预算和上下文占用阈值，并通过回归题验证压缩是否丢失关键约束。</p></div>
        <div class="qa"><b>22. 工具调用和工具结果在上下文中怎么管理？</b><p><strong>Answer：</strong>调用记录至少包含工具版本、参数摘要、权限、耗时、状态和错误；结果统一为结构化 Observation，保留来源、时间范围和可引用证据。大结果不要原样反复塞入上下文，应摘要或落盘后按 ID 引用；失败要明确标记，不能把空结果伪装成事实。</p></div>
        <div class="qa"><b>23. Skills 的设计原则是什么？Skills 多时怎么处理？</b><p><strong>Answer：</strong>Skill 应围绕一个清晰目标，定义输入、输出、前置条件、工具边界、失败处理和验收标准；强耦合步骤封装成复合 Skill，可跨场景复用的能力拆成原子 Skill。数量多时用领域分层、元数据检索和按需加载，只向模型暴露候选子集，并持续评估选择准确率、重复能力和维护成本。</p></div>
        <div class="qa"><b>24. Query 改写出错跑偏怎么办，如何评估？</b><p><strong>Answer：</strong>保留原问题和显式约束，改写结果必须经过 schema、实体、时间、范围和意图覆盖校验；低置信时回退原问题或向用户澄清。评估既看改写与标注目标的语义/槽位一致率，也看召回 Recall、答案正确率、任务成功率和错误改写带来的业务损失，不能只看文本相似度。</p></div>
      </div></details>
      <details open><summary>四、RAG 检索与知识增强 <small>检索正确不等于回答正确</small></summary><div class="qa-list">
        <div class="qa"><b>25. RAG 主要解决什么核心问题？</b><p><strong>Answer：</strong>RAG 把外部、最新或私有知识在生成前检索进上下文，缓解模型知识过时、缺少领域知识和无法引用来源的问题。它不等于事实保证，召回、上下文组织和生成仍可能出错，所以要结合版本、权限、引用和评测。</p></div>
        <div class="qa"><b>26. RAG 召回正确但模型回答错误，怎么解决？</b><p><strong>Answer：</strong>先确认上下文是否完整、排序是否合理、是否存在冲突或过期版本，再检查提示词、答案格式和模型推理能力。可以做重排、上下文压缩、证据分组、引用约束、结构化抽取、二次核验或让模型先回答再验证；高风险场景证据不足就拒答或转人工，并把 bad case 加入回归集。</p></div>
        <div class="qa"><b>27. 为什么混合检索常用 RRF，而不是直接加权融合？</b><p><strong>Answer：</strong>关键词和向量检索的分数尺度、分布和含义不同，直接加权需要长期调权且容易被某一路尺度影响。RRF 只使用排名，把多个结果列表中靠前的文档累加排名贡献，对尺度不敏感、实现简单，适合作为稳健基线；需要精细优化时再做学习排序或校准分数。</p></div>
        <div class="qa"><b>28. RRF 的原理是什么，k 值怎么选？</b><p><strong>Answer：</strong>对每个结果列表中的文档按排名累加 <code>1/(k+rank)</code>，出现在多个列表且排名靠前的文档分数更高。k 控制排名衰减，k 大时更平滑、对中后段结果更宽容，k 小时更强调头部。实际按候选集大小、召回质量和离线验证调参，不把默认值当定律。</p></div>
        <div class="qa"><b>29. 语义检索和关键词检索各有什么优缺点？</b><p><strong>Answer：</strong>语义检索能处理同义表达和自然语言问题，但对精确编号、专有名词和新词可能不稳；关键词检索可解释、擅长精确匹配和过滤，但对改写和同义表达不敏感。企业场景通常混合召回，再用元数据过滤和 rerank，兼顾 Recall、精确性和可解释性。</p></div>
        <div class="qa"><b>30. RAG 如何缓解大模型幻觉？</b><p><strong>Answer：</strong>先用可靠检索把相关证据放进上下文，再要求回答绑定来源、版本和适用范围；对证据冲突、未命中或高风险问题进行澄清、拒答或转人工。还要用事实核验、引用正确率和真实 bad case 回归评估。RAG 是缩小无依据生成空间，不是彻底消除幻觉。</p></div>
      </div></details>
      <details open><summary>五、大模型基础原理 <small>Transformer、位置编码与 MoE</small></summary><div class="qa-list">
        <div class="qa"><b>31. 自注意力的完整计算流程是什么？</b><p><strong>Answer：</strong>输入经过线性映射得到 Q、K、V，计算 <code>softmax(QKᵀ/√dₖ)V</code>，得到每个 token 对其他 token 的加权表示，再经过输出投影。注意力让每个位置按内容动态聚合全序列信息，代价通常随序列长度平方增长。</p></div>
        <div class="qa"><b>32. 多头自注意力为什么比单头好？</b><p><strong>Answer：</strong>多头把表示空间切成多个子空间，每个头可以关注不同关系，例如局部语法、长距离依赖或位置模式，最后拼接融合。它不是简单增加参数，而是让模型并行学习多种关系；代价是计算和实现复杂度更高。</p></div>
        <div class="qa"><b>33. 自注意力和交叉注意力有什么区别？</b><p><strong>Answer：</strong>自注意力的 Q、K、V 来自同一序列，用于建模序列内部关系；交叉注意力的 Q 来自一个序列，K/V 来自另一个序列，用于条件信息对齐。Encoder-Decoder 模型中 Decoder 常用交叉注意力读取 Encoder 输出，多模态模型也常用它对齐文本和视觉特征。</p></div>
        <div class="qa"><b>34. 为什么 Transformer 使用缩放点积？</b><p><strong>Answer：</strong>QKᵀ 的维度增大时，点积方差会变大，进入 softmax 后容易饱和，梯度变小。除以 <code>√dₖ</code> 可以把数值尺度稳定下来，使训练更容易收敛。</p></div>
        <div class="qa"><b>35. 为什么需要位置编码？</b><p><strong>Answer：</strong>注意力本身对 token 顺序没有天然感知，位置编码把位置信息加入表示，使模型区分“人吃鱼”和“鱼吃人”。位置编码可以是绝对位置、相对位置或旋转位置等方式。</p></div>
        <div class="qa"><b>36. 常见位置编码方法及特点是什么？</b><p><strong>Answer：</strong>正弦位置编码无额外参数且可外推一定长度；可学习绝对位置编码灵活但长度受训练范围限制；相对位置编码直接建模相对距离；RoPE 通过旋转 Q/K 注入相对位置信息，兼顾实现效率和长度扩展能力。</p></div>
        <div class="qa"><b>37. RoPE 的原理及成为主流的原因？</b><p><strong>Answer：</strong>RoPE 将 Q、K 的二维子空间按位置旋转，使两个位置向量的内积自然包含相对位置差。它不需要额外位置向量，能保持注意力计算形式，并且适合与 KV Cache 配合，因此在 Decoder-only 模型中广泛使用。长上下文扩展仍需要额外的频率缩放或位置插值。</p></div>
        <div class="qa"><b>38. MoE 的核心原理是什么？</b><p><strong>Answer：</strong>MoE 用多个 Expert 和一个 Router 组成稀疏层，每个 token 只激活 Top-K 个 Expert，激活参数量小于总参数量，但模型容量更大。Router 根据 token 表示分配专家，专家输出再按门控权重加权合并。</p></div>
        <div class="qa"><b>39. 为什么 MoE 通常替换 FFN，而不是注意力层？</b><p><strong>Answer：</strong>FFN 对每个 token 独立计算，天然适合按 token 路由到不同 Expert；注意力需要跨 token 交互，路由会带来复杂通信和不稳定的全局依赖。替换 FFN 能在控制通信成本的同时扩大参数容量。</p></div>
        <div class="qa"><b>40. MoE 训练的核心难点及解决方式是什么？</b><p><strong>Answer：</strong>主要是负载不均导致部分 Expert 过载、路由塌缩、跨设备通信和训练不稳定。常用辅助负载均衡损失、容量因子与 token 丢弃策略、Router 稳定化、Expert 并行和通信优化；同时监控各 Expert 的负载、溢出率和训练质量。</p></div>
        <div class="qa"><b>41. MoE 与稠密模型的优缺点是什么？</b><p><strong>Answer：</strong>MoE 总参数容量大、每 token 激活计算较少，适合扩展模型能力，但实现复杂、通信成本高、负载均衡难；稠密模型结构简单、训练和部署稳定，但同等容量下每次推理都要激活全部参数。选择要看训练资源、服务吞吐和工程复杂度。</p></div>
        <div class="qa"><b>42. Model Harness、Generation Loop、Agent Loop 分别是什么？</b><p><strong>Answer：</strong>Model Harness 是围绕模型调用的工程封装，负责配置、输入输出、重试和评测；Generation Loop 是逐 token 或逐步生成文本直到结束的生成循环；Agent Loop 是更高层的任务循环，包含模型决策、工具执行、观察回填、状态更新和终止判断。三者不要混为一个概念。</p></div>
      </div></details>
      <details open><summary>六、流式输出与幻觉治理 <small>用户体验和可靠性</small></summary><div class="qa-list">
        <div class="qa"><b>43. Agent 流式输出为什么常用 SSE 而不是 WebSocket？</b><p><strong>Answer：</strong>大多数 Agent 输出是服务端单向推送，SSE 基于 HTTP，接入简单、天然支持文本事件、自动重连和代理基础设施；WebSocket 是双向长连接，适合客户端也要高频实时发送消息的场景。SSE 不是绝对更好，要按是否双向、连接时长、代理兼容和消息类型选择。</p></div>
        <div class="qa"><b>44. SSE 和 WebSocket 的适用场景分别是什么？</b><p><strong>Answer：</strong>SSE 适合大模型 token 流、进度通知、服务端事件推送等一对多或服务端单向场景；WebSocket 适合协同编辑、实时游戏、语音/桌面控制等低延迟双向通信。两者都要处理心跳、断线重连、鉴权、背压和消息顺序。</p></div>
        <div class="qa"><b>45. 大模型幻觉能完全消除吗？为什么？</b><p><strong>Answer：</strong>不能保证完全消除。模型本质是条件概率生成器，训练数据、检索、上下文、工具结果或提示约束不完整时，都可能生成看似合理但无依据的内容。工程目标是降低发生概率、缩小影响范围，并让错误可发现、可追溯、可修复。</p></div>
        <div class="qa"><b>46. 工业界缓解幻觉的主流方案有哪些？</b><p><strong>Answer：</strong>知识侧做来源、版本、权限和有效期治理；检索侧做混合召回、重排和证据覆盖；生成侧使用结构化约束、引用、拒答和置信度边界；工具侧做白名单、参数校验和结果核验；上线后用离线回归、人工抽检、bad case 分类、监控和人工兜底闭环。</p></div>
      </div></details>
      <details open><summary>七、中间件与数据库 <small>Redis、MySQL 与缓存一致性</small></summary><div class="qa-list">
        <div class="qa"><b>47. Redis 核心数据类型及适用场景？</b><p><strong>Answer：</strong>String 适合缓存、计数和分布式锁；Hash 适合对象字段；List 适合队列或时间线；Set 适合去重和集合运算；Sorted Set 适合排行榜和按分值排序；Stream 适合持久化消费队列。选择时还要考虑访问模式、过期策略和数据规模。</p></div>
        <div class="qa"><b>48. 本地缓存 + Redis 多级缓存如何保证一致性？</b><p><strong>Answer：</strong>先明确一致性目标和可接受延迟，常见写路径是更新数据库后删除 Redis，再通过消息或订阅让本地缓存失效；读取未命中时回源并设置 TTL。配合版本号、逻辑过期、互斥重建和短暂延迟双删降低并发窗口，关键数据仍以数据库为准。</p></div>
        <div class="qa"><b>49. 为什么缓存更新通常是先更库、后删缓存？</b><p><strong>Answer：</strong>先删缓存再更新数据库时，并发读可能把旧值重新写回缓存，形成较长的不一致窗口；先更新数据库再删缓存，后续读会从新库回填。它仍不是绝对原子，需要处理删除失败、并发回填和热点问题，可用重试、消息补偿或延迟双删增强可靠性。</p></div>
        <div class="qa"><b>50. MySQL 事务的四个隔离级别是什么？</b><p><strong>Answer：</strong>读未提交允许脏读；读已提交避免脏读但可能不可重复读；可重复读保证同一事务多次读取同一行结果一致，但要理解幻读和锁机制；串行化通过更强锁或串行执行避免并发异常，但吞吐最低。MySQL InnoDB 默认是可重复读。</p></div>
        <div class="qa"><b>51. 各隔离级别解决什么异常，还剩什么问题？</b><p><strong>Answer：</strong>读未提交可能脏读、不可重复读和幻读；读已提交解决脏读，仍可能不可重复读和幻读；可重复读通过 MVCC 快照读保证一致性，当前读配合 next-key lock 抑制范围插入，但具体行为取决于索引和读方式；串行化基本避免这些异常，但并发性能和锁冲突最差。</p></div>
        <div class="qa"><b>52. InnoDB 在可重复读级别做了什么增强？</b><p><strong>Answer：</strong>InnoDB 使用 MVCC 和 Read View 让快照读在事务内看到一致版本；对当前读使用记录锁、间隙锁和 next-key lock，阻止范围内并发插入，从而降低幻读。要注意快照读和当前读走的机制不同，不能简单说“RR 永远没有幻读”。</p></div>
        <div class="qa"><b>53. 快照读和当前读的区别是什么？</b><p><strong>Answer：</strong>快照读通常是普通 <code>SELECT</code>，读取 MVCC 生成的历史版本，不主动加锁；当前读包括 <code>SELECT ... FOR UPDATE</code>、<code>UPDATE</code>、<code>DELETE</code>，读取最新已提交版本并加锁。需要一致性视图时用快照读，需要锁住最新记录并防止并发修改时用当前读。</p></div>
      </div></details>
